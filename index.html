<html lang="en">
<head>
<meta charset="UTF-8"/>

<title>Car Configurator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600&family=Inconsolata:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0b;--panel:#101013;--border:#1c1c22;--accent:#c8a96e;--a2:#4a8cff;--ok:#4caf7d;--hot:#ff6b35;--cam:#9b59b6;--text:#e2ddd6;--muted:#52526a;--pw:300px}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif}
canvas{display:block}
#panel{position:fixed;top:0;right:0;width:var(--pw);height:100%;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;z-index:10;transition:transform 0.3s cubic-bezier(0.2,0.8,0.2,1)}
#panel.closed{transform:translateX(100%)}
#ptab{position:absolute;top:50%;left:-28px;width:28px;height:60px;transform:translateY(-50%);background:var(--panel);border:1px solid var(--border);border-right:none;border-radius:6px 0 0 6px;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;z-index:11;transition:color 0.15s}
#ptab:hover{color:var(--accent)}
@media (max-width:768px){:root{--pw:85%}}
#ph{padding:22px 18px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
#ph h1{font-size:17px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
#ph p{font-size:10px;color:var(--muted);letter-spacing:.14em;margin-top:3px;font-family:'Inconsolata',monospace}
#tabnav{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.tnb{flex:1;padding:8px 4px;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:'Rajdhani',sans-serif;font-size:10px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:all .18s}
.tnb:hover{color:var(--text)}
.tnb.active{border-bottom-color:var(--accent);color:var(--accent)}
.tabpane{display:none}.tabpane.active{display:block}
#pb{flex:1;overflow-y:auto;padding:14px 14px 24px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.sec{margin-bottom:18px}
.st{font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.st::after{content:'';flex:1;height:1px;background:var(--border)}
.vg{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.vc{padding:9px 10px;background:var(--bg);border:1px solid var(--border);border-radius:4px;cursor:pointer;transition:background .08s,color .08s,border-color .08s,opacity .08s;font-size:12px;letter-spacing:.07em;text-align:center;color:var(--muted)}
.vc:hover{border-color:var(--accent);color:var(--text)}.vc.active{border-color:var(--accent);color:var(--accent);background:#161208}
.gl{font-size:9px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin:10px 0 5px}
.tr{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:4px}
.tb{padding:5px 11px;background:var(--bg);border:1px solid var(--border);border-radius:3px;cursor:pointer;transition:all .15s;font-family:'Rajdhani',sans-serif;font-size:12px;letter-spacing:.05em;color:var(--muted)}
.tb:hover{border-color:var(--a2);color:var(--text)}.tb.active{border-color:var(--a2);color:var(--a2);background:#080f1e}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:5px}
.pb2{padding:7px 9px;background:var(--bg);border:1px solid var(--border);border-radius:3px;cursor:pointer;transition:all .15s;font-family:'Rajdhani',sans-serif;font-size:11px;letter-spacing:.07em;color:var(--muted);text-align:center}
.pb2:hover{border-color:var(--ok);color:var(--text)}.pb2.active{border-color:var(--ok);color:var(--ok);background:#071410}
.gb{width:100%;margin-bottom:5px;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:3px;cursor:pointer;transition:all .15s;font-family:'Rajdhani',sans-serif;font-size:12px;letter-spacing:.08em;color:var(--muted);text-align:left;display:flex;align-items:center;gap:8px}
.gb::before{content:'◈';font-size:10px;color:var(--accent)}
.gb:hover{border-color:var(--accent);color:var(--text)}.gb.active{border-color:var(--accent);color:var(--accent);background:#161208}
.at{width:100%;padding:7px;background:transparent;border:1px solid var(--border);border-radius:3px;color:var(--muted);font-family:'Rajdhani',sans-serif;font-size:10px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;margin-top:14px;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:7px}
.at:hover{border-color:var(--muted);color:var(--text)}
#as{display:none;margin-top:14px}#as.open{display:block}
.sr{margin-bottom:7px}.sr label{display:block;font-size:9px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-bottom:3px}
.sr select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:5px 9px;border-radius:3px;font-family:'Rajdhani',sans-serif;font-size:13px;outline:none;cursor:pointer;appearance:none}
.sr select:focus{border-color:var(--a2)}
#ld{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity .5s}
#ld.hidden{opacity:0;pointer-events:none}
#lbw{width:180px;height:1px;background:var(--border);margin-top:18px}
#lb{height:100%;width:0%;background:var(--accent);transition:width .25s}
#lt{font-size:10px;letter-spacing:.3em;color:var(--muted);margin-top:10px;font-family:'Inconsolata',monospace}
#st{position:fixed;bottom:14px;left:18px;font-size:9px;letter-spacing:.2em;color:var(--muted);font-family:'Inconsolata',monospace;z-index:10}
.nested-grp{margin-left:10px;padding-left:8px;border-left:1px solid var(--border);margin-top:6px;display:none}
.nested-grp.open{display:block}
.anim-btn{width:100%;margin-bottom:5px;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:3px;cursor:pointer;transition:background .08s,color .08s,border-color .08s,opacity .08s;font-family:'Rajdhani',sans-serif;font-size:12px;letter-spacing:.08em;color:var(--muted);text-align:left;display:flex;align-items:center;gap:8px}
.anim-btn:hover{border-color:var(--accent);color:var(--text)}
.anim-btn.playing{border-color:var(--accent);color:var(--accent);background:#161208}
.anim-btn .anim-play-icon{margin-left:auto;font-size:10px;color:var(--accent);opacity:0;transition:opacity .15s}
.anim-btn.playing .anim-play-icon{opacity:1}
.cam-btn{width:100%;margin-bottom:5px;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:3px;cursor:pointer;transition:background .08s,color .08s,border-color .08s,opacity .08s;font-family:'Rajdhani',sans-serif;font-size:12px;letter-spacing:.08em;color:var(--muted);text-align:left;display:flex;align-items:center;gap:8px}
.cam-btn::before{content:'◎';font-size:10px;color:var(--cam)}
.cam-btn:hover{border-color:var(--cam);color:var(--text)}
.cam-btn.active{border-color:var(--cam);color:var(--cam);background:#100a18}
.tt-btn{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:3px;cursor:pointer;transition:background .08s,color .08s,border-color .08s,opacity .08s;font-family:'Rajdhani',sans-serif;font-size:12px;letter-spacing:.08em;color:var(--muted);text-align:left;display:flex;align-items:center;gap:8px;margin-bottom:5px}
.tt-btn::before{content:'↻';font-size:13px;color:var(--cam)}
.tt-btn:hover{border-color:var(--cam);color:var(--text)}
.tt-btn.active{border-color:var(--cam);color:var(--cam);background:#100a18}
.cin-btn{width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--hot);border-radius:3px;cursor:pointer;transition:background .08s,color .08s,border-color .08s,opacity .08s;font-family:'Rajdhani',sans-serif;font-size:12px;letter-spacing:.1em;color:var(--hot);text-align:left;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cin-btn::before{content:'▶';font-size:10px}
.cin-btn:hover{background:#1a0d08;color:var(--text)}
.cin-btn.playing{background:#1a0d08;color:var(--text)}
#sfx-toggle{position:fixed;left:14px;bottom:14px;z-index:8;padding:7px 11px;background:var(--panel);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:10px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:7px;transition:all .15s;opacity:.85}
#sfx-toggle:hover{border-color:var(--accent);color:var(--text);opacity:1}
#sfx-toggle .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok);transition:all .15s}
#sfx-toggle.off{color:var(--muted)}
#sfx-toggle.off .dot{background:var(--muted);box-shadow:none}
#ar-btn{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:9;padding:9px 16px;background:var(--accent);border:1px solid var(--accent);border-radius:4px;color:#0b0b0b;font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .15s;box-shadow:0 2px 14px rgba(0,0,0,.35)}
#ar-btn:hover{filter:brightness(1.1)}
#ar-btn:active{transform:translateX(-50%) scale(.97)}
#ar-exit{position:fixed;top:14px;right:14px;z-index:10000;padding:8px 14px;background:rgba(0,0,0,.6);border:1px solid #fff;border-radius:4px;color:#fff;font-family:'Rajdhani',sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;display:none}
#ar-hint{position:fixed;left:50%;transform:translateX(-50%);bottom:64px;z-index:10000;padding:8px 14px;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;font-family:'Rajdhani',sans-serif;font-size:11px;letter-spacing:.08em;display:none;text-align:center}
.cin-btn.playing::before{content:'■'}
#hotspot-layer{position:fixed;inset:0;pointer-events:none;z-index:5}
.hs-sprite{position:absolute;pointer-events:none;transform:translate(-50%,-50%);display:none}
.hs-ring{width:44px;height:44px;border-radius:50%;border:2px solid var(--hot);opacity:.85;animation:hs-pulse 1.8s ease-in-out infinite}
.hs-dot{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:9px;height:9px;border-radius:50%;background:var(--hot)}
@keyframes hs-pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.4);opacity:.35}}
.hs-sprite.clickable{pointer-events:auto;cursor:pointer}
</style>

  const x=(r[0]||0)*d2r;

  const scaleMultiplier = Math.max(0.001, Math.abs(h.ground_scale != null ? h.ground_scale : 1));

  try{

    // convention as _envEuler(), but reading the decoupled ground value.
    const rotZ=(h.ground_rotation_z||0)*Math.PI/180;

    const offY=(h.ground_offset&&h.ground_offset[1])||0;

    // it never touches the shape math above (shaderHeight/shaderRadius).
    // Blender Z and three.js Y are the same up-axis here.
    const zOffset = h.ground_z_offset||0;

    _groundSky.position.set(offX, floorZ * (1 - scaleMultiplier) + zOffset, offY);

  const d2r=Math.PI/180;
  const y=-((rotZdeg||0)+_ENV_AZIMUTH_OFFSET_DEG)*d2r;

      // the node is shown again).

  // settle node visibility, so we never strand a mesh on a clone or hidden state.
  const meshSet=new Set(meshes);

    if(tw.meshes.some(r=>meshSet.has(r.mesh))){

    isOn:()=>enabled,

  };
})();

(function _wireSfx(){
  const b=document.getElementById('sfx-toggle');
  if(b) b.addEventListener('click', ()=>SFX.toggle());
  SFX.init();
})();

const _grade = _initHdri || CFG.grade || {};
const _bloomStrength = (_initHdri ? _initHdri.grade_bloom : _grade.bloom) ?? 0.25;
const comp=new EffectComposer(renderer);
comp.addPass(new RenderPass(scene,cam));
// Bloom is the most expensive pass (multi-pass down/up sample) — only add it
// if at least one switchable HDRI actually wants it. If added, its strength
// becomes live-adjustable per item in _applyHDRITexture() below.
const _anyBloom = (CFG.hdris||[]).some(h => (h.grade_bloom||0) > 0) || _bloomStrength > 0;
let bloomPass=null;
if(_anyBloom){
  bloomPass=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),
    _bloomStrength,0.4,0.88);
  comp.addPass(bloomPass);
}
comp.addPass(new OutputPass());

// ── Look grade: brightness / contrast / saturation, applied on the tone-mapped
//    (display-referred) image as a final pass so the sliders behave like an
//    intuitive photo grade. Driven per-HDRI-item now (see _applyHDRITexture);
//    seeded here from the default item / legacy CFG.grade for first paint.
const _GradeShader = {
  uniforms: {
    tDiffuse:   { value: null },
    brightness: { value: (_initHdri ? _initHdri.grade_brightness : _grade.brightness) ?? 1.0 },
    contrast:   { value: (_initHdri ? _initHdri.grade_contrast   : _grade.contrast)   ?? 1.0 },
    saturation: { value: (_initHdri ? _initHdri.grade_saturation : _grade.saturation) ?? 1.0 },
  },
  vertexShader: `
    varying vec2 vUv;
    void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float brightness; uniform float contrast; uniform float saturation;
    varying vec2 vUv;
    void main(){
      vec4 c=texture2D(tDiffuse,vUv);
      vec3 col=c.rgb*brightness;
      col=(col-0.5)*contrast+0.5;
      float l=dot(col,vec3(0.2126,0.7152,0.0722));
      col=mix(vec3(l),col,saturation);
      gl_FragColor=vec4(clamp(col,0.0,1.0),c.a);
    }
  `,
};
const gradePass=new ShaderPass(_GradeShader);
comp.addPass(gradePass);

// Cheap antialiasing: a single FXAA pass at the very end smooths edges for a
// fraction of MSAA's cost (one fragment shader pass, no extra render targets).
const fxaaPass=new ShaderPass(FXAAShader);
function _updateFXAA(){
  const pr=renderer.getPixelRatio();
  fxaaPass.material.uniforms['resolution'].value.set(1/(innerWidth*pr), 1/(innerHeight*pr));
}
_updateFXAA();
comp.addPass(fxaaPass);

window.addEventListener('resize',()=>{
  cam.aspect=innerWidth/innerHeight; _updateCamFov(); cam.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); comp.setSize(innerWidth,innerHeight);
  _updateFXAA();
  requestRender(400);
});

const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();

// ── ANIMATION SYSTEM ─────────────────────────────────────────────────────

const animState={}, animMixers={}, animClips={};
window.animState=animState;
const _clock=new THREE.Clock();

// Per-control/combo ping-pong direction (+1 / -1), mirrors core pingpong_dir.
const _pingDir={};
// Active segment watchers keyed by mixer key: {action, target, dir}. The tick
// loop stops an action exactly at `target` clip-time (LoopOnce only clamps at a
// clip's natural end, so interior state holds need a manual watcher).
const _segWatch={};
window._segWatch=_segWatch;         // expose so ui.js executeSequence can observe it
const _segBtnMap={};   // clip key → anim def name
const _animBtnKeys={};  // def name → Set of live clip keys
window._animBtnKeys=_animBtnKeys;  // expose to ui.js (button highlight tracking)

// Hover toggle (perpetual): two baked clips — "Hover" (rise/drop) and
// "HoverLoop" (seamless bob+spin loop). Captured by _initAnimMixers.
let _hoverMixer=null,_hoverRiseClip=null,_hoverLoopClip=null;
let _hoverOn=false,_hoverLoopAction=null;

// ── Built-in mode coordination ────────────────────────────────────────────
// Explode and Hover are whole-vehicle "modes" that own many of the same parts.
// Triggering anything else must take over from them, so the user never has to
// stop them manually. We snap an interrupted mode back to its rest pose using
// the clip's own frame 0 (robust — no scene-graph name lookups needed).
const _builtinActive={Explode:false,Hover:false};

function _snapToClipStart(mixer,clip){
  if(!mixer||!clip) return;
  mixer.stopAllAction();
  const a=mixer.clipAction(clip);
  a.reset(); a.enabled=true; a.weight=1; a.timeScale=1; a.time=0; a.play();
  mixer.update(0);            // apply frame 0 (rest) to the bound nodes
  mixer.stopAllAction();
}

function _resetBuiltin(name){
  if(name==='Hover'){
    _snapToClipStart(_hoverMixer,_hoverRiseClip);   // grounded pose
    _hoverOn=false; _hoverLoopAction=null;
  } else {   // Explode
    delete _segWatch[_resolveAnimKey(name)];
    _snapToClipStart(animMixers[name],(animClips[name]||[])[0]);  // assembled pose
    animState[name]=0;
    const sp=document.querySelector(`.anim-btn[data-anim="${name}"] .anim-state`);
    if(sp) sp.textContent='[0/1]';
  }
  const b=document.querySelector(`.anim-btn[data-anim="${name}"]`);
  if(b) b.classList.remove('playing');
  _builtinActive[name]=false;
}

function _stopOtherBuiltins(name){
  ['Explode','Hover'].forEach(b=>{ if(b!==name && _builtinActive[b]) _resetBuiltin(b); });
}

// Snap a single control/combo-member to its rest pose (clip frame 0) and stop
// its mixer so a clamped action stops writing.
function _snapControlToRest(cn){
  const k=_resolveAnimKey(cn);
  delete _segWatch[k];
  _snapToClipStart(animMixers[k],(animClips[k]||[])[0]);
  animState[cn]=0; animState[k]=0;
  const b=document.querySelector(`.anim-btn[data-anim="${cn}"]`);
  if(b) b.classList.remove('playing');
}

// Return every regular control and combo to rest. Called when a built-in mode
// (Explode / Hover) starts, so it takes over the vehicle cleanly instead of
// stacking on top of whatever controls were left open.
function _resetAllRegular(){
  // Primary triggers
  allAnimDefs().forEach(def=>{
    if(def.builtin) return;                       // skip the Explode/Hover entries
    if(Array.isArray(def.members)) def.members.forEach(_snapControlToRest);
    else _snapControlToRest(def.name);
    animState[def.name]=0;
    const b=document.querySelector(`.anim-btn[data-anim="${def.name}"]`);
    if(b){
      b.classList.remove('playing');
      const sp=b.querySelector('.anim-state');
      if(sp) sp.textContent=_animLabel(def,0);
    }
  });
}

function toggleHover(def){
  if(!_hoverMixer||!_hoverRiseClip) return;
  const btn=document.querySelector(`.anim-btn[data-anim="${def.name}"]`);
  if(!_hoverOn){
    // ── Turn ON: play the rise once, then cross-fade into the perpetual loop.
    _stopOtherBuiltins('Hover');     // take over from Explode if it's active
    _resetAllRegular();              // and from any open controls/combos
    _hoverOn=true; _builtinActive.Hover=true;
    if(btn) btn.classList.add('playing');
    if(def.sounds && def.sounds[1]) SFX.playFile(def.sounds[1]);
    _hoverMixer.stopAllAction();
    const rise=_hoverMixer.clipAction(_hoverRiseClip);
    rise.setLoop(THREE.LoopOnce,1); rise.clampWhenFinished=true;
    rise.reset(); rise.enabled=true; rise.timeScale=1; rise.time=0; rise.play();
    if(_hoverLoopClip){
      const loop=_hoverMixer.clipAction(_hoverLoopClip);
      loop.setLoop(THREE.LoopRepeat,Infinity); loop.clampWhenFinished=false;
      _hoverLoopAction=loop;
      const onFin=(e)=>{
        if(e.action!==rise) return;
        _hoverMixer.removeEventListener('finished',onFin);
        if(!_hoverOn) return;          // user already toggled off mid-rise
        loop.reset(); loop.enabled=true; loop.timeScale=1; loop.play();
        rise.crossFadeTo(loop,0.3,false);
      };
      _hoverMixer.addEventListener('finished',onFin);
    }
  } else {
    // ── Turn OFF: cross-fade from the loop into the reversed rise (= drop).
    _hoverOn=false; _builtinActive.Hover=false;
    if(btn) btn.classList.remove('playing');
    const drop=_hoverMixer.clipAction(_hoverRiseClip);  // same action instance
    drop.setLoop(THREE.LoopOnce,1); drop.clampWhenFinished=true;
    drop.enabled=true; drop.paused=false;
    drop.timeScale=-1; drop.time=_hoverRiseClip.duration; drop.play();
    if(_hoverLoopAction){ _hoverLoopAction.crossFadeTo(drop,0.3,false); _hoverLoopAction=null; }
    // The drop/cross-fade plays after _hoverOn is already false — keep drawing.
    if(typeof _animActiveUntil!=='undefined') _animActiveUntil=performance.now()+1200;
  }
}

function allAnimDefs(){
  const c=CFG.animations||{};
  return [...(c.controls||[]),...(c.combos||[])];
}

// Button label for a control/combo at a given state index: "<state name> [i/max]".
// state_names come from core.py (per-state for controls; derived+deduped for
// combos). Falls back to the bare counter when no name is present.
// _animLabel -> ui.js
// Compute the next state index, mirroring core.py OBJECT_OT_AnimSetTrigger:
//   • <=1 state  → always 0
//   • 2 states   → plain toggle 0↔1 (reverse-close), regardless of mode. This
//                  keeps built-ins and simple open/close controls behaving as a
//                  bidirectional toggle.
//   • >2 states  → LOOP (0→1→…→N-1 then snap-to-0 and on to 1) or PINGPONG
//                  (0→1→…→N-1→…→1→0→…). `wrap` flags the instant snap-to-0 that
//                  LOOP does at the end of the cycle before re-advancing.
function _stepState(prev,total,mode,name){
  if(total<=1) return {next:0,wrap:false};
  if(total===2) return {next:(prev+1)%2,wrap:false};
  if(mode==='PINGPONG'){
    let dir=_pingDir[name]??1;
    if(prev>=total-1&&dir===1) dir=-1;
    else if(prev<=0&&dir===-1) dir=1;
    _pingDir[name]=dir;
    return {next:Math.max(0,Math.min(prev+dir,total-1)),wrap:false};
  }
  // LOOP
  if(prev>=total-1) return {next:1,wrap:true};   // snap to 0, then advance to 1
  return {next:prev+1,wrap:false};
}

function triggerAnim(name){
  const defs=allAnimDefs();
  const def=defs.find(d=>d.name===name);
  if(!def) return;

  // Hover is a perpetual on/off toggle, handled by its own state machine.
  if(def.builtin==='hover'){ toggleHover(def); return; }

  // Any explicit trigger takes over the vehicle: stop whichever built-in mode
  // (Explode / Hover) is running, unless it's the one being triggered now.
  _stopOtherBuiltins(name);

  const total=def.states??2;
  const mode=def.playback_mode||'LOOP';
  const prev=animState[name]??0;
  const {next,wrap}=_stepState(prev,total,mode,name);

  // Resolve what to drive FIRST, and snapshot each drive's TRUE current state
  // before anything below overwrites animState. A control drives itself with
  // its own state_fracs; a combo fans out to its members, each with its own
  // member_fracs. Members with fewer states clamp (index capped to their
  // frac list length). The snapshot is essential: for a single control the
  // resolved key is usually the same string as its own name, so reading
  // animState[key] AFTER animState[name] is set below would read the value
  // that was just overwritten — collapsing mFrom to equal mTo and causing an
  // instant snap instead of a smooth transition.
  let drives;
  if(Array.isArray(def.members)){
    drives=def.members.map(m=>({
      m, key:_resolveAnimKey(m),
      fracs:(def.member_fracs&&def.member_fracs[m])||[0,1]
    }));
  }else{
    drives=[{m:name, key:_resolveAnimKey(name), fracs:def.state_fracs||[0,1]}];
  }
  const _snapshot=drives.map(d=>animState[d.key]??0);

  animState[name]=next;

  // Sound mapped to the state we're transitioning into.
  if(def.sounds&&def.sounds[next]) SFX.playFile(def.sounds[next]);

  // This trigger's OWN button only. Controls and combos are visually and
  // functionally independent — a combo never lights up an individual part's
  // button (and vice versa), even if the combo internally drives that part.
  // Button lit only while drives are actively transitioning in _segWatch.
  // Decision is deferred until after drives.forEach so we can check which
  // keys actually entered _segWatch (zero-length holds do not).
  const _trigBtn=document.querySelector(`.anim-btn[data-anim="${name}"]`);

  if(def.builtin==='explode'){
    _builtinActive.Explode=(next!==0);
    if(next!==0) _resetAllRegular();   // take over from any open controls/combos
  }

  drives.forEach(({m,key,fracs},_i)=>{
    const fLen=Math.max(1,fracs.length);
    const curState=_snapshot[_i];
    const mFrom=wrap?0:Math.min(curState,fLen-1);
    const mTo=Math.min(next,fLen-1);
    animState[key]=mTo;
    _playMemberSegment(key,fracs,mFrom,mTo);
  });
  // Light button only if ≥1 drive is actually animating in _segWatch.
  // Zero-length holds (part already at target) never enter _segWatch.
  if(_trigBtn){
    const _liveKeys=drives.map(d=>d.key).filter(k=>_segWatch[k]);
    if(_liveKeys.length>0){
      _trigBtn.classList.add('playing');
      _animBtnKeys[name]=new Set(_liveKeys);
      _liveKeys.forEach(k=>{_segBtnMap[k]=name;});
    }else{
      _trigBtn.classList.remove('playing');
    }
  }

  // Keep the render loop awake while this trigger plays out (segment watchers
  // cover long clips precisely; this bridges short / clamped-hold steps).
  if(typeof _animActiveUntil!=='undefined') _animActiveUntil=performance.now()+1500;
}

/**
 * Drive an animation directly to an explicit target state index, bypassing
 * _stepState entirely. Used by sequences so any state — including 0 (rest) —
 * is reachable without the click-cycling hack of setting animState to target-1
 * and hoping _stepState increments correctly.
 */
function flyToAnimState(name, targetState){
  const defs=allAnimDefs();
  const def=defs.find(d=>d.name===name);
  if(!def) return;
  const total=def.states??2;
  const tgt=Math.max(0,Math.min(targetState,total-1));

  // Resolve drives — same logic as triggerAnim.
  let drives;
  if(Array.isArray(def.members)){
    drives=def.members.map(m=>({
      m, key:_resolveAnimKey(m),
      fracs:(def.member_fracs&&def.member_fracs[m])||[0,1]
    }));
  }else{
    drives=[{m:name, key:_resolveAnimKey(name), fracs:def.state_fracs||[0,1]}];
  }

  // Snapshot actual current state of each drive BEFORE writing animState.
  const snap=drives.map(d=>animState[d.key]??0);

  // Commit new state.
  animState[name]=tgt;

  // Play each drive from its current position to the explicit target.
  drives.forEach(({key,fracs},i)=>{
    const fLen=Math.max(1,fracs.length);
    const mFrom=Math.min(snap[i],fLen-1);
    const mTo=Math.min(tgt,fLen-1);
    animState[key]=mTo;
    _playMemberSegment(key,fracs,mFrom,mTo);
  });

  // Button highlight — same pattern as triggerAnim.
  const _trigBtn=document.querySelector(`.anim-btn[data-anim="${name}"]`);
  if(_trigBtn){
    const liveKeys=drives.map(d=>d.key).filter(k=>_segWatch[k]);
    if(liveKeys.length>0){
      _trigBtn.classList.add('playing');
      _animBtnKeys[name]=new Set(liveKeys);
      liveKeys.forEach(k=>{_segBtnMap[k]=name;});
    }else{
      _trigBtn.classList.remove('playing');
    }
  }

  // Fire state-specific sound if configured.
  if(def.sounds&&def.sounds[tgt]) SFX.playFile(def.sounds[tgt]);
  if(typeof _animActiveUntil!=='undefined') _animActiveUntil=performance.now()+1500;
}

// Snap each control/combo to its configured default_state on first load — no
// animation, just place it at the target pose. Built-ins (Explode/Hover) and
// anything without a default_state stay at rest (state 0).
function _applyDefaultAnimStates(){
  allAnimDefs().forEach(def=>{
    if(def.builtin) return;
    const total=def.states??2;
    const ds=Math.max(0,Math.min(def.default_state||0,total-1));
    if(ds<=0) return;                       // already at rest
    animState[def.name]=ds;
    // Set ping-pong direction so the next click steps sensibly from this pose.
    if((def.playback_mode||'LOOP')==='PINGPONG')
      _pingDir[def.name]=(ds>=total-1)?-1:1;

    let drives;
    if(Array.isArray(def.members)){
      drives=def.members.map(m=>({
        m, key:_resolveAnimKey(m),
        fracs:(def.member_fracs&&def.member_fracs[m])||[0,1]
      }));
    }else{
      drives=[{m:def.name, key:_resolveAnimKey(def.name), fracs:def.state_fracs||[0,1]}];
    }
    drives.forEach(({m,key,fracs})=>{
      const fLen=Math.max(1,fracs.length);
      const mTo=Math.min(ds,fLen-1);
      animState[key]=mTo;
      // from==to → _playMemberSegment takes its hold branch: instant snap, no play.
      _playMemberSegment(key,fracs,mTo,mTo);
    });

    const btn=document.querySelector(`.anim-btn[data-anim="${def.name}"]`);
    if(btn){
      btn.classList.toggle('playing',ds!==0);
    }
  });
  if(typeof requestRender==='function') requestRender(300);
}

/**
 * Play animation clip for a part.
 * state 0  = play reversed (close/retract) when single-clip toggle.
 * state >0 = play forward.
 * Mixer is always on root so GLTF node bindings resolve correctly.
 */
// Resolve a control/combo-member name to the key it was actually bound under.
// Combo members are stored as part names (which may contain spaces), while GLB
// clips get sanitized to underscores — so try both forms (and case-insensitive).
function _resolveAnimKey(name){
  if(animMixers[name]) return name;
  const us=name.replace(/ /g,'_'); if(animMixers[us]) return us;
  const sp=name.replace(/_/g,' '); if(animMixers[sp]) return sp;
  const lk=Object.keys(animMixers).find(k=>
    k.toLowerCase()===name.toLowerCase() || k.toLowerCase()===us.toLowerCase());
  return lk||name;
}

/**
 * Play a member's clip SEGMENT between two state positions and hold at the
 * target. `fracs` are normalized 0..1 positions along the single baked clip
 * (procedural: one per state; keyframe / 2-state: [0,1]). Forward or reverse is
 * inferred from the two endpoints. A zero-length segment (clamped member) just
 * holds at the pose. The interior stop is enforced by the _segWatch tick loop,
 * since three's LoopOnce only clamps at a clip's natural end.
 */
function _playMemberSegment(key,fracs,fromIdx,toIdx){
  key=_resolveAnimKey(key);
  const mx=animMixers[key];
  if(!mx){console.warn('[WCE] no mixer for',key);return;}
  const clips=animClips[key]||[];
  if(!clips.length){console.warn('[WCE] no clips for',key);return;}
  const clip=clips[0];
  const dur=clip.duration||1e-6;
  const fA=fracs.length?fracs[Math.min(fromIdx,fracs.length-1)]:0;
  const fB=fracs.length?fracs[Math.min(toIdx,fracs.length-1)]:1;
  const f0=(fA==null?0:fA), f1=(fB==null?1:fB);

  mx.stopAllAction();
  delete _segWatch[key];
  const action=mx.clipAction(clip);
  action.setLoop(THREE.LoopOnce,1);
  action.clampWhenFinished=true;
  action.reset();
  action.enabled=true;
  action.weight=1;

  if(Math.abs(f1-f0)<1e-6){
    // Clamped / hold — sit at the target pose, no motion.
    action.timeScale=1;
    action.time=f1*dur;
    action.paused=true;
    action.play();
    // Use 1/60 instead of 0 — Three.js requires a non-zero delta in some
    // builds to actually flush animation bindings to the scene nodes.
    // The action is paused so its time stays at f1*dur; only the binding
    // evaluation step runs.
    mx.update(1/60);
    return;
  }

  const dir=(f1>f0)?1:-1;
  action.paused=false;
  action.timeScale=dir;
  action.time=f0*dur;
  action.play();
  // Watch for the interior target; tick loop pauses exactly there.
  _segWatch[key]={action,target:f1*dur,dir};
}

/**
 * Build mixers after GLB loads.
 * Match clips to controls by: clip name match OR track target node name match.
 * Mixer always on root — required for GLTF node binding resolution.
 */
function _initAnimMixers(gltf){
  const controls=allAnimDefs();
  // Build a set of all combo-member names so we can avoid accidentally matching
  // a member clip (e.g. "HOOD_VENTS") to a combo whose name it contains ("HOOD").
  const comboMemberNames=new Set();
  (CFG.animations&&CFG.animations.combos||[]).forEach(c=>{
    (c.members||[]).forEach(m=>{comboMemberNames.add(m); comboMemberNames.add(m.replace(/ /g,'_'));});
  });
  console.log('[WCE] GLB clips:',gltf.animations.map(c=>c.name));
  gltf.animations.forEach(clip=>{
    if(clip.name==='Hover'||clip.name==='HoverLoop'){
      if(!_hoverMixer) _hoverMixer=new THREE.AnimationMixer(root);
      if(clip.name==='HoverLoop') _hoverLoopClip=clip; else _hoverRiseClip=clip;
      console.log('[WCE] hover clip',clip.name);
      return;
    }

    // Phase 1: exact name match or ANIM_-prefixed track match (highest confidence).
    let match=controls.find(d=>{
      const s=d.name.replace(/ /g,'_');
      return clip.name===d.name || clip.name===s;
    });

    // Phase 2: track-target match (ANIM_<name> node inside the clip).
    if(!match){
      for(const track of clip.tracks){
        const nodeName=track.name.split('.')[0].replace(/\[\d+\]$/,'');
        match=controls.find(d=>{
          const s=d.name.replace(/ /g,'_');
          return nodeName==='ANIM_'+d.name || nodeName==='ANIM_'+s
              || nodeName===d.name || nodeName===s;
        });
        if(match) break;
      }
    }

    // Phase 3: substring match — but ONLY against standalone controls, never
    // against combos, and never when the clip name is itself a known combo member.
    // This prevents "HOOD_VENTS" matching the combo named "HOOD".
    if(!match && !comboMemberNames.has(clip.name) && !comboMemberNames.has(clip.name.replace(/ /g,'_'))){
      match=controls.find(d=>{
        if(Array.isArray(d.members)) return false;   // skip combos entirely
        const s=d.name.replace(/ /g,'_');
        return clip.name.toLowerCase().includes(d.name.toLowerCase())
            || clip.name.toLowerCase().includes(s.toLowerCase());
      });
    }

    if(!match){
      // No standalone control def — bind under the clip's own name so combo
      // member fan-out can resolve it via _resolveAnimKey.
      const cn=clip.name;
      if(!animMixers[cn]) animMixers[cn]=new THREE.AnimationMixer(root);
      if(!animClips[cn]) animClips[cn]=[];
      animClips[cn].push(clip);
      console.log('[WCE] clip',cn,'bound by name (no control def — combo member)');
      return;
    }
    const n=match.name;
    if(!animMixers[n]) animMixers[n]=new THREE.AnimationMixer(root);
    if(!animClips[n]) animClips[n]=[];
    animClips[n].push(clip);
    if(clip.name!==n && !animMixers[clip.name]){
      animMixers[clip.name]=animMixers[n];
      animClips[clip.name]=animClips[n];
    }
    console.log('[WCE] clip',clip.name,'-> control',n);
  });
  console.log('[WCE] animMixers keyed:',Object.keys(animMixers));
  console.log('[WCE] animClips keyed:',Object.keys(animClips));
}

function _tickMixers(){
  const dt=_clock.getDelta();
  Object.values(animMixers).forEach(mx=>mx.update(dt));
  // Stop segment actions exactly at their interior target time. LoopOnce only
  // clamps at a clip's natural end, so mid-clip state holds are enforced here.
  for(const k in _segWatch){
    const w=_segWatch[k];
    if(!w||!w.action){delete _segWatch[k];continue;}
    const t=w.action.time;
    if((w.dir>0&&t>=w.target)||(w.dir<0&&t<=w.target)){
      w.action.time=w.target;
      w.action.paused=true;
      delete _segWatch[k];
      // Clear this key from its definition's live set.
      const _dn=_segBtnMap[k];
      if(_dn&&_animBtnKeys[_dn]){
        _animBtnKeys[_dn].delete(k); delete _segBtnMap[k];
        if(_animBtnKeys[_dn].size===0){
          const _db=document.querySelector(`.anim-btn[data-anim="${_dn}"]`);
          if(_db) _db.classList.remove('playing');
          delete _animBtnKeys[_dn];
        }
      }
    }
  }
  if(_hoverMixer) _hoverMixer.update(dt);
  _cinematicMixers.forEach(mx=>mx.update(dt));
}

// ── CAMERA SYSTEM ─────────────────────────────────────────────────────────

const camCfg=CFG.cameras||{};
window.camCfg=camCfg;
const FLY_DURATION=camCfg.fly_duration??1.2;
const ZOOM_MIN=camCfg.zoom_min??CFG.camera.zoom_min??2.0;
const ZOOM_MAX=camCfg.zoom_max??CFG.camera.zoom_max??15.0;

let _flyActive=false,_flyPending=false,_flyT=0,_flyDur=FLY_DURATION;
const _flyFromPos=new THREE.Vector3(),_flyToPos=new THREE.Vector3();
const _flyFromTgt=new THREE.Vector3(),_flyToTgt=new THREE.Vector3();
const _flyDestPos=new THREE.Vector3(),_flyDestTgt=new THREE.Vector3();
let _flyDestSound=null;

let _turntableActive=false,_turntableAngle=0;
const _turntableSpeed=0.003;

let _cinematicPlaying=false,_cinematicIdx=0;
const _cinematicMixers=[],_cinematicClips=[],_cinematicNodes=[];
const _savedTarget=new THREE.Vector3(0,0.8,0);

function flyToCamera(camName){
  const def=(camCfg.static||[]).find(c=>c.name===camName);
  if(!def) return;
  
  if(def.sound) SFX.playFile(def.sound);
  const destPos=new THREE.Vector3(...def.position);
  _stopTurntable(); _stopCinematic();

  _flyDestPos.copy(destPos);
  if(def.target){
    _flyDestTgt.set(def.target[0],def.target[1],def.target[2]);
  }else{
    const _fwdEst2=new THREE.Vector3().subVectors(destPos,cam.position).normalize();
    _flyDestTgt.copy(destPos).addScaledVector(_fwdEst2,-3.0);
  }
  _flyDestSound=def.sound||null;
  _flyT=0; _flyDur=FLY_DURATION; _flyPending=true; _flyActive=false;
  document.querySelectorAll('.cam-btn').forEach(b=>b.classList.toggle('active',b.dataset.cam===camName));
  document.querySelector('.tt-btn')?.classList.remove('active');
}

function _tickFly(){
  if(!_flyActive) return;
  _flyT+=1/60/_flyDur;
  if(_flyT>=1){
    _flyT=1; _flyActive=false;
    document.querySelectorAll('.cam-btn').forEach(b=>b.classList.remove('active'));
  }
  const t=_flyT*_flyT*(3-2*_flyT);
  const tgt=new THREE.Vector3().lerpVectors(_flyFromTgt,_flyToTgt,t);
  const fromDir=new THREE.Vector3().subVectors(_flyFromPos,_flyFromTgt).normalize();
  const toDir=new THREE.Vector3().subVectors(_flyToPos,_flyToTgt).normalize();
  const fromR=_flyFromPos.distanceTo(_flyFromTgt);
  // Only clamp the DESTINATION radius — never clamp fromR.
  // If fromR < ZOOM_MIN (e.g. startup camera projected close), clamping it
  // reconstructs a different starting position and snaps the camera upward.
  const toR=Math.min(Math.max(_flyToPos.distanceTo(_flyToTgt),ZOOM_MIN),ZOOM_MAX);
  const radius=THREE.MathUtils.lerp(fromR,toR,t);
  const dir=new THREE.Vector3().lerpVectors(fromDir,toDir,t).normalize();
  cam.position.copy(tgt).addScaledVector(dir,radius);
  ctrl.target.copy(tgt);
  // ctrl.target = _flyToTgt on arrival, which is already the correct orbit
  // pivot (projected from Python at export — no runtime recalc needed).
}

function _startTurntable(){
  _flyActive=false; _stopCinematic(); _turntableActive=true;
  document.querySelector('.tt-btn')?.classList.add('active');
  document.querySelectorAll('.cam-btn').forEach(b=>b.classList.remove('active'));
}
function _stopTurntable(){
  _turntableActive=false;
  document.querySelector('.tt-btn')?.classList.remove('active');
}
function _tickTurntable(){
  if(!_turntableActive) return;
  _turntableAngle+=_turntableSpeed;
  const r=cam.position.distanceTo(ctrl.target);
  cam.position.x=ctrl.target.x+Math.sin(_turntableAngle)*r;
  cam.position.z=ctrl.target.z+Math.cos(_turntableAngle)*r;
}

const _dipEl=()=>document.getElementById('dip');

/**
 * Dip to black: fade out → call fn → fade in.
 * dipDur = ms for each half (fade-out + fade-in).
 */
function _dip(fn, dipDur=350){
  const el=_dipEl(); if(!el){fn();return;}
  el.style.transition=`opacity ${dipDur}ms ease`;
  el.style.opacity='1';
  setTimeout(()=>{
    fn();
    el.style.opacity='0';
  }, dipDur+20);  // slight buffer so the cut lands during full black
}

function _startCinematic(){
  if(!_cinematicClips.length) return;
  
  const cin = camCfg.cinematic || {};
  if(cin.sound) SFX.playFile(cin.sound);
  
  _savedTarget.copy(ctrl.target);
  _stopTurntable(); _flyActive=false; _cinematicPlaying=true; _cinematicIdx=0;
  _playCinematicClip(0);
  const btn=document.querySelector('.cin-btn');
  if(btn){btn.classList.add('playing');btn.querySelector('span').textContent='STOP';}
}
function _stopCinematic(){
  if (!_cinematicPlaying) return;

  _cinematicPlaying=false;
  _cinematicMixers.forEach(mx=>mx.stopAllAction());
  // Fade back up if we're mid-dip
  const el=_dipEl();if(el) el.style.opacity='0';
  const btn=document.querySelector('.cin-btn');
  if(btn){btn.classList.remove('playing');btn.querySelector('span').textContent='PLAY CINEMATIC';}
  ctrl.target.copy(_savedTarget);
}
function _poseAtCinematicStart(idx){
  // Snap the RENDER camera to the opening frame (t=0) of cinematic camera `idx`.
  const node=_cinematicNodes[idx],clip=_cinematicClips[idx],mx=_cinematicMixers[idx];
  if(!node||!clip||!mx) return false;
  mx.stopAllAction();
  const action=mx.clipAction(clip);
  action.reset(); action.play(); action.paused=true; action.time=0;
  mx.update(0);                       // evaluate the node's transform at frame 0
  node.updateWorldMatrix(true,false);
  node.getWorldPosition(cam.position);
  node.getWorldQuaternion(cam.quaternion);
  const fw=new THREE.Vector3(0,0,-1).applyQuaternion(cam.quaternion);
  ctrl.target.copy(cam.position).add(fw.multiplyScalar(5));
  cam.updateMatrixWorld();
  return true;
}

function _playCinematicClip(idx){
  if(idx>=_cinematicClips.length){
    // End of sequence — dip to black, snap to the first frame of the first
    // camera, then stop so orbit controls resume from that opening pose.
    _dip(()=>{ _poseAtCinematicStart(0); _stopCinematic(); });
    return;
  }
  _cinematicMixers.forEach(mx=>mx.stopAllAction());
  const clip=_cinematicClips[idx];
  const mx=_cinematicMixers[idx]||_cinematicMixers[0];
  if(!mx||!clip){_stopCinematic();return;}

  // Dip to black, then switch camera and play
  _dip(()=>{
    const action=mx.clipAction(clip);
    action.setLoop(THREE.LoopOnce,1);
    action.clampWhenFinished=true;
    action.reset().play();
    mx.addEventListener('finished',function onF(){
      mx.removeEventListener('finished',onF);
      _playCinematicClip(++_cinematicIdx);
    });
  });
}

/**
 * Given a clip, return the node in `root` that it animates a transform on.
 * The render camera follows THIS node, so it must be the node the tracks bind to.
 */
function _resolveTrackNode(clip){
  if(!root||!clip) return null;
  for(const tr of clip.tracks){
    const prop=tr.name.split('.').pop();
    if(prop!=='position'&&prop!=='quaternion'&&prop!=='rotation'&&prop!=='scale') continue;
    const nodeName=tr.name.split('.')[0].replace(/\[\d+\]$/,'');
    const safe=nodeName.replace(/ /g,'_');
    let found=null;
    root.traverse(o=>{ if(!found&&(o.name===nodeName||o.name===safe)) found=o; });
    if(found) return found;
  }
  return null;
}

function _initCinematicMixers(gltf){
  const seq=(camCfg.cinematic||{}).sequence||[];
  const loaded=[];
  seq.forEach((entry)=>{
    const safeName = entry.name.replace(/ /g, '_');

    // 1. Resolve the actual camera node in the loaded scene by name.
    let camNode = null;
    if(root) root.traverse(o=>{ if(!camNode&&(o.name===entry.name || o.name===safeName)) camNode=o; });

    // 2. Prefer the clip that actually animates this camera node (track-target
    //    match). Loose name 'includes' matching can wrongly grab a part clip.
    let clip=null;
    if(camNode){
      clip=gltf.animations.find(a=>a.tracks.some(t=>{
        const nn=t.name.split('.')[0].replace(/\[\d+\]$/,'');
        return nn===camNode.name||nn===entry.name||nn===safeName;
      }));
    }
    // 3. Fallbacks: track-target by name, then clip-name match.
    if(!clip){
      clip=gltf.animations.find(a=>a.tracks.some(t=>{
        const nn=t.name.split('.')[0].replace(/\[\d+\]$/,'');
        return nn===entry.name||nn===safeName;
      }));
    }
    if(!clip){
      clip=gltf.animations.find(a=>
        a.name===entry.name||a.name===safeName||
        a.name.toLowerCase().includes(entry.name.toLowerCase())||
        entry.name.toLowerCase().includes(a.name.toLowerCase())
      );
    }
    if(!clip){
      console.warn('[WCE] cinematic: no clip found for camera',entry.name);
      return;
    }

    // 4. If name lookup failed, derive the node straight from the matched clip's
    //    transform tracks. Getting this wrong (null node) is what made the
    //    sequence merely dip to black instead of flying the camera.
    if(!camNode) camNode=_resolveTrackNode(clip);
    if(!camNode) console.warn('[WCE] cinematic: camera node not found for',entry.name,'— camera will not move');

    _cinematicMixers.push(new THREE.AnimationMixer(root));
    _cinematicClips.push(clip);
    _cinematicNodes.push(camNode);
    loaded.push(entry.name+' ('+clip.name+(camNode?(' → '+camNode.name):' [NO NODE]')+')');
  });
  console.log('[WCE] cinematic clips loaded:',loaded);
}

// ── HOTSPOT SYSTEM ───────────────────────────────────────────────────────

const hotspots=[];
// Flat list of occludable meshes, built once when the model loads (see the
// root.traverse() in the gltf load callback). Geo-subset switching only
// toggles .visible on these same objects — they're never added/removed from
// the scene graph — so a one-time flat list avoids re-walking the full
// hierarchy on every single occlusion raycast (the costly part once there
// are several hotspots, since each one raycasts independently).
let _occluderMeshes=[];

function _rgbCss(c){
  // c = [r,g,b] floats 0-1  →  css rgb string
  if(!c||c.length<3) return 'var(--hot)';
  return `rgb(${Math.round(c[0]*255)},${Math.round(c[1]*255)},${Math.round(c[2]*255)})`;
}

function _makeHotspotEl(color, scale){
  const css=_rgbCss(color);
  const mult = (scale || 0.25) / 0.25; 
  const el=document.createElement('div');
  el.className='hs-sprite clickable';
  el.style.transform = `translate(-50%,-50%) scale(${mult})`;
  el.innerHTML=`<div class="hs-ring" style="border-color:${css};box-shadow:0 0 8px ${css}44"></div>`+
               `<div class="hs-dot"  style="background:${css};box-shadow:0 0 6px ${css}"></div>`;
  return el;
}

function _hsGlowPx(scale){
  // On-screen glow radius (px): ring is 44px wide, sprite scales by scale/0.25,
  // pulse expands to ~1.4x and the box-shadow adds a little — sample that area.
  const mult=(scale||0.25)/0.25;
  return 24*mult;
}

function _initHotspots(){
  const layer=document.getElementById('hotspot-layer');
  allAnimDefs().forEach(def=>{
    if(def.trigger!=='hotspot'||!def.hotspot_position) return;
    const pos=def.hotspot_position;
    const el=_makeHotspotEl(def.hotspot_color, def.hotspot_scale);
    layer.appendChild(el);
    hotspots.push({name:def.name,pos:new THREE.Vector3(pos[0],pos[1],pos[2]),el,px:_hsGlowPx(def.hotspot_scale),op:0});
    el.addEventListener('pointerdown',(e)=>{ e.stopPropagation(); triggerAnim(def.name); });
  });
  // Sequence hotspots
  ((CFG.animations||{}).sequences||[]).forEach(seq=>{   
    if(seq.trigger!=='hotspot'||!seq.hotspot_position) return;
    const pos=seq.hotspot_position;
    const el=_makeHotspotEl(seq.hotspot_color||[1,0.42,0.21], seq.hotspot_scale??0.35);
    layer.appendChild(el);
    hotspots.push({name:'__seq_'+seq.name,pos:new THREE.Vector3(pos[0],pos[1],pos[2]),el,px:_hsGlowPx(seq.hotspot_scale??0.35),op:0});
    el.addEventListener('pointerdown',(e)=>{ e.stopPropagation(); executeSequence(seq.name); });
  });
  // Extra hotspots from controls and combos
  const cin=camCfg.cinematic||{};
  if(cin.trigger==='hotspot'&&cin.hotspot_position){
    const pos=cin.hotspot_position;
    const el=_makeHotspotEl(cin.hotspot_color, cin.hotspot_scale);
    layer.appendChild(el);
    hotspots.push({name:'__cin__',pos:new THREE.Vector3(pos[0],pos[1],pos[2]),el,px:_hsGlowPx(cin.hotspot_scale),op:0});
    el.addEventListener('pointerdown',(e)=>{ e.stopPropagation(); _cinematicPlaying?_stopCinematic():_startCinematic(); });
  }
}

// Dedicated raycaster for occlusion so we never clobber the pointer raycaster.
const _hsRay=new THREE.Raycaster();
// Metres of slack so the very surface a hotspot sits ON doesn't occlude it,
// while geometry farther in front (e.g. the far side of the car body) does.
const HOTSPOT_OCCLUSION_BIAS=0.12;
const _hsDir=new THREE.Vector3();
const _hsTmpV=new THREE.Vector3(); // pre-alloc: reused every frame instead of .clone()
// Centre + 2 samples (was a 9-point ring). With the temporal smoothing below
// and the ~12 Hz throttle, this looks identical but costs a fraction — each
// sample is a full-model raycast, so fewer samples + lower rate is the fix for
// the orbit-time stutter.
const _HS_SAMPLES=[[0,0]];   // centre only — temporal smoothing covers the rest
const _HS_NDC={x:0,y:0};
const _HS_OCC_INTERVAL_MS=100;  // recompute occlusion at ~10 Hz, not per frame
// Skip the occlusion raycast entirely while the camera is still — a directional
// view's occlusion only changes when the camera moves. This is the big win:
// during a static hold (and with render-on-demand) there are zero raycasts.
let _hsCamX=1e9,_hsCamY=1e9,_hsCamZ=1e9,_hsCamMoved=true;
let _hsFrame=0;

function _hsSampleOccluded(nx,ny,distToHs){
  if(!root||!_occluderMeshes.length) return false;
  _HS_NDC.x=nx; _HS_NDC.y=ny;
  _hsRay.setFromCamera(_HS_NDC,cam);
  _hsRay.far=Math.max(distToHs-HOTSPOT_OCCLUSION_BIAS,0.0001);
  const hits=_hsRay.intersectObjects(_occluderMeshes,false);
  for(const h of hits){
    if(!h.object||h.object.visible===false) continue;
    if(h.object.userData && h.object.userData.wce_no_occlude) continue;
    if(h.distance<distToHs-HOTSPOT_OCCLUSION_BIAS) return true;
  }
  return false;
}

function _tickHotspots(){
  _hsFrame++;
  const W=innerWidth,H=innerHeight;
  // Detect camera movement once per tick (position is enough for occlusion).
  const cp=cam.position;
  _hsCamMoved=(Math.abs(cp.x-_hsCamX)+Math.abs(cp.y-_hsCamY)+Math.abs(cp.z-_hsCamZ))>1e-4;
  if(_hsCamMoved){ _hsCamX=cp.x; _hsCamY=cp.y; _hsCamZ=cp.z; }
  hotspots.forEach((hs,idx)=>{
    // If already invisible and camera hasn't moved, nothing can have changed.
    // Skip project(), DOM write, and raycast entirely — zero cost per frame.
    if(hs.op!=null && hs.op<0.012 && !_hsCamMoved) return;
    if(hs._offScreen && (_hsFrame%3)!==(idx%3)){
      if(hs.op>0.012){hs.op*=0.8; hs.el.style.opacity=hs.op.toFixed(3); if(hs.op<0.012) hs.el.style.display='none';}
      return;
    }
    _hsTmpV.copy(hs.pos).project(cam);
    let target;

    // Cheap early-out: behind the camera, or well outside the viewport
    // margin — skip the occlusion raycast entirely. With several hotspots
    // scattered around a model, most are off-screen at any given camera
    // angle, so this is the biggest win as the hotspot count grows.
    if(_hsTmpV.z>1||_hsTmpV.x<-1.3||_hsTmpV.x>1.3||_hsTmpV.y<-1.3||_hsTmpV.y>1.3){
      hs._offScreen=true; target=0;
    } else {
      hs._offScreen=false;
      const sx=(_hsTmpV.x*0.5+0.5)*W, sy=(-_hsTmpV.y*0.5+0.5)*H;
      hs.el.style.left=sx+'px';
      hs.el.style.top =sy+'px';

      // Recompute occlusion at ~10 Hz, and only while the camera is moving —
      // a still camera can't change occlusion, so we reuse the last result.
      // Stagger is spread across the full interval window relative to the
      // CURRENT hotspot count, so total raycasts/sec stays roughly constant
      // however many hotspots exist, instead of growing with the count.
      const _nowMs=performance.now();
      const _stagger=idx*(_HS_OCC_INTERVAL_MS/Math.max(1,hotspots.length));
      if(hs.vis==null || (_hsCamMoved && (_nowMs-(hs._lastOcc||0))>=_HS_OCC_INTERVAL_MS)){
        hs._lastOcc=_nowMs+_stagger;
        _hsDir.copy(hs.pos).sub(cam.position);
        const distToHs=_hsDir.length();
        const R=hs.px||24;
        let occ=0;
        for(let i=0;i<_HS_SAMPLES.length;i++){
          const px=sx+_HS_SAMPLES[i][0]*R, py=sy+_HS_SAMPLES[i][1]*R;
          const nx=(px/W)*2-1, ny=-(py/H)*2+1;
          if(_hsSampleOccluded(nx,ny,distToHs)) occ++;
        }
        const v=1-(occ/_HS_SAMPLES.length);
        hs.vis=v*v*(3-2*v);   // smoothstep → softer edge falloff
      }
      target=hs.vis;
    }

    // Temporal smoothing of opacity removes flicker as the ray grazes edges.
    hs.op=(hs.op==null)?target:hs.op+(target-hs.op)*0.3;
    if(hs.op<0.012){
      hs.el.style.display='none';
    } else {
      hs.el.style.display='block';
      hs.el.style.opacity=hs.op.toFixed(3);
      hs.el.style.pointerEvents=hs.op>0.5?'auto':'none';
    }
  });
}


// ── IMAGE TRIGGERS ─────────────────────────────────────────────────────────
// DOM overlay approach — identical to hotspots but shows an <img> element
// instead of a pulsing ring. Transparent PNG areas show the HTML background,
// not the 3D scene, eliminating every green-tint / blending issue.
// Occlusion uses the same raycaster logic as hotspots.
const _imgTriggers=[];

function _initImageTriggers(){
  const layer=document.getElementById('hotspot-layer'); // reuse the same overlay layer
  if(!layer) return;

  function _add(def,fn){
    if(!def.image_file) return;

    const el=document.createElement('img');
    el.src='images/'+def.image_file;
    console.log('[WCE] image trigger src:',el.src,'file:',def.image_file);
    el.onerror=()=>console.error('[WCE] image trigger FAILED to load:',el.src);
    const _opStr='opacity:'+(def.image_opacity??1);
    el.style.cssText=[
      'position:absolute',
      'transform:translate(-50%,-50%)',
      _opStr,
      'cursor:pointer',
      'pointer-events:none',
      'display:none',
      'user-select:none',
      '-webkit-user-drag:none',
      'object-fit:contain',
    ].join(';');
    layer.appendChild(el);

    const p=def.image_position||[0,0,0];
    const worldPos=new THREE.Vector3(p[0],p[1],p[2]);

    // Build the quaternion that rotates the plane (same as mesh approach)
    // so we can project its corners to screen space for sizing.
    const toRad=Math.PI/180;
    const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(
      Math.PI/2+(def.image_rotation_x||0)*toRad,
      (def.image_rotation_z||0)*toRad,
      -(def.image_rotation_y||0)*toRad,
      'YXZ'
    ));
    const halfW=(def.image_width??1)/2;
    const halfH=(def.image_height??1)/2;
    // Corner offset vectors in world space (used for screen-space size estimation)
    const cornerR=new THREE.Vector3(halfW,0,0).applyQuaternion(q);
    const cornerU=new THREE.Vector3(0,halfH,0).applyQuaternion(q);

    el.addEventListener('pointerdown',(e)=>{ e.stopPropagation(); fn(); });
    _imgTriggers.push({worldPos,worldW:def.image_width??1,worldH:def.image_height??1,imgOp:def.image_opacity??1,el,fn,op:0,vis:null,_lastOcc:0});
  }

  allAnimDefs().forEach(d=>{   
    if(d.trigger==='image') _add(d,()=>triggerAnim(d.name));
    (d.extra_images||[]).forEach(ei=>{ _add(ei,()=>triggerAnim(d.name)); });
  });
  const cin=camCfg.cinematic||{};
  if(cin.trigger==='image') _add(cin,()=>_cinematicPlaying?_stopCinematic():_startCinematic());
  ((CFG.animations||{}).sequences||[]).forEach(s=>{
    if(s.trigger==='image') _add(s,()=>executeSequence(s.name));
  });
}

function _tickImgTriggers(){
  if(!_imgTriggers.length) return;
  const W=innerWidth, H=innerHeight;
  const _nowMs=performance.now();
  const _OCC_MS=100;

  _imgTriggers.forEach((it,idx)=>{
    if(it.op!=null && it.op<0.012 && !_hsCamMoved){ it.el.style.display='none'; return; }
    if(it._offScreen && (_hsFrame%2)!==(idx%2)){
      if(it.op>0.012){it.op*=0.8; it.el.style.opacity=it.op.toFixed(3);}
      return;
    }
    _hsTmpV.copy(it.worldPos).project(cam);

    // Behind camera or well off-screen
    if(_hsTmpV.z>1||_hsTmpV.x<-1.4||_hsTmpV.x>1.4||_hsTmpV.y<-1.4||_hsTmpV.y>1.4){
      it._offScreen=true; it.op=(it.op??0)*0.7;
      if(it.op<0.012){ it.el.style.display='none'; }
      return;
    }
    it._offScreen=false;

    const sx=(_hsTmpV.x*0.5+0.5)*W;
    const sy=(-_hsTmpV.y*0.5+0.5)*H;

    // Occlusion check — throttled to ~10Hz, skipped when camera is still
    const _stagger=idx*(_OCC_MS/Math.max(1,_imgTriggers.length));
    if(it.vis==null||(_hsCamMoved&&(_nowMs-(it._lastOcc||0))>=_OCC_MS)){
      it._lastOcc=_nowMs+_stagger;
      _hsDir.copy(it.worldPos).sub(cam.position);
      const dist=_hsDir.length();
      _hsRay.set(cam.position,_hsDir.normalize());
      _hsRay.far=dist-HOTSPOT_OCCLUSION_BIAS;
      const hits=_hsRay.intersectObjects(_occluderMeshes,false);
      it.vis=hits.length===0?1:0;
    }

    const target=it.vis??0;
    it.op=(it.op==null)?target:it.op+(target-it.op)*0.3;

    if(it.op<0.012){
      it.el.style.display='none';
      return;
    }

    // Compute pixel size from world dimensions + camera distance.
    // This gives perspective-correct stable scaling (same as how any 3D
    // object appears to resize as you orbit) without jitter from corner
    // projection artifacts.
    const dist=Math.max(0.1, cam.position.distanceTo(it.worldPos));
    const tanHalfFov=Math.tan(cam.fov*Math.PI/360);
    const pxH=Math.max(20,(it.worldH/(dist*tanHalfFov*2))*H);
    const pxW=Math.max(20,(it.worldW/(dist*tanHalfFov*2*cam.aspect))*W);

    it.el.style.display='block';
    it.el.style.left=sx+'px';
    it.el.style.top =sy+'px';
    it.el.style.width =(Math.max(20,pxW))+'px';
    it.el.style.height=(Math.max(20,pxH))+'px';
    it.el.style.opacity=(it.op*it.imgOp).toFixed(3);
    it.el.style.pointerEvents=it.op>0.5?'auto':'none';
  });
}


// ── MESH TOUCH SYSTEM ────────────────────────────────────────────────────

const meshTriggers=[];

function _initMeshTriggers(){
  allAnimDefs().forEach(def=>{
    if(def.trigger==='mesh'&&def.trigger_mesh)
      meshTriggers.push({meshName:def.trigger_mesh,fn:()=>triggerAnim(def.name)});
  });
  // Extra mesh triggers
  allAnimDefs().forEach(def=>{   
    (def.extra_meshes||[]).forEach(em=>{   
      if(em.mesh) meshTriggers.push({meshName:em.mesh,fn:()=>triggerAnim(def.name)});
    });
  });
  const cin=camCfg.cinematic||{};
  if(cin.trigger==='mesh'&&cin.trigger_mesh)
    meshTriggers.push({meshName:cin.trigger_mesh,fn:()=>_cinematicPlaying?_stopCinematic():_startCinematic()});
  
  // FIX: Sort triggers by name length (longest first) to prevent short names
  // from greedily stealing clicks meant for objects with similar prefixes.
  meshTriggers.sort((a,b)=>b.meshName.length-a.meshName.length);
}

// Helper for adding ad-hoc mesh triggers after _initMeshTriggers has run
// (used by buildSequenceUI for sequence mesh-click triggers).
function _addMeshTrigger(meshName, fn){
  if(!meshName||!fn) return;
  meshTriggers.push({meshName, fn});
  meshTriggers.sort((a,b)=>b.meshName.length-a.meshName.length);
}

// Helper for adding ad-hoc hotspot triggers (used by buildSequenceUI).
function _registerHotspot(objName, fn){
  if(!objName||!fn) return;
  const hs=hotspots.find(h=>h.name===objName);
  if(hs) hs.fn=fn; // attach callback to existing hotspot element
}

let _ptrDownX = 0, _ptrDownY = 0;

canvas.addEventListener('pointerdown', e => {
  _ptrDownX = e.clientX;
  _ptrDownY = e.clientY;
});

canvas.addEventListener('pointerup',e=>{
  if(!root) return;
  // FIX: Ignore the click if the user dragged the mouse (e.g. to orbit the camera)
  if(Math.abs(e.clientX - _ptrDownX) > 5 || Math.abs(e.clientY - _ptrDownY) > 5) return;
  mouse.x=(e.clientX/innerWidth)*2-1;
  mouse.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(mouse,cam);
  if(!meshTriggers.length) return;
  
  const hits=raycaster.intersectObject(root,true);
  
  for(const hit of hits){
    if(hit.object.visible === false) continue;
    
    let current = hit.object;
    let triggered = false;
    
    while(current && current.type !== 'Scene'){
      const hitName = current.name;
      
      for(const t of meshTriggers){
        const safeName = t.meshName.replace(/ /g, '_');
        // FIX: Only match exact names, or valid GLTF primitive suffixes (_ or .)
        if(hitName === safeName || hitName.startsWith(safeName + '_') || hitName.startsWith(safeName + '.')){
          t.fn();
          triggered = true;
          break;
        }
      }
      if(triggered) break;
      current = current.parent;
    }
    if(triggered) break;
  }
});

canvas.addEventListener('pointermove',e=>{
  if(!meshTriggers.length||!root){ document.body.style.cursor='default'; return; }
  mouse.x=(e.clientX/innerWidth)*2-1;
  mouse.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(mouse,cam);
  
  const hits=raycaster.intersectObject(root,true);
  let isHovering=false;
  
  for(const hit of hits){
    if(hit.object.visible===false) continue;
    let current=hit.object;
    
    while(current && current.type!=='Scene'){
      const hitName=current.name;
      for(const t of meshTriggers){
        const safeName = t.meshName.replace(/ /g, '_');
        // FIX: Match same strict suffix logic as pointerup
        if(hitName===safeName || hitName.startsWith(safeName + '_') || hitName.startsWith(safeName + '.')){
          isHovering=true; break;
        }
      }
      if(isHovering) break;
      current=current.parent;
    }
    if(isHovering) break;
  }
  
  document.body.style.cursor = isHovering ? 'pointer' : 'default';
});

// ── RENDER LOOP ──────────────────────────────────────────────────────────

// Declared before the render loop (which references it) to avoid a temporal
// dead-zone error; the rest of the AR state lives in the AR module below.
let _xrActive=false;
(function tick(){
  requestAnimationFrame(tick);
  if(_xrActive) return;   // XR drives its own loop
  const dist=ctrl.getDistance();
  const cosPhi=Math.max(-1,Math.min(1,(FLOOR_Z-ctrl.target.y)/dist));
  ctrl.maxPolarAngle=Math.acos(cosPhi)-0.01;
  // Optional roof: camera can't rise above the CAM_ROOF plane.
  if(ROOF_Z!=null){
    const cosR=Math.max(-1,Math.min(1,(ROOF_Z-ctrl.target.y)/dist));
    ctrl.minPolarAngle=Math.min(Math.acos(cosR)+0.01, ctrl.maxPolarAngle-0.02);
  }
  _tickTurntable();
  _tickMixers();
  const _tdt=Math.min(0.05,(performance.now()-_lastTransT)/1000); _lastTransT=performance.now();
  _tickTransitions(_tdt);

  if(_cinematicPlaying && _cinematicNodes[_cinematicIdx]){
    const cNode = _cinematicNodes[_cinematicIdx];
    cNode.getWorldPosition(cam.position);
    cNode.getWorldQuaternion(cam.quaternion);
    const fw = new THREE.Vector3(0,0,-1).applyQuaternion(cam.quaternion);
    ctrl.target.copy(cam.position).add(fw.multiplyScalar(dist > 0.1 ? dist : 5));
  } else {
    // ctrl.update() runs every frame — keeps OrbitControls internal spherical
    // state synced so there is never stale state between flies.
    // _tickFly() runs AFTER and overrides the position for the fly arc.
    ctrl.update();
    if(_flyPending){
      _flyFromPos.copy(cam.position); _flyFromTgt.copy(ctrl.target);
      _flyToPos.copy(_flyDestPos); _flyToTgt.copy(_flyDestTgt);
      if(_flyDestSound) SFX.playFile(_flyDestSound);
      _flyPending=false; _flyActive=true; _flyT=0;
    }
    if(_flyActive){
      _tickFly();
      cam.lookAt(ctrl.target);
    } else {
    ctrl.update();
    // Clamp pan target. Shift cam.position by the same delta so orbit
    // relationship is preserved with no visual jump. Also drain any
    // residual damped pan offset stored in OrbitControls.
    if(_panMin!==null){
      const _dx=Math.max(_panMin.x,Math.min(_panMax.x,ctrl.target.x))-ctrl.target.x;
      const _dy=Math.max(_panMin.y,Math.min(_panMax.y,ctrl.target.y))-ctrl.target.y;
      const _dz=Math.max(_panMin.z,Math.min(_panMax.z,ctrl.target.z))-ctrl.target.z;
      if(_dx||_dy||_dz){
        ctrl.target.x+=_dx; ctrl.target.y+=_dy; ctrl.target.z+=_dz;
        cam.position.x+=_dx; cam.position.y+=_dy; cam.position.z+=_dz;
        // Drain residual pan offset if OrbitControls exposes it
        if(ctrl._panOffset) ctrl._panOffset.set(0,0,0);
      }
    }
  }
  }

  // Continuous activity keeps the draw window open; otherwise we draw only for
  // the short window opened by interaction / camera damping (requestRender).
  const _now=performance.now();
  const _active = _flyActive || _turntableActive || _cinematicPlaying || _hoverOn
                || _now<_animActiveUntil || Object.keys(_segWatch).length>0
                || _matTweens.length>0 || _geoTweens.length>0;
  if(_active) _renderUntil=_now+100;

  if(_now<=_renderUntil){
    comp.render();
    // Hotspots: skip entirely during AR — the raycaster runs against the full
    // scene (including the AR clone) and causes the frame-rate drop you saw.
    if(!_xrActive) _tickHotspots();
    if(!_xrActive) _tickImgTriggers();
  }
})();

// ── AR (WebXR on Android, pre-baked USDZ on iOS) ─────────────────────────────
// Android: WebXR immersive-ar — live three.js scene, current config, unchanged.
// iOS:     pre-baked USDZ files written at Blender export time. The AR button
//          shows only the combos (geo × mat) the artist marked for AR, so the
//          user picks from valid pre-baked configs before Quick Look opens.
//          No blob generation, no async before the click — works reliably.
let _xrSession=null, _xrRefSpace=null, _xrHitSource=null;
let _arReticle=null, _arModel=null, _arPlaced=false, _arBgBackup=null, _xrFrameErrored=false;

function _isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent)
      || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
}
function _quickLookSupported(){
  const a=document.createElement('a');
  return !!(a.relList && a.relList.supports && a.relList.supports('ar'));
}
function _slug(n){ return n.toLowerCase().replace(/[^a-z0-9_-]/g,'_').replace(/^_+|_+$/g,''); }
function _arUSDZPath(geoName, matName){
  const parts=[];
  if(geoName) parts.push(_slug(geoName));
  if(matName) parts.push(_slug(matName));
  return 'IOS AR/ar__'+(parts.length?parts.join('__'):'default')+'.usdz';
}

// ── iOS AR picker ─────────────────────────────────────────────────────────────
let _arPickerOpen=false;
const _arGeoSets = (CFG.ar&&CFG.ar.geo_sets)||[];
const _arMatSets = (CFG.ar&&CFG.ar.mat_sets)||[];

function _showARPicker(){

  launch.disabled=true;

    const ready=(!_arGeoSets.length||selGeo)&&(!_arMatSets.length||selMat);
    launch.disabled=!ready;

  }
  _updateLaunch();

  launch.onclick=()=>{
    // Synchronous file URL — no await, stays inside the user gesture.
    const path=_arUSDZPath(selGeo,selMat);
    const a=document.createElement('a');
    a.rel='ar'; a.href=path;
    const img=document.createElement('img');
    img.src='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';

  cancel.onclick=_closeARPicker;

  document.body.appendChild(ov);

function _closeARPicker(){
  _arPickerOpen=false;
  const ov=document.getElementById('ar-picker-ov');
  if(ov) ov.remove();
}

async function _initAR(){
  if(!(CFG.ar && (CFG.ar.ios_enabled || CFG.ar.android_enabled))) return;
  const btn=document.getElementById('ar-btn');
  if(!btn) return;

  if(_isIOS() && _quickLookSupported()){
    if(!CFG.ar.ios_enabled) return;
    // iOS: only show button if at least one USDZ was pre-baked
    const hasCombos=_arGeoSets.length||_arMatSets.length;
    if(!hasCombos) return;
    btn.style.display='flex';
    // If there's only one combo, skip the picker and go straight to Quick Look.
    const singleGeo=_arGeoSets.length<=1?(_arGeoSets[0]?.name||null):null;
    const singleMat=_arMatSets.length<=1?(_arMatSets[0]?.name||null):null;
    const needsPicker=_arGeoSets.length>1||_arMatSets.length>1;
    btn.onclick=()=>{
      if(needsPicker){ _showARPicker(); return; }
      const path=_arUSDZPath(singleGeo,singleMat);
      const a=document.createElement('a'); a.rel='ar'; a.href=path;
      const img=document.createElement('img');
      img.src='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
      img.style.cssText='position:absolute;width:1px;height:1px;opacity:0';
      a.appendChild(img); document.body.appendChild(a); a.click();
      setTimeout(()=>a.remove(),2000);
    };
    return;
  }

  // Android/desktop: WebXR
  if(!CFG.ar.android_enabled) return;
  let mode=null;
  try{ if(navigator.xr && await navigator.xr.isSessionSupported('immersive-ar')) mode='webxr'; }catch(e){}
  if(!mode) return;
  btn.style.display='flex';
  btn.onclick=()=>_startWebXR();
}

// Android/WebXR — immersive-ar with floor hit-test and tap-to-place.
async function _startWebXR(){
  if(!root || _xrSession){ return; }
  const btn=document.getElementById('ar-btn');
  if(btn) btn.disabled=true;
  try{
    _xrFrameErrored=false;
    _xrSession=await navigator.xr.requestSession('immersive-ar',{
      requiredFeatures:['hit-test'],
      optionalFeatures:['dom-overlay','local-floor'],
      domOverlay:{root:document.body}
    });

    _xrActive=true;
    renderer.xr.enabled=true;
    await renderer.xr.setSession(_xrSession);

    _arBgBackup=scene.background; scene.background=null;
    if(typeof _groundSky!=='undefined' && _groundSky) _groundSky.visible=false;
    if(root) root.visible=false;

    const rg=new THREE.RingGeometry(0.07,0.09,32).rotateX(-Math.PI/2);
    _arReticle=new THREE.Mesh(rg,new THREE.MeshBasicMaterial({color:0x39c5ff}));
    _arReticle.matrixAutoUpdate=false; _arReticle.visible=false; scene.add(_arReticle);

    _arModel=root.clone(true); _arModel.visible=false;
    const box=new THREE.Box3().setFromObject(root);
    const sz=box.getSize(new THREE.Vector3());
    const maxd=Math.max(sz.x,sz.y,sz.z)||1;
    const targetMetres=1.0;
    _arModel.scale.setScalar(targetMetres/maxd);
    (function _syncMats(s,d){
      const sm=[],dm=[];
      s.traverse(o=>{if(o.isMesh)sm.push(o);});
      d.traverse(o=>{if(o.isMesh)dm.push(o);});
      sm.forEach((m,i)=>{if(dm[i])dm[i].material=m.material;});
    })(root,_arModel);
    scene.add(_arModel); _arPlaced=false;

    let exit=document.getElementById('ar-exit');
    if(!exit){exit=document.createElement('button');exit.id='ar-exit';exit.style.cssText='position:fixed;top:14px;right:14px;z-index:10000;padding:8px 14px;background:rgba(0,0,0,.6);border:1px solid #fff;border-radius:4px;color:#fff;font-family:Rajdhani,sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer';document.body.appendChild(exit);}
    exit.textContent='Exit AR'; exit.style.display='block';
    exit.onclick=()=>{ try{_xrSession?.end();}catch(e){} };

    let hint=document.getElementById('ar-hint');
    if(!hint){hint=document.createElement('div');hint.id='ar-hint';hint.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:64px;z-index:10000;padding:8px 14px;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;font-family:Rajdhani,sans-serif;font-size:11px;letter-spacing:.08em;text-align:center';document.body.appendChild(hint);}
    hint.textContent='Point at the floor, then tap to place'; hint.style.display='block';

    try{ _xrRefSpace=await _xrSession.requestReferenceSpace('local-floor'); }
    catch(e){ _xrRefSpace=await _xrSession.requestReferenceSpace('local'); }
    const viewer=await _xrSession.requestReferenceSpace('viewer');
    _xrHitSource=await _xrSession.requestHitTestSource({space:viewer});

    _xrSession.addEventListener('select',()=>{
      if(_arReticle&&_arReticle.visible&&_arModel){
        _arModel.position.setFromMatrixPosition(_arReticle.matrix);
        _arModel.visible=true; _arPlaced=true;
        hint.textContent='Tap again to reposition';
      }
    });
    _xrSession.addEventListener('end',_endWebXR);
    renderer.setAnimationLoop(_onXRFrame);
  }catch(e){
    console.error('[WCE] AR setup failed:',e);
    alert('Could not start AR. Use Chrome on Android over HTTPS.');
    try{ if(_xrSession) await _xrSession.end(); }catch(_e){}
    _endWebXR();
  }finally{
    if(btn) btn.disabled=false;
  }
}

function _onXRFrame(t,frame){
  try{
    if(frame&&_xrHitSource&&_xrRefSpace){
      const hits=frame.getHitTestResults(_xrHitSource);
      if(hits.length){
        const pose=hits[0].getPose(_xrRefSpace);
        if(pose){ _arReticle.visible=!_arPlaced; _arReticle.matrix.fromArray(pose.transform.matrix); }
        else if(_arReticle) _arReticle.visible=false;
      } else if(_arReticle) _arReticle.visible=false;
    }
    renderer.render(scene,cam);
  }catch(e){
    if(!_xrFrameErrored){ _xrFrameErrored=true; console.error('[WCE] XR frame:',e); try{_xrSession?.end();}catch(_e){} }
  }
}

function _endWebXR(){
  renderer.setAnimationLoop(null);
  try{ if(_xrHitSource&&_xrHitSource.cancel)_xrHitSource.cancel(); }catch(e){}
  _xrHitSource=null;
  if(_arReticle){scene.remove(_arReticle);_arReticle.geometry.dispose();_arReticle.material.dispose();_arReticle=null;}
  if(_arModel){scene.remove(_arModel);_arModel=null;}
  if(root) root.visible=true;
  if(typeof _groundSky!=='undefined'&&_groundSky) _groundSky.visible=true;
  scene.background=_arBgBackup; _arBgBackup=null;
  renderer.xr.enabled=false; _xrActive=false; _xrSession=null; _xrFrameErrored=false;
  const exit=document.getElementById('ar-exit'); if(exit) exit.style.display='none';
  const hint=document.getElementById('ar-hint'); if(hint) hint.style.display='none';
  if(typeof requestRender==='function') requestRender(1000);
}
