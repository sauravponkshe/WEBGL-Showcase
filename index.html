<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Car Configurator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600&family=Inconsolata:wght@300;400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{--bg:#0a0a0b;--panel:#101013;--border:#1c1c22;--accent:#c8a96e;--a2:#4a8cff;--ok:#4caf7d;--hot:#ff6b35;--cam:#9b59b6;--text:#e2ddd6;--muted:#52526a;--pw:300px}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif}
canvas{display:block}
#panel{position:fixed;top:0;right:0;width:var(--pw);height:100%;background:var(--panel-bg,var(--panel));border-left:1px solid var(--border);display:flex;flex-direction:column;z-index:10;transition:transform 0.3s cubic-bezier(0.2,0.8,0.2,1)}
#panel.closed{transform:translateX(100%)}
#ptab{position:absolute;top:50%;left:-28px;width:28px;height:60px;transform:translateY(-50%);background:var(--panel);border:1px solid var(--border);border-right:none;border-radius:6px 0 0 6px;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;z-index:11;transition:color 0.15s}
#ptab:hover{color:var(--accent)}
@media (max-width:768px){:root{--pw:85%}}
#ph{padding:22px 18px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
#ph h1{font-size:17px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
#ph p{font-size:10px;color:var(--muted);letter-spacing:.14em;margin-top:3px;font-family:'Inconsolata',monospace}
#tabnav{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.tnb{flex:1;padding:8px 4px;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:'Rajdhani',sans-serif;font-size:10px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:all .18s}
.tnb:hover{color:var(--text)}
.tnb.active{border-bottom-color:var(--accent);color:var(--accent)}
.tabpane{display:none}.tabpane.active{display:block}
body.wce-panel-combined #tabnav{display:none}
body.wce-panel-combined .tabpane{display:block !important}
body.wce-panel-combined .tabpane:not(:first-child){border-top:1px solid var(--border);margin-top:14px;padding-top:14px}
#pb{flex:1;overflow-y:auto;padding:14px 14px 24px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.sec{margin-bottom:18px}
.st{font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.st::after{content:'';flex:1;height:1px;background:var(--border)}
.vg{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.vc{padding:9px 10px;background:var(--bg);border:1px solid var(--border);border-radius:4px;cursor:pointer;transition:background .08s,color .08s,border-color .08s,opacity .08s;font-size:12px;letter-spacing:.07em;text-align:center;color:var(--muted)}
.vc:hover{border-color:var(--accent);color:var(--text)}.vc.active{border-color:var(--accent);color:var(--accent);background:#161208}
.gl{font-size:9px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin:10px 0 5px}
.tr{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:4px}
.tb{padding:5px 11px;background:var(--bg);border:1px solid var(--border);border-radius:3px;cursor:pointer;transition:all .15s;font-family:'Rajdhani',sans-serif;font-size:12px;letter-spacing:.05em;color:var(--muted)}
.tb:hover{border-color:var(--a2);color:var(--text)}.tb.active{border-color:var(--a2);color:var(--a2);background:#080f1e}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:5px}
.pb2{padding:7px 9px;background:var(--bg);border:1px solid var(--border);border-radius:3px;cursor:pointer;transition:all .15s;font-family:'Rajdhani',sans-serif;font-size:11px;letter-spacing:.07em;color:var(--muted);text-align:center}
.pb2:hover{border-color:var(--ok);color:var(--text)}.pb2.active{border-color:var(--ok);color:var(--ok);background:#071410}
.gb{width:100%;margin-bottom:5px;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:3px;cursor:pointer;transition:all .15s;font-family:'Rajdhani',sans-serif;font-size:12px;letter-spacing:.08em;color:var(--muted);text-align:left;display:flex;align-items:center;gap:8px}
.gb::before{content:'◈';font-size:10px;color:var(--accent)}
.gb:hover{border-color:var(--accent);color:var(--text)}.gb.active{border-color:var(--accent);color:var(--accent);background:#161208}
.at{width:100%;padding:7px;background:transparent;border:1px solid var(--border);border-radius:3px;color:var(--muted);font-family:'Rajdhani',sans-serif;font-size:10px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;margin-top:14px;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:7px}
.at:hover{border-color:var(--muted);color:var(--text)}
#as{display:none;margin-top:14px}#as.open{display:block}
.sr{margin-bottom:7px}.sr label{display:block;font-size:9px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-bottom:3px}
.sr select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:5px 9px;border-radius:3px;font-family:'Rajdhani',sans-serif;font-size:13px;outline:none;cursor:pointer;appearance:none}
.sr select:focus{border-color:var(--a2)}
#ld{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity .5s}
#ld.hidden{opacity:0;pointer-events:none}
#lbw{position:relative;width:180px;height:1px;background:var(--border);margin-top:18px}
#lb{height:100%;width:0%;background:var(--accent);transition:width .25s}
#lt{font-size:10px;letter-spacing:.3em;color:var(--muted);margin-top:10px;font-family:'Inconsolata',monospace}
#st{position:fixed;bottom:14px;left:18px;font-size:9px;letter-spacing:.2em;color:var(--muted);font-family:'Inconsolata',monospace;z-index:10}
#ld{background-color:#000000}




#lt{font-size:10px !important;font-weight:400 !important}
.nested-grp{margin-left:10px;padding-left:8px;border-left:1px solid var(--border);margin-top:6px;display:none}
.nested-grp.open{display:block}
.anim-btn{width:100%;margin-bottom:5px;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:3px;cursor:pointer;transition:background .08s,color .08s,border-color .08s,opacity .08s;font-family:'Rajdhani',sans-serif;font-size:12px;letter-spacing:.08em;color:var(--muted);text-align:left;display:flex;align-items:center;gap:8px}
.anim-btn:hover{border-color:var(--accent);color:var(--text)}
.anim-btn.playing{border-color:var(--accent);color:var(--accent);background:#161208}
.anim-btn .anim-play-icon{margin-left:auto;font-size:10px;color:var(--accent);opacity:0;transition:opacity .15s}
.anim-btn.playing .anim-play-icon{opacity:1}
.cam-btn{width:100%;margin-bottom:5px;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:3px;cursor:pointer;transition:background .08s,color .08s,border-color .08s,opacity .08s;font-family:'Rajdhani',sans-serif;font-size:12px;letter-spacing:.08em;color:var(--muted);text-align:left;display:flex;align-items:center;gap:8px}
.cam-btn::before{content:'◎';font-size:10px;color:var(--cam)}
.cam-btn:hover{border-color:var(--cam);color:var(--text)}
.cam-btn.active{border-color:var(--cam);color:var(--cam);background:#100a18}
.tt-btn{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:3px;cursor:pointer;transition:background .08s,color .08s,border-color .08s,opacity .08s;font-family:'Rajdhani',sans-serif;font-size:12px;letter-spacing:.08em;color:var(--muted);text-align:left;display:flex;align-items:center;gap:8px;margin-bottom:5px}
.tt-btn::before{content:'↻';font-size:13px;color:var(--cam)}
.tt-btn:hover{border-color:var(--cam);color:var(--text)}
.tt-btn.active{border-color:var(--cam);color:var(--cam);background:#100a18}
.cin-btn{width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--hot);border-radius:3px;cursor:pointer;transition:background .08s,color .08s,border-color .08s,opacity .08s;font-family:'Rajdhani',sans-serif;font-size:12px;letter-spacing:.1em;color:var(--hot);text-align:left;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cin-btn::before{content:'▶';font-size:10px}
.cin-btn:hover{background:#1a0d08;color:var(--text)}
.cin-btn.playing{background:#1a0d08;color:var(--text)}
#sfx-toggle{position:fixed;left:14px;bottom:14px;z-index:8;padding:7px 11px;background:var(--panel);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:10px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:7px;transition:all .15s;opacity:.85}
#sfx-toggle:hover{border-color:var(--accent);color:var(--text);opacity:1}
#sfx-toggle .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok);transition:all .15s}
#sfx-toggle.off{color:var(--muted)}
#sfx-toggle.off .dot{background:var(--muted);box-shadow:none}
#ar-btn{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:9;padding:9px 16px;background:var(--accent);border:1px solid var(--accent);border-radius:4px;color:#0b0b0b;font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .15s;box-shadow:0 2px 14px rgba(0,0,0,.35)}
#ar-btn:hover{filter:brightness(1.1)}
#ar-btn:active{transform:translateX(-50%) scale(.97)}
#ar-exit{position:fixed;top:14px;right:14px;z-index:10000;padding:8px 14px;background:rgba(0,0,0,.6);border:1px solid #fff;border-radius:4px;color:#fff;font-family:'Rajdhani',sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;display:none}
#ar-hint{position:fixed;left:50%;transform:translateX(-50%);bottom:64px;z-index:10000;padding:8px 14px;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;font-family:'Rajdhani',sans-serif;font-size:11px;letter-spacing:.08em;display:none;text-align:center}
.cin-btn.playing::before{content:'■'}
#hotspot-layer{position:fixed;inset:0;pointer-events:none;z-index:5}
.hs-sprite{position:absolute;pointer-events:none;transform:translate(-50%,-50%);display:none}
.hs-ring{width:44px;height:44px;border-radius:50%;border:2px solid var(--hot);opacity:.85;animation:hs-pulse 1.8s ease-in-out infinite}
.hs-dot{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:9px;height:9px;border-radius:50%;background:var(--hot)}
@keyframes hs-pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.4);opacity:.35}}
.hs-sprite.clickable{pointer-events:auto;cursor:pointer}
.annot-marker{position:absolute;pointer-events:auto;cursor:pointer;transform:translate(-50%,-50%);display:none;border-radius:50%;border:2px solid #000;box-sizing:border-box;transition:box-shadow .2s ease,transform .2s ease}
body.wce-cascade-open .annot-marker,
body.wce-cascade-open .hs-sprite,
body.wce-cascade-open #hotspot-layer > img{display:none !important}
.annot-marker:hover{transform:translate(-50%,-50%) scale(1.15)}
.annot-popup{position:fixed;z-index:10001;max-width:320px;background:rgba(10,10,12,.92);border:1px solid var(--accent,#c8a96e);border-radius:6px;padding:14px 16px;color:#fff;font-family:'Rajdhani',sans-serif;font-size:14px;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.annot-popup video{width:100%;border-radius:4px;display:block}
.annot-popup-close{position:absolute;top:6px;right:8px;cursor:pointer;font-size:16px;opacity:.7;line-height:1}
.annot-popup-close:hover{opacity:1}
.wce-overlay-thumb{position:fixed;z-index:6;cursor:pointer;background-size:cover;background-position:center;border:2px solid rgba(255,255,255,.85);box-shadow:0 2px 12px rgba(0,0,0,.45);transition:transform .15s ease,border-color .15s ease}
body:not(.wce-editing-mode) .wce-overlay-thumb:not(.wce-overlay-image):hover{transform:scale(1.08);border-color:var(--accent)}
.wce-overlay-thumb.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 2px 12px rgba(0,0,0,.45)}
.wce-overlay-text{position:fixed;z-index:6;pointer-events:none;font-family:'Rajdhani',sans-serif;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.6);white-space:nowrap}
.wce-overlay-linked{cursor:pointer !important;pointer-events:auto !important;transition:transform .15s ease,filter .15s ease}
body:not(.wce-editing-mode) .wce-overlay-linked:hover{transform:scale(1.08);filter:brightness(1.15)}
.wce-overlay-group{position:fixed;z-index:5;background:rgba(16,16,19,.85);border:1px solid rgba(255,255,255,.15);border-radius:8px;overflow:hidden;transition:width .25s ease}
.wce-group-header{display:flex;align-items:center;gap:6px;padding:6px 10px;cursor:pointer;font-family:'Rajdhani',sans-serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text);background:rgba(255,255,255,.06)}
body:not(.wce-editing-mode) .wce-group-header{transition:transform .25s ease,height .25s ease,width .25s ease}
.wce-group-arrow{font-size:9px;color:var(--accent);flex-shrink:0}
.wce-group-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.wce-group-body{position:relative;overflow:hidden}
body:not(.wce-editing-mode) .wce-group-body{transition:height .25s ease,width .25s ease}
.wce-group-body .wce-overlay-thumb,.wce-group-body .wce-overlay-text{position:absolute}
</style>
<style id="wce-theme-overrides">
:root{--bg:#0a0a0b;--panel:#101013;--border:#1c1c22;--accent:#c8a96e;--a2:#4a8cff;--ok:#4caf7d;--hot:#ff6b35;--cam:#9b59b6;--text:#e2ddd6;--muted:#52526a;--panel-bg:rgba(0,0,0,1.0)}
html,body{font-family:'Rajdhani',sans-serif;font-size:13px}
.pb2,.gb,.tb,.anim-btn,.cam-btn,.tt-btn,.vc,.tnb,.cin-btn,#ar-btn,#sfx-toggle,.sr select{border-radius:3px;clip-path:none;padding:7px 10px;border-width:1px;font-family:'Rajdhani',sans-serif;font-size:75%;letter-spacing:0.11em;font-weight:500;font-style:normal;text-transform:none;}
.sr select{font-family:'Rajdhani',sans-serif;font-size:75%;letter-spacing:0.11em;font-weight:500;font-style:normal;text-transform:none;}
#st{font-family:'Rajdhani',sans-serif;font-size:75%;letter-spacing:0.11em;font-weight:500;font-style:normal;text-transform:none;}
</style>

    const offX=(h.ground_offset&&h.ground_offset[0])||0;
    const offY=(h.ground_offset&&h.ground_offset[1])||0;
    // Vertical Offset — a plain rigid shift of the whole dome, added last so
    // it never touches the shape math above (shaderHeight/shaderRadius).
    // Blender Z and three.js Y are the same up-axis here.
    const zOffset = h.ground_z_offset||0;
    // Blender's ground plane (X,Y) → three.js (X,Z); three's Y stays vertical.
    _groundSky.position.set(offX, floorZ * (1 - scaleMultiplier) + zOffset, offY);
    
    scene.add(_groundSky);
    if(typeof requestRender==='function') requestRender(500);
  }catch(e){console.warn('[WCE] grounded skybox unavailable:',e);}
}

// ── Multi-HDRI loader + switcher — each item carries its own strength/
//    background/rotation/scale. Loaded textures are cached so re-switching
//    back to a previously-seen HDRI is instant. ──────────────────────────────
const _hdriCache={};       // file URL -> {tex, envRT}
let _hdriActiveFile=null;

function _envEulerZ(rotZdeg){
  // Single Z-axis (yaw) rotation per HDRI item — same Blender→three azimuth
  // negation convention as _envEuler(), just driven by the item's own value
  // instead of the legacy scene-wide CFG.grade.env_rotation.
  const d2r=Math.PI/180;
  const y=-((rotZdeg||0)+_ENV_AZIMUTH_OFFSET_DEG)*d2r;
  return new THREE.Euler(0,y,0,'XYZ');
}

function _applyEnvironmentAndLight(item){
  // Show/hide ENVIRONMENTS_<Name> / LIGHTS_<Name> nodes for this panel's
  // choices, additively alongside the always-on common layers
  // (ENVIRONMENT_common, LIGHTS) — unless a choice is null (meaning that
  // dropdown was set to None), which opts this panel out of its common
  // layer too. Mirrors applyGeoToggle's node-visibility approach, reusing
  // the same findNode mechanism since these are exported the same way
  // GEOMETRIES_ collections already are.
  const envSets=CFG.environment_sets||[];
  const lightSets=CFG.light_sets||[];
  const envChoice=(item&&item.environment)?item.environment.replace(/ /g,'_'):null;
  const lightChoice=(item&&item.light)?item.light.replace(/ /g,'_'):null;

  envSets.forEach(name=>{
    const n=findNode(name);
    if(n) n.visible=(name.replace(/ /g,'_')===envChoice);
  });
  if(CFG.environment_common_exists){
    const cn=findNode('ENVIRONMENTS_COMMON');
    if(cn) cn.visible=(envChoice!=null);
  }
  lightSets.forEach(name=>{
    const n=findNode(name);
    if(n) n.visible=(name.replace(/ /g,'_')===lightChoice);
  });
  if(CFG.light_common_exists){
    const ln=findNode('LIGHTS');
    if(ln) ln.visible=(lightChoice!=null);
  }

  // Area lights (RectAreaLight) aren't part of the glTF node hierarchy at
  // all — KHR_lights_punctual doesn't cover area lights — so they can't
  // ride along with the node-visibility switching above. They're added
  // directly to the Three.js scene instead (see the GLTFLoader callback),
  // each tagged with which rig it came from at export time. Toggle them
  // here too, using the exact same on/off rule as the mesh-based lights,
  // so an environment that doesn't include a given rig no longer keeps
  // that rig's area lights lit forever.
  _areaLights.forEach(light=>{
    const rawRig=light.userData.wceRig;
    if(!rawRig){ light.visible=true; return; }   // pre-fix export, no rig tag — always on
    const rig=rawRig.replace(/ /g,'_');
    light.visible=(rig==='LIGHTS')?(lightChoice!=null):(rig===lightChoice);
  });
}

function _applyAmbientFallback(item){
  // Flat fallback lighting for a panel with no effective HDRI (no file of
  // its own and no usable Common HDRI). Mirrors the Blender-side Ambient
  // Light branch in _wce_push_hdri_to_world: clear any environment/
  // background texture and light the scene with a plain AmbientLight
  // instead, defaulting to solid black rather than leaving whatever was
  // previously rendered (or an undefined/transparent canvas).
  scene.environment=null;
  if(scene.background && scene.background.isTexture) scene.background=null;
  scene.background=new THREE.Color(0,0,0);
  if(_groundSky){ scene.remove(_groundSky); _groundSky.geometry?.dispose?.(); _groundSky=null; }
  const c=(item&&item.ambient_color)||[1,1,1];
  _ambientLight.color.setRGB(c[0]??1,c[1]??1,c[2]??1);
  _ambientLight.intensity=(item&&item.ambient_strength!=null)?item.ambient_strength:0.3;
  // Fallback look/post-process — same fields _snapHDRI applies for a real
  // HDRI, sourced here from this panel's own (or scene-default) values so a
  // no-HDRI panel still gets a deliberate grade instead of inheriting
  // whatever the previously-active HDRI left behind.
  if(typeof renderer!=='undefined' && renderer)
    renderer.toneMappingExposure=Math.pow(2,(item&&item.grade_exposure)||0);
  if(typeof gradePass!=='undefined' && gradePass && gradePass.material){
    const u=gradePass.material.uniforms;
    u.brightness.value=(item&&item.grade_brightness!=null)?item.grade_brightness:1.0;
    u.contrast.value=(item&&item.grade_contrast!=null)?item.grade_contrast:1.0;
    u.saturation.value=(item&&item.grade_saturation!=null)?item.grade_saturation:1.0;
  }
  if(typeof bloomPass!=='undefined' && bloomPass){
    bloomPass.strength=(item&&item.grade_bloom!=null)?item.grade_bloom:0.25;
    bloomPass.threshold=(item&&item.grade_bloom_threshold!=null)?item.grade_bloom_threshold:0.88;
  }
  scene.environmentIntensity=(item&&item.strength!=null)?item.strength:1.0;
  _hdriActiveFile=null;
  if(typeof requestRender==='function') requestRender(400);
}

function _snapHDRI(item,tex,envRT){
  // Instant application — called directly on first load and at the midpoint
  // of the cross-fade (when intensity is already 0) when transitioning.
  _equirectTex=tex;
  scene.environment=envRT.texture;
  // A real HDRI is driving lighting now — the per-panel Ambient Light
  // fallback doesn't apply, so switch it fully off. (Previously this fell
  // back to the shared scene-wide CFG.grade.ambient_intensity, which is the
  // same value every no-HDRI environment's Ambient toggle writes to — so an
  // ambient light left on by one no-HDRI environment would keep bleeding
  // into any HDRI environment switched to afterwards. This panel's own
  // ambient_strength is guaranteed 0 whenever it has an image, so 0 here is
  // always correct.)
  _ambientLight.intensity=0;
  const targetStrength=(item.strength!=null)?item.strength:1.0;
  scene.environmentIntensity=targetStrength;
  const _eul=_envEulerZ(item.rotation_z);
  if(scene.environmentRotation) scene.environmentRotation.copy(_eul);
  CFG.hdri=CFG.hdri||{};
  CFG.hdri.file=item.file;
  CFG.hdri.background=!!item.background;
  CFG.hdri.flatten_ground=!!item.flatten_ground;
  CFG.hdri.ground_height=item.ground_height;
  CFG.hdri.ground_radius=item.ground_radius;
  CFG.hdri.ground_rotation_z=item.ground_rotation_z;
  CFG.hdri.ground_scale=item.ground_scale;
  CFG.hdri.ground_offset=item.ground_offset;
  CFG.hdri.ground_z_offset=item.ground_z_offset;
  if(item.background){
    scene.background=envRT.texture;
    scene.backgroundIntensity=targetStrength;
    if(scene.backgroundRotation) scene.backgroundRotation.copy(_eul);
    _buildGroundedSkybox();
  }else{
    if(_groundSky){ scene.remove(_groundSky); _groundSky.geometry?.dispose?.(); _groundSky=null; }
    if(scene.background && scene.background.isTexture) scene.background=null;
  }
  if(typeof renderer!=='undefined' && renderer)
    renderer.toneMappingExposure=Math.pow(2,item.grade_exposure||0);
  if(typeof gradePass!=='undefined' && gradePass && gradePass.material){
    const u=gradePass.material.uniforms;
    u.brightness.value=(item.grade_brightness!=null)?item.grade_brightness:1.0;
    u.contrast.value=(item.grade_contrast!=null)?item.grade_contrast:1.0;
    u.saturation.value=(item.grade_saturation!=null)?item.grade_saturation:1.0;
  }
  if(typeof bloomPass!=='undefined' && bloomPass){
    bloomPass.strength=(item.grade_bloom!=null)?item.grade_bloom:0.25;
    bloomPass.threshold=(item.grade_bloom_threshold!=null)?item.grade_bloom_threshold:0.88;
  }
  _hdriActiveFile=item.file;
}

function _applyHDRITexture(item,tex,envRT){
  _snapHDRI(item,tex,envRT);
  if(typeof requestRender==='function') requestRender(800);
}

function _loadHDRIItem(item){
  // Environment/Light switching and the Ambient Light fallback both work
  // independently of whether this panel has an HDRI file — run first,
  // unconditionally, even when there is no panel at all (item is null,
  // e.g. zero Environment entries created) so the scene always ends up in a
  // deliberate state (solid black + flat ambient) rather than whatever
  // Three.js's own defaults happen to leave it in.
  _applyEnvironmentAndLight(item);
  if(!item || !item.file){ _applyAmbientFallback(item); return; }
  const cached=_hdriCache[item.file];
  if(cached){ _applyHDRITexture(item,cached.tex,cached.envRT); return; }
  new RGBELoader().load(item.file,(t)=>{
    t.mapping=THREE.EquirectangularReflectionMapping;
    // PMREM prefiltering gives EEVEE-like roughness/reflection response
    // instead of a raw equirect lookup.
    const _pmrem=new THREE.PMREMGenerator(renderer);
    _pmrem.compileEquirectangularShader();
    const _envRT=_pmrem.fromEquirectangular(t);
    _pmrem.dispose();   // dispose the generator only — t/_envRT stay live & cached
    _hdriCache[item.file]={tex:t, envRT:_envRT};
    _applyHDRITexture(item,t,_envRT);
  },undefined,(e)=>{console.warn('[WCE] HDRI load failed:',item.file,e);});
}

// buildHDRISwitcher -> ui.js
// ── Smooth transitions (materials + geometry) ───────────────────────────────
const _TRANS=CFG.transitions||{};
window._TRANS=_TRANS;
const _matTweens=[];   // {mat, from:{...}, to:{...}, t, dur}
const _geoTweens=[];   // {meshes:[{mesh, origMats, clones}], dir, t, dur, hideAtEnd:[nodes]}
let _lastTransT=performance.now();
function _bumpAnim(ms){ if(typeof _animActiveUntil!=='undefined') _animActiveUntil=Math.max(_animActiveUntil,performance.now()+(ms||400)); }

function _tickTransitions(dt){
  // Material colour / metallic / roughness / emissive lerps.
  for(let i=_matTweens.length-1;i>=0;i--){
    const w=_matTweens[i]; w.t+=dt*1000;
    const k=Math.min(1,w.t/w.dur);
    w.mat.color.lerpColors(w.from.color,w.to.color,k);
    w.mat.metalness=w.from.metalness+(w.to.metalness-w.from.metalness)*k;
    w.mat.roughness=w.from.roughness+(w.to.roughness-w.from.roughness)*k;
    if(w.mat.emissive) w.mat.emissive.lerpColors(w.from.emissive,w.to.emissive,k);
    w.mat.needsUpdate=true;
    if(k>=1) _matTweens.splice(i,1);
  }
  // Geometry dither-dissolve (alpha-hash opacity ramps on temporary clones).
  for(let i=_geoTweens.length-1;i>=0;i--){
    const w=_geoTweens[i]; w.t+=dt*1000;
    const k=Math.min(1,w.t/w.dur);
    const op=(w.dir>0)?k:(1-k);
    w.meshes.forEach(rec=>{
      rec.clones.forEach(c=>{ c.opacity=op; c.needsUpdate=true; });
    });
    if(k>=1){
      // Restore original materials; control visibility at the NODE level only
      // (never leave a child mesh individually hidden, or it goes missing when
      // the node is shown again).
      w.meshes.forEach(rec=>{ rec.mesh.material=rec.wasArr?rec.origMats:rec.origMats[0]; });
      if(w.node && w.dir<0) w.node.visible=false;
      _geoTweens.splice(i,1);
    }
  }
}

function _meshesUnder(node){
  const out=[]; if(node) node.traverse(o=>{ if(o.isMesh) out.push(o); }); return out;
}
// Begin a dissolve for a node: dir>0 fades in (node becomes visible), dir<0
// fades out (node hidden at the end). Visibility is ALWAYS controlled on the
// node, never on individual child meshes.
function _geoDissolveNode(node,dir){
  if(!node) return;
  const meshes=_meshesUnder(node);
  if(!meshes.length){ node.visible=(dir>0); return; }
  // Finalise any in-flight dissolve touching these meshes: restore originals and
  // settle node visibility, so we never strand a mesh on a clone or hidden state.
  const meshSet=new Set(meshes);
  for(let i=_geoTweens.length-1;i>=0;i--){
    const tw=_geoTweens[i];
    if(tw.meshes.some(r=>meshSet.has(r.mesh))){
      tw.meshes.forEach(r=>{ r.mesh.material=r.wasArr?r.origMats:r.origMats[0]; });
      if(tw.node) tw.node.visible=(tw.dir>0);
      _geoTweens.splice(i,1);
    }
  }
  node.visible=true;                  // visible for the whole transition
  const recs=meshes.map(mesh=>{
    const wasArr=Array.isArray(mesh.material);
    const origMats=wasArr?[...mesh.material]:[mesh.material];
    const clones=origMats.map(m=>{
      const c=m.clone();
      c.alphaHash=true;          // order-independent dithered transparency
      c.transparent=false; c.depthWrite=true;
      c.opacity=(dir>0)?0:1;
      c.needsUpdate=true;        // force shader recompile so alphaHash takes effect
      return c;
    });
    mesh.material=wasArr?clones:clones[0];
    return {mesh,wasArr,origMats,clones};
  });
  _geoTweens.push({meshes:recs,node,dir,t:0,dur:(_TRANS.geo_ms||180)});
  _bumpAnim((_TRANS.geo_ms||180)+200);
}

// ── Geometry Opacity: On/Off Switch + Flicker ───────────────────────────────
// Both reuse _geoDissolveNode above — a plain client-side material fade, with
// zero dependency on glTF animation channels or KHR_animation_pointer.
function _triggerGeoToggle(def){
  const nodes=(def.geo_nodes||[]).map(_findGeoTarget).filter(Boolean);
  if(!nodes.length) return;
  const prev=animState[def.name]??0;
  const next=prev>0?0:1;
  animState[def.name]=next;
  nodes.forEach(node=>{
    if(_TRANS.geometry) _geoDissolveNode(node, next>0?1:-1);
    else node.visible=(next>0);
  });
  const btn=document.querySelector(`.anim-btn[data-anim="${def.name}"]`);
  if(btn) btn.classList.toggle('playing', next>0);
  if(typeof requestRender==='function') requestRender(300);
}

const _geoFlickerTimers={};
function _triggerGeoFlicker(def){
  const nodes=(def.geo_nodes||[]).map(_findGeoTarget).filter(Boolean);
  if(!nodes.length) return;
  // Re-triggering restarts cleanly rather than stacking two competing loops.
  if(_geoFlickerTimers[def.name]) _geoFlickerTimers[def.name].forEach(t=>clearTimeout(t));
  const count=Math.max(1, def.flicker_count||5);
  const totalMs=Math.max(100, (def.flicker_duration||1.5)*1000);
  const endsOn=(def.flicker_end_state||'ON')!=='OFF';
  // count*2 alternating OFF/ON steps always naturally lands on ON (the
  // pattern starts OFF and count*2 is always even, so the last index is
  // odd → showing=true). Ending OFF instead just needs one more half-step
  // tacked on at the end to flip it back down. This is already exact, so
  // there's no extra "settle" step needed after the loop — an earlier
  // version had one anyway, which fired a redundant fade every single time
  // regardless of whether it was needed, showing up as a phantom extra
  // flicker right at the end of every real one.
  const totalSteps=count*2+(endsOn?0:1);
  const stepMs=totalMs/totalSteps;
  const timers=[];
  for(let i=0;i<totalSteps;i++){
    const showing=(i%2===1);
    timers.push(setTimeout(()=>{
      nodes.forEach(node=>{
        if(_TRANS.geometry) _geoDissolveNode(node, showing?1:-1);
        else node.visible=showing;
      });
      if(i===totalSteps-1) delete _geoFlickerTimers[def.name];
    }, stepMs*i));
  }
  _geoFlickerTimers[def.name]=timers;
  if(typeof requestRender==='function') requestRender(totalMs+300);
}

const ctrl=new OrbitControls(cam,canvas);
ctrl.enableDamping=true; ctrl.dampingFactor=0.06;
ctrl.minDistance=CFG.camera.zoom_min;
ctrl.maxDistance=CFG.camera.zoom_max;
ctrl.target.set(0,0.8,0);
(function _applyStartupCamera(){
  const sc=CFG.camera&&CFG.camera.startup_camera;
  if(!sc||!sc.position) return;
  const p=sc.position;
  const f=sc.forward||[0,0,-1];
  cam.position.set(p[0],p[1],p[2]);
  // Compute ctrl.target along the Blender camera's actual forward direction.
  // Project the model origin onto the forward ray — this gives the closest
  // point on the ray to the model, which is the ideal orbit pivot and
  // reproduces exactly what the Blender camera view shows.
  const fwd=new THREE.Vector3(f[0],f[1],f[2]).normalize();
  const toOrigin=new THREE.Vector3(-p[0],-p[1],-p[2]);
  const projDist=Math.max(0.5,toOrigin.dot(fwd));
  ctrl.target.copy(cam.position).addScaledVector(fwd,projDist);
  cam.lookAt(ctrl.target);
  if(sc.hfov_deg){
    const hRad=sc.hfov_deg*Math.PI/180;
    const vRad=2*Math.atan(Math.tan(hRad/2)*canvas.height/canvas.width);
    cam.fov=vRad*180/Math.PI; cam.updateProjectionMatrix();
  }
  // Drain all damping residuals so the first fly tick starts from a
  // stable camera position with no accumulated orbital momentum.
  const _dWas=ctrl.enableDamping; ctrl.enableDamping=false;
  for(let _i=0;_i<20;_i++) ctrl.update();
  ctrl.enableDamping=_dWas;
})();
// Optional roof plane: camera can't orbit above it (dynamic, like the floor).
const ROOF_Z=(CFG.camera && CFG.camera.roof_z!=null)?CFG.camera.roof_z:null;

const FLOOR_Z = CFG.camera.floor_z ?? 0.0;

// ── RENDER ON DEMAND ────────────────────────────────────────────────────────
// A configurator sits idle most of the time, yet the composer (RenderPass +
// optional Bloom + OutputPass + grade) is expensive. Instead of drawing every
// frame, we draw only for a short window after any interaction, while damping
// settles, and continuously while something is actually animating. This is the
// single biggest perf win on Chrome.
let _renderUntil=performance.now()+1500;   // draw for a moment on first load
let _animActiveUntil=0;                    // extended by triggerAnim / hover
function requestRender(ms){ _renderUntil=Math.max(_renderUntil, performance.now()+(ms||300)); }
// 400ms, not 150ms — this is the only thing keeping the render loop alive
// during camera rotation (the broader _active check below has no dedicated
// "user is currently dragging" state of its own). Touch input on mobile can
// legitimately have small gaps between delivered events that continuous
// desktop mouse movement doesn't, and with alpha:true + no
// preserveDrawingBuffer on the renderer, even a single skipped render call
// isn't guaranteed to keep showing the previous frame — it can flash black
// instead. 400ms matches the margin already used elsewhere in this file for
// similar interactions, and is far too short to be perceptible as "still
// rendering after you stopped moving" on any device.
ctrl.addEventListener('change',()=>requestRender(400));
['pointerdown','pointerup','wheel','keydown','click','input','touchstart','touchend']
  .forEach(ev=>window.addEventListener(ev,()=>requestRender(400),{passive:true}));

// Explicit "user is actively dragging" state — the render loop's _active
// check otherwise has no dedicated awareness of this at all, relying
// entirely on requestRender's timeout being re-triggered often enough by
// events like the 'change' listener above. Under load (a heavier model,
// a slower device, delayed touch event delivery — all more common on
// mobile), that timeout can expire mid-gesture, skipping a render call —
// and with alpha:true + no preserveDrawingBuffer, a skipped frame isn't
// guaranteed to still show the previous one; it can flash black instead.
// This flag removes the dependency on timing entirely: while it's true,
// the render loop always attempts to draw, no matter how the timeout
// would otherwise have resolved.
let _userInteracting=false;
// Detects "still settling from damping" independently of drag state or
// event timing — compares the camera's actual position/target against the
// previous frame's, every frame, regardless of whether that frame renders.
// Covers the gap _userInteracting alone doesn't: after release, damping
// keeps moving the camera for a bit, decelerating — that motion was
// previously only being kept alive by the same event-timeout mechanism the
// drag-state flag was built to stop relying on.
//
// Hysteresis, not a single-frame reading: under irregular frame timing
// (a loaded phone especially), one frame's movement can measure below
// _SETTLE_EPS even while damping is still genuinely, continuously
// progressing underneath it — ctrl.update() runs every animation frame
// regardless of whether that frame renders, so damping's own progress
// never actually pauses just because one measurement looked still. Acting
// on that single frame would let rendering stop mid-damping. Requiring
// several CONSECUTIVE stable frames before ever reporting "settled"
// absorbs that — one apparently-still frame no longer ends the window;
// only a real, sustained stop does.
let _prevCamPos=null,_prevCamTarget=null;
const _SETTLE_EPS=1e-5;
const _SETTLE_STABLE_FRAMES_NEEDED=8;
let _settleStableFrames=0;
function _cameraStillSettling(){
  if(_prevCamPos===null){
    _prevCamPos=cam.position.clone(); _prevCamTarget=ctrl.target.clone();
    return true;   // no prior frame to compare against yet — assume active
  }
  const moved = cam.position.distanceToSquared(_prevCamPos)>_SETTLE_EPS
             || ctrl.target.distanceToSquared(_prevCamTarget)>_SETTLE_EPS;
  _prevCamPos.copy(cam.position); _prevCamTarget.copy(ctrl.target);
  if(moved){
    _settleStableFrames=0;
    return true;
  }
  _settleStableFrames++;
  return _settleStableFrames<_SETTLE_STABLE_FRAMES_NEEDED;
}
canvas.addEventListener('pointerdown',()=>{ _userInteracting=true; });
window.addEventListener('pointerup',()=>{ _userInteracting=false; });
window.addEventListener('pointercancel',()=>{ _userInteracting=false; });

// ── SOUND FX ──────────────────────────────────────────────────────────────
const SFX=(()=>{
  let enabled=true;
  try{ enabled=localStorage.getItem('wce_sfx')!=='0'; }catch(e){}
  
  function playFile(src){
    if(!enabled || !src) return;
    const audio = new Audio(src);
    audio.play().catch(e => console.warn('[WCE] Audio playback blocked:', e));
  }

  function _syncBtn(){
    const b=document.getElementById('sfx-toggle');
    if(b){ b.classList.toggle('off',!enabled); b.title=enabled?'Sound on':'Muted'; }
  }
  
  function setEnabled(v){ enabled=!!v; try{localStorage.setItem('wce_sfx',enabled?'1':'0');}catch(e){} _syncBtn(); }
  
  return {
    playFile,
    toggle:()=>setEnabled(!enabled),
    isOn:()=>enabled,
    init:_syncBtn
  };
})();

(function _wireSfx(){
  const b=document.getElementById('sfx-toggle');
  if(b) b.addEventListener('click', ()=>SFX.toggle());
  SFX.init();
})();

const _grade = _initHdri || CFG.grade || {};
const _bloomStrength = (_initHdri ? _initHdri.grade_bloom : _grade.bloom) ?? 0.25;
const _bloomThreshold = (_initHdri ? _initHdri.grade_bloom_threshold : _grade.bloom_threshold) ?? 0.88;
const comp=new EffectComposer(renderer);
comp.addPass(new RenderPass(scene,cam));
// Bloom is the most expensive pass (multi-pass down/up sample) — only add it
// if at least one switchable HDRI actually wants it. If added, its strength
// becomes live-adjustable per item in _applyHDRITexture() below.
const _anyBloom = (CFG.hdris||[]).some(h => (h.grade_bloom||0) > 0) || _bloomStrength > 0;
let bloomPass=null;
if(_anyBloom){
  bloomPass=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),
    _bloomStrength,0.4,_bloomThreshold);
  comp.addPass(bloomPass);
}
comp.addPass(new OutputPass());

// ── Look grade: brightness / contrast / saturation, applied on the tone-mapped
//    (display-referred) image as a final pass so the sliders behave like an
//    intuitive photo grade. Driven per-HDRI-item now (see _applyHDRITexture);
//    seeded here from the default item / legacy CFG.grade for first paint.
const _GradeShader = {
  uniforms: {
    tDiffuse:   { value: null },
    brightness: { value: (_initHdri ? _initHdri.grade_brightness : _grade.brightness) ?? 1.0 },
    contrast:   { value: (_initHdri ? _initHdri.grade_contrast   : _grade.contrast)   ?? 1.0 },
    saturation: { value: (_initHdri ? _initHdri.grade_saturation : _grade.saturation) ?? 1.0 },
  },
  vertexShader: `
    varying vec2 vUv;
    void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float brightness; uniform float contrast; uniform float saturation;
    varying vec2 vUv;
    void main(){
      vec4 c=texture2D(tDiffuse,vUv);
      vec3 col=c.rgb*brightness;
      col=(col-0.5)*contrast+0.5;
      float l=dot(col,vec3(0.2126,0.7152,0.0722));
      col=mix(vec3(l),col,saturation);
      gl_FragColor=vec4(clamp(col,0.0,1.0),c.a);
    }
  `,
};
const gradePass=new ShaderPass(_GradeShader);
comp.addPass(gradePass);

// Cheap antialiasing: a single FXAA pass at the very end smooths edges for a
// fraction of MSAA's cost (one fragment shader pass, no extra render targets).
const fxaaPass=new ShaderPass(FXAAShader);
function _updateFXAA(){
  const pr=renderer.getPixelRatio();
  fxaaPass.material.uniforms['resolution'].value.set(1/(innerWidth*pr), 1/(innerHeight*pr));
}
_updateFXAA();
comp.addPass(fxaaPass);

window.addEventListener('resize',()=>{
  console.log('[Resize debug] resize event fired — innerWidth='+innerWidth+' innerHeight='+innerHeight
    +' | OLD cam.aspect='+cam.aspect+' | NEW aspect='+(innerWidth/innerHeight)
    +' | cam.fov BEFORE='+cam.fov);
  cam.aspect=innerWidth/innerHeight; _updateCamFov(); cam.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); comp.setSize(innerWidth,innerHeight);
  _updateFXAA();
  requestRender(400);
  console.log('[Resize debug] after resize handling — cam.fov AFTER='+cam.fov);
});

const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();

// ── ANIMATION SYSTEM ─────────────────────────────────────────────────────

const animState={}, animMixers={}, animClips={};
window.animState=animState;
const _clock=new THREE.Clock();

// Per-control/combo ping-pong direction (+1 / -1), mirrors core pingpong_dir.
const _pingDir={};
// Active segment watchers keyed by mixer key: {action, target, dir}. The tick
// loop stops an action exactly at `target` clip-time (LoopOnce only clamps at a
// clip's natural end, so interior state holds need a manual watcher).
const _segWatch={};
window._segWatch=_segWatch;         // expose so ui.js executeSequence can observe it
const _segBtnMap={};   // clip key → anim def name
const _animBtnKeys={};  // def name → Set of live clip keys
window._animBtnKeys=_animBtnKeys;  // expose to ui.js (button highlight tracking)

// Hover toggle (perpetual): two baked clips — "Hover" (rise/drop) and
// "HoverLoop" (seamless bob+spin loop). Captured by _initAnimMixers.
let _hoverMixer=null,_hoverRiseClip=null,_hoverLoopClip=null;
let _hoverOn=false,_hoverLoopAction=null;

// ── Built-in mode coordination ────────────────────────────────────────────
// Explode and Hover are whole-vehicle "modes" that own many of the same parts.
// Triggering anything else must take over from them, so the user never has to
// stop them manually. We snap an interrupted mode back to its rest pose using
// the clip's own frame 0 (robust — no scene-graph name lookups needed).
const _builtinActive={Explode:false,Hover:false};

function _snapToClipStart(mixer,clip){
  if(!mixer||!clip) return;
  mixer.stopAllAction();
  const a=mixer.clipAction(clip);
  a.reset(); a.enabled=true; a.weight=1; a.timeScale=1; a.time=0; a.play();
  mixer.update(0);            // apply frame 0 (rest) to the bound nodes
  mixer.stopAllAction();
}

function _resetBuiltin(name){
  if(name==='Hover'){
    _snapToClipStart(_hoverMixer,_hoverRiseClip);   // grounded pose
    _hoverOn=false; _hoverLoopAction=null;
  } else {   // Explode
    delete _segWatch[_resolveAnimKey(name)];
    _snapToClipStart(animMixers[name],(animClips[name]||[])[0]);  // assembled pose
    animState[name]=0;
    const sp=document.querySelector(`.anim-btn[data-anim="${name}"] .anim-state`);
    if(sp) sp.textContent='[0/1]';
  }
  const b=document.querySelector(`.anim-btn[data-anim="${name}"]`);
  if(b) b.classList.remove('playing');
  _builtinActive[name]=false;
}

function _stopOtherBuiltins(name){
  ['Explode','Hover'].forEach(b=>{ if(b!==name && _builtinActive[b]) _resetBuiltin(b); });
}

// Snap a single control/combo-member to its rest pose (clip frame 0) and stop
// its mixer so a clamped action stops writing.
function _snapControlToRest(cn){
  const k=_resolveAnimKey(cn);
  delete _segWatch[k];
  _snapToClipStart(animMixers[k],(animClips[k]||[])[0]);
  animState[cn]=0; animState[k]=0;
  const b=document.querySelector(`.anim-btn[data-anim="${cn}"]`);
  if(b) b.classList.remove('playing');
}

// Return every regular control and combo to rest. Called when a built-in mode
// (Explode / Hover) starts, so it takes over the vehicle cleanly instead of
// stacking on top of whatever controls were left open.
function _resetAllRegular(){
  // Primary triggers
  allAnimDefs().forEach(def=>{
    if(def.builtin) return;                       // skip the Explode/Hover entries
    if(Array.isArray(def.members)) def.members.forEach(_snapControlToRest);
    else _snapControlToRest(def.name);
    animState[def.name]=0;
    const b=document.querySelector(`.anim-btn[data-anim="${def.name}"]`);
    if(b){
      b.classList.remove('playing');
      const sp=b.querySelector('.anim-state');
      if(sp) sp.textContent=_animLabel(def,0);
    }
  });
}

function toggleHover(def){
  if(!_hoverMixer||!_hoverRiseClip) return;
  const btn=document.querySelector(`.anim-btn[data-anim="${def.name}"]`);
  if(!_hoverOn){
    // ── Turn ON: play the rise once, then cross-fade into the perpetual loop.
    _stopOtherBuiltins('Hover');     // take over from Explode if it's active
    _resetAllRegular();              // and from any open controls/combos
    _hoverOn=true; _builtinActive.Hover=true;
    if(btn) btn.classList.add('playing');
    if(def.sounds && def.sounds[1]) SFX.playFile(def.sounds[1]);
    _hoverMixer.stopAllAction();
    const rise=_hoverMixer.clipAction(_hoverRiseClip);
    rise.setLoop(THREE.LoopOnce,1); rise.clampWhenFinished=true;
    rise.reset(); rise.enabled=true; rise.timeScale=1; rise.time=0; rise.play();
    if(_hoverLoopClip){
      const loop=_hoverMixer.clipAction(_hoverLoopClip);
      loop.setLoop(THREE.LoopRepeat,Infinity); loop.clampWhenFinished=false;
      _hoverLoopAction=loop;
      const onFin=(e)=>{
        if(e.action!==rise) return;
        _hoverMixer.removeEventListener('finished',onFin);
        if(!_hoverOn) return;          // user already toggled off mid-rise
        loop.reset(); loop.enabled=true; loop.timeScale=1; loop.play();
        rise.crossFadeTo(loop,0.3,false);
      };
      _hoverMixer.addEventListener('finished',onFin);
    }
  } else {
    // ── Turn OFF: cross-fade from the loop into the reversed rise (= drop).
    _hoverOn=false; _builtinActive.Hover=false;
    if(btn) btn.classList.remove('playing');
    const drop=_hoverMixer.clipAction(_hoverRiseClip);  // same action instance
    drop.setLoop(THREE.LoopOnce,1); drop.clampWhenFinished=true;
    drop.enabled=true; drop.paused=false;
    drop.timeScale=-1; drop.time=_hoverRiseClip.duration; drop.play();
    if(_hoverLoopAction){ _hoverLoopAction.crossFadeTo(drop,0.3,false); _hoverLoopAction=null; }
    // The drop/cross-fade plays after _hoverOn is already false — keep drawing.
    if(typeof _animActiveUntil!=='undefined') _animActiveUntil=performance.now()+1200;
  }
}

function allAnimDefs(){
  const c=CFG.animations||{};
  return [...(c.controls||[]),...(c.combos||[])];
}

// Button label for a control/combo at a given state index: "<state name> [i/max]".
// state_names come from core.py (per-state for controls; derived+deduped for
// combos). Falls back to the bare counter when no name is present.
// _animLabel -> ui.js
// Compute the next state index, mirroring core.py OBJECT_OT_AnimSetTrigger:
//   • <=1 state  → always 0
//   • 2 states   → plain toggle 0↔1 (reverse-close), regardless of mode. This
//                  keeps built-ins and simple open/close controls behaving as a
//                  bidirectional toggle.
//   • >2 states  → LOOP (0→1→…→N-1→0→1→…, each step a normal eased transition)
//                  or PINGPONG (0→1→…→N-1→…→1→0→…).
function _stepState(prev,total,mode,name){
  if(total<=1) return {next:0};
  if(total===2) return {next:(prev+1)%2};
  if(mode==='PINGPONG'){
    let dir=_pingDir[name]??1;
    if(prev>=total-1&&dir===1) dir=-1;
    else if(prev<=0&&dir===-1) dir=1;
    _pingDir[name]=dir;
    return {next:Math.max(0,Math.min(prev+dir,total-1))};
  }
  // LOOP — wrap back to state 0 the same way every other step happens: a
  // normal eased transition from wherever we are now, not an instant,
  // invisible teleport that skips straight past it to state 1.
  if(prev>=total-1) return {next:0};
  return {next:prev+1};
}

function triggerAnim(name){
  const defs=allAnimDefs();
  const def=defs.find(d=>d.name===name);
  if(!def) return;

  // Hover is a perpetual on/off toggle, handled by its own state machine.
  if(def.builtin==='hover'){ toggleHover(def); return; }

  // GEO_TOGGLE / GEO_FLICKER: pure mesh show/hide, driven entirely by the
  // viewer's existing client-side dissolve fade (_geoDissolveNode) — no
  // AnimationMixer, no glTF animation clip involved at all. That's what
  // makes this possible without hitting the KHR_animation_pointer wall that
  // blocks animating material/light properties: this never touches glTF
  // animation data in the first place.
  if(def.anim_type==='GEO_TOGGLE'){ _triggerGeoToggle(def); return; }
  if(def.anim_type==='GEO_FLICKER'){ _triggerGeoFlicker(def); return; }

  _stopOtherBuiltins(name);

  const total=def.states??2;
  const mode=def.playback_mode||'LOOP';
  const prev=animState[name]??0;
  const {next}=_stepState(prev,total,mode,name);

  // Resolve what to drive FIRST, and snapshot each drive's TRUE current state
  // before anything below overwrites animState. A control drives itself with
  // its own state_fracs; a combo fans out to its members, each with its own
  // member_fracs. Members with fewer states clamp (index capped to their
  // frac list length). The snapshot is essential: for a single control the
  // resolved key is usually the same string as its own name, so reading
  // animState[key] AFTER animState[name] is set below would read the value
  // that was just overwritten — collapsing mFrom to equal mTo and causing an
  // instant snap instead of a smooth transition.
  let drives;
  if(Array.isArray(def.members)){
    drives=def.members.map(m=>({
      m, key:_resolveAnimKey(m),
      fracs:(def.member_fracs&&def.member_fracs[m])||[0,1]
    }));
  }else{
    drives=[{m:name, key:_resolveAnimKey(name), fracs:def.state_fracs||[0,1]}];
  }
  const _snapshot=drives.map(d=>animState[d.key]??0);

  animState[name]=next;

  // Sound mapped to the state we're transitioning into.
  if(def.sounds&&def.sounds[next]) SFX.playFile(def.sounds[next]);

  // This trigger's OWN button only. Controls and combos are visually and
  // functionally independent — a combo never lights up an individual part's
  // button (and vice versa), even if the combo internally drives that part.
  // Button lit only while drives are actively transitioning in _segWatch.
  // Decision is deferred until after drives.forEach so we can check which
  // keys actually entered _segWatch (zero-length holds do not).
  const _trigBtn=document.querySelector(`.anim-btn[data-anim="${name}"]`);

  if(def.builtin==='explode'){
    _builtinActive.Explode=(next!==0);
    if(next!==0) _resetAllRegular();   // take over from any open controls/combos
  }

  drives.forEach(({m,key,fracs},_i)=>{
    // A combo member might itself be a GEO_TOGGLE/GEO_FLICKER control — those
    // don't go through _playMemberSegment at all (no mixer, no glTF clip),
    // so route them the same way the standalone early-return above does.
    const mDef=Array.isArray(def.members)?defs.find(d=>d.name===m):def;
    if(mDef&&mDef.anim_type==='GEO_TOGGLE'){
      const nodes=(mDef.geo_nodes||[]).map(_findGeoTarget).filter(Boolean);
      const tgt=next>0?1:0;
      nodes.forEach(node=>{
        if(_TRANS.geometry) _geoDissolveNode(node, tgt>0?1:-1); else node.visible=(tgt>0);
      });
      return;
    }
    if(mDef&&mDef.anim_type==='GEO_FLICKER'){ _triggerGeoFlicker(mDef); return; }
    const fLen=Math.max(1,fracs.length);
    const curState=_snapshot[_i];
    const mFrom=Math.min(curState,fLen-1);
    const mTo=Math.min(next,fLen-1);
    animState[key]=mTo;
    _playMemberSegment(key,fracs,mFrom,mTo);
  });
  // Light button only if ≥1 drive is actually animating in _segWatch.
  // Zero-length holds (part already at target) never enter _segWatch.
  if(_trigBtn){
    const _liveKeys=drives.map(d=>d.key).filter(k=>_segWatch[k]);
    if(_liveKeys.length>0){
      _trigBtn.classList.add('playing');
      _animBtnKeys[name]=new Set(_liveKeys);
      _liveKeys.forEach(k=>{_segBtnMap[k]=name;});
    }else{
      _trigBtn.classList.remove('playing');
    }
  }

  // Keep the render loop awake while this trigger plays out (segment watchers
  // cover long clips precisely; this bridges short / clamped-hold steps).
  if(typeof _animActiveUntil!=='undefined') _animActiveUntil=performance.now()+1500;
}

/**
 * Drive an animation directly to an explicit target state index, bypassing
 * _stepState entirely. Used by sequences so any state — including 0 (rest) —
 * is reachable without the click-cycling hack of setting animState to target-1
 * and hoping _stepState increments correctly.
 */
function flyToAnimState(name, targetState){
  const defs=allAnimDefs();
  const def=defs.find(d=>d.name===name);
  if(!def) return;

  // Same pure-visibility handling as triggerAnim — no AnimationMixer or
  // glTF clip involved, so this is what lets a Sequence step (which calls
  // this function directly, not triggerAnim) actually drive one of these.
  if(def.anim_type==='GEO_TOGGLE'){
    const nodes=(def.geo_nodes||[]).map(_findGeoTarget).filter(Boolean);
    if(!nodes.length) return;
    const tgt=targetState>0?1:0;
    animState[name]=tgt;
    nodes.forEach(node=>{
      if(_TRANS.geometry) _geoDissolveNode(node, tgt>0?1:-1);
      else node.visible=(tgt>0);
    });
    const btn=document.querySelector(`.anim-btn[data-anim="${name}"]`);
    if(btn) btn.classList.toggle('playing', tgt>0);
    if(typeof requestRender==='function') requestRender(300);
    return;
  }
  if(def.anim_type==='GEO_FLICKER'){ _triggerGeoFlicker(def); return; }

  const total=def.states??2;
  const tgt=Math.max(0,Math.min(targetState,total-1));

  // Resolve drives — same logic as triggerAnim.
  let drives;
  if(Array.isArray(def.members)){
    drives=def.members.map(m=>({
      m, key:_resolveAnimKey(m),
      fracs:(def.member_fracs&&def.member_fracs[m])||[0,1]
    }));
  }else{
    drives=[{m:name, key:_resolveAnimKey(name), fracs:def.state_fracs||[0,1]}];
  }

  // Snapshot actual current state of each drive BEFORE writing animState.
  const snap=drives.map(d=>animState[d.key]??0);

  // Commit new state.
  animState[name]=tgt;

  // Play each drive from its current position to the explicit target.
  drives.forEach(({m,key,fracs},i)=>{
    const mDef=Array.isArray(def.members)?defs.find(d=>d.name===m):def;
    if(mDef&&mDef.anim_type==='GEO_TOGGLE'){
      const nodes=(mDef.geo_nodes||[]).map(_findGeoTarget).filter(Boolean);
      const t=tgt>0?1:0;
      nodes.forEach(node=>{
        if(_TRANS.geometry) _geoDissolveNode(node, t>0?1:-1); else node.visible=(t>0);
      });
      return;
    }
    if(mDef&&mDef.anim_type==='GEO_FLICKER'){ _triggerGeoFlicker(mDef); return; }
    const fLen=Math.max(1,fracs.length);
    const mFrom=Math.min(snap[i],fLen-1);
    const mTo=Math.min(tgt,fLen-1);
    animState[key]=mTo;
    _playMemberSegment(key,fracs,mFrom,mTo);
  });

  // Button highlight — same pattern as triggerAnim.
  const _trigBtn=document.querySelector(`.anim-btn[data-anim="${name}"]`);
  if(_trigBtn){
    const liveKeys=drives.map(d=>d.key).filter(k=>_segWatch[k]);
    if(liveKeys.length>0){
      _trigBtn.classList.add('playing');
      _animBtnKeys[name]=new Set(liveKeys);
      liveKeys.forEach(k=>{_segBtnMap[k]=name;});
    }else{
      _trigBtn.classList.remove('playing');
    }
  }

  // Fire state-specific sound if configured.
  if(def.sounds&&def.sounds[tgt]) SFX.playFile(def.sounds[tgt]);
  if(typeof _animActiveUntil!=='undefined') _animActiveUntil=performance.now()+1500;
}

// Snap each control/combo to its configured default_state on first load — no
// animation, just place it at the target pose. Built-ins (Explode/Hover) and
// anything without a default_state stay at rest (state 0) — EXCEPT
// Scene-Animation controls: their glTF default pose is the skin's bind pose
// (usually a T-pose), which is NOT the same as the real pose baked at frame 0
// of their NLA track. Those need an explicit snap to state 0 too, or they sit
// in bind pose until first triggered (visible as a "snap" on first play).
function _applyDefaultAnimStates(){
  const _ctrlByName={};
  ((CFG.animations||{}).controls||[]).forEach(c=>{ _ctrlByName[c.name]=c; });
  function _needsExplicitSnap(def){
    const isSpecial=d=>d && (d.anim_type==='SCENE' || d.anim_type==='GEO_TOGGLE');
    if(Array.isArray(def.members)) return def.members.some(m=>isSpecial(_ctrlByName[m]));
    return isSpecial(def);
  }
  allAnimDefs().forEach(def=>{
    if(def.builtin) return;
    const total=def.states??2;
    const ds=Math.max(0,Math.min(def.default_state||0,total-1));
    if(ds<=0 && !_needsExplicitSnap(def)) return;   // already at rest
    animState[def.name]=ds;
    // Set ping-pong direction so the next click steps sensibly from this pose.
    if((def.playback_mode||'LOOP')==='PINGPONG')
      _pingDir[def.name]=(ds>=total-1)?-1:1;

    let drives;
    if(Array.isArray(def.members)){
      drives=def.members.map(m=>({
        m, key:_resolveAnimKey(m),
        fracs:(def.member_fracs&&def.member_fracs[m])||[0,1]
      }));
    }else{
      drives=[{m:def.name, key:_resolveAnimKey(def.name), fracs:def.state_fracs||[0,1]}];
    }
    drives.forEach(({m,key,fracs})=>{
      // GEO_TOGGLE has no mixer at all — an instant node-visibility snap on
      // load (a fade here would be an odd thing to see on first paint).
      // GEO_FLICKER is a one-shot action; there's nothing to "load into".
      const mDef=Array.isArray(def.members)?_ctrlByName[m]:def;
      if(mDef&&mDef.anim_type==='GEO_TOGGLE'){
        const nodes=(mDef.geo_nodes||[]).map(_findGeoTarget).filter(Boolean);
        nodes.forEach(node=>{ node.visible=(ds>0); });
        return;
      }
      if(mDef&&mDef.anim_type==='GEO_FLICKER') return;
      const fLen=Math.max(1,fracs.length);
      const mTo=Math.min(ds,fLen-1);
      animState[key]=mTo;
      // from==to → _playMemberSegment takes its hold branch: instant snap, no play.
      _playMemberSegment(key,fracs,mTo,mTo);
    });

    const btn=document.querySelector(`.anim-btn[data-anim="${def.name}"]`);
    if(btn){
      btn.classList.toggle('playing',ds!==0);
    }
  });
  if(typeof requestRender==='function') requestRender(300);
}

/**
 * Play animation clip for a part.
 * state 0  = play reversed (close/retract) when single-clip toggle.
 * state >0 = play forward.
 * Mixer is always on root so GLTF node bindings resolve correctly.
 */
// Resolve a control/combo-member name to the key it was actually bound under.
// Combo members are stored as part names (which may contain spaces), while GLB
// clips get sanitized to underscores — so try both forms (and case-insensitive).
function _resolveAnimKey(name){
  if(animMixers[name]) return name;
  const us=name.replace(/ /g,'_'); if(animMixers[us]) return us;
  const sp=name.replace(/_/g,' '); if(animMixers[sp]) return sp;
  const lk=Object.keys(animMixers).find(k=>
    k.toLowerCase()===name.toLowerCase() || k.toLowerCase()===us.toLowerCase());
  return lk||name;
}

/**
 * Play a member's clip SEGMENT between two state positions and hold at the
 * target. `fracs` are normalized 0..1 positions along the single baked clip
 * (procedural: one per state; keyframe / 2-state: [0,1]). Forward or reverse is
 * inferred from the two endpoints. A zero-length segment (clamped member) just
 * holds at the pose. The interior stop is enforced by the _segWatch tick loop,
 * since three's LoopOnce only clamps at a clip's natural end.
 */
function _playMemberSegment(key,fracs,fromIdx,toIdx){
  key=_resolveAnimKey(key);
  const mx=animMixers[key];
  if(!mx){console.warn('[WCE] no mixer for',key);return;}
  const clips=animClips[key]||[];
  if(!clips.length){console.warn('[WCE] no clips for',key);return;}
  const clip=clips[0];
  const dur=clip.duration||1e-6;
  const fA=fracs.length?fracs[Math.min(fromIdx,fracs.length-1)]:0;
  const fB=fracs.length?fracs[Math.min(toIdx,fracs.length-1)]:1;
  const f0=(fA==null?0:fA), f1=(fB==null?1:fB);

  mx.stopAllAction();
  delete _segWatch[key];
  const action=mx.clipAction(clip);
  action.setLoop(THREE.LoopOnce,1);
  action.clampWhenFinished=true;
  action.reset();
  action.enabled=true;
  action.weight=1;

  const timeA=f0*dur, timeB=f1*dur;

  if(Math.abs(f1-f0)<1e-6){
    // Clamped / hold — sit at the target pose, no motion.
    action.time=timeB;
    action.paused=true;
    action.play();
    // Use 1/60 instead of 0 — Three.js requires a non-zero delta in some
    // builds to actually flush animation bindings to the scene nodes.
    // The action is paused so its time stays at timeB; only the binding
    // evaluation step runs.
    mx.update(1/60);
    return;
  }

  // Drive `action.time` ourselves every tick (see _tickMixers) instead of
  // letting Three.js auto-advance it via timeScale/play(). Three.js's
  // LoopOnce handling has a documented edge case with negative timeScale:
  // when time crosses below 0 during reverse playback, its own internal
  // finish/clamp logic snaps time to `duration` (not 0) and pauses there —
  // which is exactly the full-span reverse segment a state-loop wrap
  // produces (e.g. state 3 back to state 0). That raced against our own
  // interior-stop check and could leave a segment sailing past its target.
  // Scrubbing `time` directly sidesteps the whole mechanism: the eased
  // motion still comes from the baked keyframe curve itself, only "what
  // time is it right now" moves from Three.js's play/pause/timeScale
  // machinery to us. `play()` once to activate/register the action with
  // the mixer, then immediately pause it so nothing auto-advances it.
  action.time=timeA;
  action.play();
  action.paused=true;

  const durationMs=Math.abs(timeB-timeA)*1000;
  _segWatch[key]={action,timeA,timeB,durationMs,startMs:performance.now()};
  mx.update(0);
}

/**
 * Build mixers after GLB loads.
 * Match clips to controls by: clip name match OR track target node name match.
 * Mixer always on root — required for GLTF node binding resolution.
 */
function _initAnimMixers(gltf){
  const controls=allAnimDefs();
  // Build a set of all combo-member names so we can avoid accidentally matching
  // a member clip (e.g. "HOOD_VENTS") to a combo whose name it contains ("HOOD").
  const comboMemberNames=new Set();
  (CFG.animations&&CFG.animations.combos||[]).forEach(c=>{
    (c.members||[]).forEach(m=>{comboMemberNames.add(m); comboMemberNames.add(m.replace(/ /g,'_'));});
  });
  console.log('[WCE] GLB clips:',gltf.animations.map(c=>c.name));
  gltf.animations.forEach(clip=>{
    if(clip.name==='Hover'||clip.name==='HoverLoop'){
      if(!_hoverMixer) _hoverMixer=new THREE.AnimationMixer(root);
      if(clip.name==='HoverLoop') _hoverLoopClip=clip; else _hoverRiseClip=clip;
      console.log('[WCE] hover clip',clip.name);
      return;
    }

    // Phase 1: exact name match or ANIM_-prefixed track match (highest confidence).
    let match=controls.find(d=>{
      const s=d.name.replace(/ /g,'_');
      return clip.name===d.name || clip.name===s;
    });

    // Phase 2: track-target match (ANIM_<name> node inside the clip).
    if(!match){
      for(const track of clip.tracks){
        const nodeName=track.name.split('.')[0].replace(/\[\d+\]$/,'');
        match=controls.find(d=>{
          const s=d.name.replace(/ /g,'_');
          return nodeName==='ANIM_'+d.name || nodeName==='ANIM_'+s
              || nodeName===d.name || nodeName===s;
        });
        if(match) break;
      }
    }

    // Phase 3: substring match — but ONLY against standalone controls, never
    // against combos, and never when the clip name is itself a known combo member.
    // This prevents "HOOD_VENTS" matching the combo named "HOOD".
    // Among standalone matches, the LONGEST name wins (most specific) — so a
    // clip like "ANIM_Door_Open" matches control "Door_Open" over "Door",
    // regardless of which one happened to be scanned/created first.
    if(!match && !comboMemberNames.has(clip.name) && !comboMemberNames.has(clip.name.replace(/ /g,'_'))){
      const cnLower=clip.name.toLowerCase();
      let best=null;
      for(const d of controls){
        if(Array.isArray(d.members)) continue;   // skip combos entirely
        const s=d.name.replace(/ /g,'_');
        const hit=cnLower.includes(d.name.toLowerCase()) || cnLower.includes(s.toLowerCase());
        if(hit && (!best || d.name.length>best.name.length)) best=d;
      }
      match=best;
    }

    if(!match){
      // No standalone control def — bind under the clip's own name so combo
      // member fan-out can resolve it via _resolveAnimKey.
      const cn=clip.name;
      if(!animMixers[cn]) animMixers[cn]=new THREE.AnimationMixer(root);
      if(!animClips[cn]) animClips[cn]=[];
      animClips[cn].push(clip);
      console.log('[WCE] clip',cn,'bound by name (no control def — combo member)');
      return;
    }
    const n=match.name;
    if(!animMixers[n]) animMixers[n]=new THREE.AnimationMixer(root);
    if(!animClips[n]) animClips[n]=[];
    animClips[n].push(clip);
    if(clip.name!==n && !animMixers[clip.name]){
      animMixers[clip.name]=animMixers[n];
      animClips[clip.name]=animClips[n];
    }
    console.log('[WCE] clip',clip.name,'-> control',n);
  });
  console.log('[WCE] animMixers keyed:',Object.keys(animMixers));
  console.log('[WCE] animClips keyed:',Object.keys(animClips));
}

function _tickMixers(){
  const dt=_clock.getDelta();
  const now=performance.now();
  // Manually scrub every in-flight segment BEFORE the mixer update below, so
  // the paused actions get bound at the position we just computed (paused
  // actions still get their bindings re-applied on update(), they just don't
  // auto-advance) — see _playMemberSegment for why this is driven manually.
  for(const k in _segWatch){
    const w=_segWatch[k];
    if(!w||!w.action){delete _segWatch[k];continue;}
    const frac=w.durationMs>0?Math.min((now-w.startMs)/w.durationMs,1):1;
    w.action.time=w.timeA+(w.timeB-w.timeA)*frac;
    if(frac>=1){
      w.action.time=w.timeB;
      w.action.paused=true;
      delete _segWatch[k];
      // Clear this key from its definition's live set.
      const _dn=_segBtnMap[k];
      if(_dn&&_animBtnKeys[_dn]){
        _animBtnKeys[_dn].delete(k); delete _segBtnMap[k];
        if(_animBtnKeys[_dn].size===0){
          const _db=document.querySelector(`.anim-btn[data-anim="${_dn}"]`);
          if(_db) _db.classList.remove('playing');
          delete _animBtnKeys[_dn];
        }
      }
    }
  }
  Object.values(animMixers).forEach(mx=>mx.update(dt));
  if(_hoverMixer) _hoverMixer.update(dt);
  _cinematicMixers.forEach(mx=>mx.update(dt));
}

// ── CAMERA SYSTEM ─────────────────────────────────────────────────────────

const camCfg=CFG.cameras||{};
window.camCfg=camCfg;
const FLY_DURATION=camCfg.fly_duration??1.2;
const ZOOM_MIN=camCfg.zoom_min??CFG.camera.zoom_min??2.0;
const ZOOM_MAX=camCfg.zoom_max??CFG.camera.zoom_max??15.0;

let _flyActive=false,_flyPending=false,_flyT=0,_flyDur=FLY_DURATION;
let _flyDestFov=null,_flyFromFov=null,_flyToFov=null;
let _flyDestSkipRadiusClamp=false;
// Distance-lock state for Lock Tumble/Pan cameras. minDistance===maxDistance
// (an exact, zero-width range) isn't a case OrbitControls handles cleanly —
// it was resolving to a consistent, wrong distance instead of the real
// arrival point. A small fixed epsilon gap avoids that degenerate case
// entirely. _camLockedDist is captured ONCE at arrival and never
// recalculated from the live camera position — every frame re-asserts
// against this same fixed value, so the constraint can't be silently
// overridden by anything else, but also can't drift by chasing a moving
// target either.
const _CAM_LOCK_EPS=0.02;
let _camDistanceLocked=false,_camLockedDist=0;
const _camLockedTarget=new THREE.Vector3();
function _applyCamDistanceLock(){
  if(!_camDistanceLocked) return;
  ctrl.minDistance=Math.max(0.01,_camLockedDist-_CAM_LOCK_EPS);
  ctrl.maxDistance=_camLockedDist+_CAM_LOCK_EPS;
}
// Direct, forceful correction — not just relying on min/maxDistance bounds.
// OrbitControls can carry residual internal zoom momentum (the same class
// of thing the existing pan-offset drain elsewhere already handles for
// panning) that continuously pushes toward zooming in further than
// allowed — the bounds correctly clamp it at the edge, but that edge sits
// _CAM_LOCK_EPS away from the actual intended distance, not AT it. This
// recomputes the camera's position to sit at exactly _camLockedDist,
// preserving the current direction (so rotation/look-around still works
// normally). Extracted into its own function so it can run after BOTH
// ctrl.update() calls each frame, not just the second — the very first
// ctrl.update() after arrival was already landing on the wrong distance,
// and that wrong frame was what actually got rendered and seen, since the
// correction previously only ran after the second call.
function _correctCamDistanceLock(){
  if(!_camDistanceLocked) return;
  const _dir=new THREE.Vector3().subVectors(cam.position,ctrl.target);
  const _curDist=_dir.length();
  if(_curDist>1e-6 && Math.abs(_curDist-_camLockedDist)>1e-6){
    _dir.multiplyScalar(_camLockedDist/_curDist);
    cam.position.copy(ctrl.target).add(_dir);
    // Re-sync look direction immediately — OrbitControls' own update() sets
    // camera rotation from position/target internally, before this
    // correction runs. Moving position afterward without this could leave
    // the camera pointed in a very slightly stale direction for exactly one
    // frame, until the NEXT ctrl.update() call corrects it — a possible
    // one-frame visual snap distinct from anything a position/distance
    // check alone would ever catch.
    cam.lookAt(ctrl.target);
  }
}
let _camLockDebugLastLog=0;
let _camLockFrameCounter=999;   // starts high so it doesn't unthrottle-log before any arrival ever happens
function _camLockDebugLog(tag){
  if(!_camDistanceLocked) return;
  const unthrottled=_camLockFrameCounter<60;
  if(!unthrottled){
    const now=performance.now();
    if(now-_camLockDebugLastLog<150) return;
    _camLockDebugLastLog=now;
  } else {
    _camLockFrameCounter++;
  }
  const actualDist=cam.position.distanceTo(ctrl.target);
  const targetDrift=ctrl.target.distanceTo(_camLockedTarget);
  console.log((unthrottled?'[CamLock #'+_camLockFrameCounter+'] ':'[CamLock] ')+tag
    +' | actualDist='+actualDist.toFixed(5)
    +' | lockedDist='+_camLockedDist.toFixed(5)
    +' | minDistance='+ctrl.minDistance.toFixed(5)
    +' | maxDistance='+ctrl.maxDistance.toFixed(5)
    +' | outOfBounds='+(actualDist<ctrl.minDistance-1e-6||actualDist>ctrl.maxDistance+1e-6)
    +' | targetDrift='+targetDrift.toFixed(5)
    +' | target=['+ctrl.target.x.toFixed(4)+','+ctrl.target.y.toFixed(4)+','+ctrl.target.z.toFixed(4)+']'
    +' | lockedTarget=['+_camLockedTarget.x.toFixed(4)+','+_camLockedTarget.y.toFixed(4)+','+_camLockedTarget.z.toFixed(4)+']'
    +' | camPos=['+cam.position.x.toFixed(4)+','+cam.position.y.toFixed(4)+','+cam.position.z.toFixed(4)+']'
    +' | camQuat=['+cam.quaternion.x.toFixed(5)+','+cam.quaternion.y.toFixed(5)+','+cam.quaternion.z.toFixed(5)+','+cam.quaternion.w.toFixed(5)+']'
    +' | camUp=['+cam.up.x.toFixed(4)+','+cam.up.y.toFixed(4)+','+cam.up.z.toFixed(4)+']'
    +' | camFov='+cam.fov.toFixed(4)+' | flyToFov='+(_flyToFov!=null?_flyToFov.toFixed(4):'null'));
}
const _flyFromPos=new THREE.Vector3(),_flyToPos=new THREE.Vector3();
const _flyFromTgt=new THREE.Vector3(),_flyToTgt=new THREE.Vector3();
const _flyDestPos=new THREE.Vector3(),_flyDestTgt=new THREE.Vector3();
// Last known-good camera state — lets the render loop self-heal if
// OrbitControls' internal math ever produces an Infinity/NaN position
// (e.g. from an orbit radius too close to zero), rather than the camera
// staying permanently broken with no way to recover on its own.
const _camLastGoodPos=new THREE.Vector3(),_camLastGoodTarget=new THREE.Vector3();
let _camHasGoodState=false;
let _flyDestSound=null;
let _flyDestLockTumblePan=false;

let _turntableActive=false,_turntableAngle=0;
const _turntableSpeed=0.003;

let _cinematicPlaying=false,_cinematicIdx=0;
const _cinematicMixers=[],_cinematicClips=[],_cinematicNodes=[];
const _savedTarget=new THREE.Vector3(0,0.8,0);

function flyToCamera(camName){
  const def=(camCfg.static||[]).find(c=>c.name===camName);
  if(!def) return;

  const destPos=new THREE.Vector3(...def.position);
  const destTgt=def.target ? new THREE.Vector3(def.target[0],def.target[1],def.target[2]) :
    destPos.clone().addScaledVector(new THREE.Vector3().subVectors(destPos,cam.position).normalize(),-3.0);
  // null when this camera has no focal_length_mm/sensor_width_mm exported
  // (e.g. an older export, or a non-standard camera) — falling back to
  // leaving FOV exactly as it already is, rather than guessing at one.
  const destFov=_computeVFov(def.focal_length_mm, def.sensor_width_mm);
  _activeCamFocal=def.focal_length_mm||null;
  _activeCamSensor=def.sensor_width_mm||null;
  // Clear any previous camera's distance lock immediately — otherwise the
  // per-frame re-assertion below would keep enforcing the OLD camera's
  // locked distance throughout this entire flight, since arrival (which
  // sets the new lock state) hasn't happened yet.
  _camDistanceLocked=false;
  ctrl.enableZoom=true;

  if(def.transition==='dip'){
    _stopTurntable(); _stopCinematic();
    document.querySelectorAll('.cam-btn').forEach(b=>b.classList.toggle('active',b.dataset.cam===camName));
    document.querySelector('.tt-btn')?.classList.remove('active');
    _flyActive=false; _flyPending=false;
    _dip(()=>{
      if(def.sound) SFX.playFile(def.sound);
      cam.position.copy(destPos);
      ctrl.target.copy(destTgt);
      if(destFov!=null){ cam.fov=destFov; cam.updateProjectionMatrix(); }
      cam.lookAt(ctrl.target);
      // Bounds must be set BEFORE ctrl.update() below, not after — otherwise
      // update() clamps this new position against the OLD (stale) bounds
      // first, undoing the jump before there's ever a chance to widen them.
      if(!!def.lock_tumble_pan){
        _camDistanceLocked=true;
        _camLockFrameCounter=0;
        _camLockedDist=destPos.distanceTo(destTgt);
        _camLockedTarget.copy(destTgt);
        _applyCamDistanceLock();
        ctrl.enableZoom=false;
      } else {
        _camDistanceLocked=false;
        ctrl.minDistance=ZOOM_MIN; ctrl.maxDistance=ZOOM_MAX;
        ctrl.enableZoom=true;
      }
      // Drain damping residuals — see the identical comment in _tickFly()'s
      // arrival block. Matters just as much for an instant jump as a smooth
      // fly: OrbitControls' own internal damped state was still tracking
      // wherever the camera was before this jump.
      const _dWas=ctrl.enableDamping; ctrl.enableDamping=false;
      for(let _i=0;_i<20;_i++) ctrl.update();
      ctrl.enableDamping=_dWas;
    });
    return;
  }

  if(def.sound) SFX.playFile(def.sound);
  _stopTurntable(); _stopCinematic();

  _flyDestPos.copy(destPos);
  _flyDestTgt.copy(destTgt);
  _flyDestFov=destFov;
  _flyDestSound=def.sound||null;
  // Lock Tumble/Pan: force the orbit radius to (effectively) zero, so
  // OrbitControls' own rotation still works as a look-around from this exact
  // spot, but dragging/zooming can never move the camera away from it or pan
  // the pivot elsewhere. A normal camera restores the real zoom range.
  _flyDestLockTumblePan=!!def.lock_tumble_pan;
  // Unclamped destination distance is scoped to locked cameras only. A
  // locked camera ends up with minDistance===maxDistance — an exact single
  // value, not a range — which structurally can't have a "snap to the
  // nearest edge" problem at all. A non-locked camera still has a real
  // range to move within, where OrbitControls' own internal spherical state
  // can end up disagreeing with the exact arrival distance regardless of
  // how wide that range is set — so it reverts to the original, clamped-to-
  // ZOOM_MIN/MAX behavior instead, rather than trade a "lands close, then
  // immediately snaps back out" glitch for the plain "lands a bit farther
  // back than configured" one this was meant to fix.
  _flyDestSkipRadiusClamp=_flyDestLockTumblePan;
  _flyT=0; _flyDur=FLY_DURATION; _flyPending=true; _flyActive=false;
  document.querySelectorAll('.cam-btn').forEach(b=>b.classList.toggle('active',b.dataset.cam===camName));
  document.querySelector('.tt-btn')?.classList.remove('active');
}

function _tickFly(){
  if(!_flyActive) return;
  _flyT+=1/60/_flyDur;
  const _arriving=_flyT>=1;
  if(_arriving) _flyT=1;

  // Position/target/FOV are set to their (possibly final, t=1) values FIRST,
  // before any arrival/lock logic below runs — not after. This ordering
  // matters: _camLockedDist and the damping-drain loop further down both
  // need the camera's REAL final position, not wherever it was on the
  // PREVIOUS frame. Setting position after arrival logic (the original,
  // buggy order) meant the lock distance got computed from stale data, and
  // OrbitControls' internal spherical state got synced via 20 drain calls
  // against that same stale position — leaving it silently disagreeing
  // with the correct position this code would then overwrite it with a
  // moment later. That mismatch was invisible to any logging that only
  // reads the public position/target values, since those get forcibly
  // corrected — but OrbitControls' own hidden internal state stayed wrong,
  // and would visibly fight that correction on a later frame. This exact
  // ordering bug is also why Dip to Black never showed this: that path
  // already sets position directly BEFORE draining damping, not after.
  const t=_flyT*_flyT*(3-2*_flyT);
  const tgt=new THREE.Vector3().lerpVectors(_flyFromTgt,_flyToTgt,t);
  const fromDir=new THREE.Vector3().subVectors(_flyFromPos,_flyFromTgt).normalize();
  const toDir=new THREE.Vector3().subVectors(_flyToPos,_flyToTgt).normalize();
  const fromR=_flyFromPos.distanceTo(_flyFromTgt);
  // Only clamp the DESTINATION radius — never clamp fromR.
  // If fromR < ZOOM_MIN (e.g. startup camera projected close), clamping it
  // reconstructs a different starting position and snaps the camera upward.
  // The clamp itself is skipped entirely for a static camera fly — its
  // distance was deliberately chosen by the artist, not something that
  // should be forced to fit inside the general free-zoom range.
  const rawToR=_flyToPos.distanceTo(_flyToTgt);
  const toR=_flyDestSkipRadiusClamp ? rawToR : Math.min(Math.max(rawToR,ZOOM_MIN),ZOOM_MAX);
  const radius=THREE.MathUtils.lerp(fromR,toR,t);
  const dir=new THREE.Vector3().lerpVectors(fromDir,toDir,t).normalize();
  cam.position.copy(tgt).addScaledVector(dir,radius);
  ctrl.target.copy(tgt);
  // ctrl.target = _flyToTgt on arrival, which is already the correct orbit
  // pivot (projected from Python at export — no runtime recalc needed).
  if(_flyToFov!=null){
    cam.fov=THREE.MathUtils.lerp(_flyFromFov!=null?_flyFromFov:_flyToFov,_flyToFov,t);
