    cam.updateProjectionMatrix();
  }

  if(_arriving){
    _flyActive=false;
    document.querySelectorAll('.cam-btn').forEach(b=>b.classList.remove('active'));
    // Locked: freeze the orbit radius at whatever distance this camera
    // actually arrived at — OrbitControls' own rotation still works as a
    // look-around from this exact spot, but dragging/zooming can never move
    // the camera away from it. A hardcoded distance here (rather than the
    // real arrival distance) was the actual cause of a visible snap right at
    // arrival: OrbitControls immediately re-clamps to whatever min/max
    // distance was just set, and if that didn't match where the camera
    // really was, the very next control update yanked it to match — which
    // looked exactly like a sudden FOV/zoom change, even though FOV itself
    // never moved. A normal camera restores the real zoom range exactly as
    // configured.
    if(_flyDestLockTumblePan){
      _camDistanceLocked=true;
      _camLockFrameCounter=0;
      _camLockedDist=cam.position.distanceTo(ctrl.target);
      _camLockedTarget.copy(ctrl.target);
      _applyCamDistanceLock();
      ctrl.enableZoom=false;
    } else {
      _camDistanceLocked=false;
      ctrl.minDistance=ZOOM_MIN; ctrl.maxDistance=ZOOM_MAX;
      ctrl.enableZoom=true;
    }
    // Drain damping residuals — _tickFly() set position/target directly every
    // frame throughout the fly, which can leave OrbitControls' own internal
    // damped state out of sync with where the camera actually ended up. Once
    // direct position-setting stops here, plain ctrl.update() calls (with
    // damping on) would otherwise visibly correct/settle toward whatever
    // stale internal state accumulated — exactly the drift/snap this fixes.
    {
      const _dWas=ctrl.enableDamping; ctrl.enableDamping=false;
      for(let _i=0;_i<20;_i++) ctrl.update();
      ctrl.enableDamping=_dWas;
    }
  }
}

function _startTurntable(){
  _flyActive=false; _stopCinematic(); _turntableActive=true;
  document.querySelector('.tt-btn')?.classList.add('active');
  document.querySelectorAll('.cam-btn').forEach(b=>b.classList.remove('active'));
}
function _stopTurntable(){
  _turntableActive=false;
  document.querySelector('.tt-btn')?.classList.remove('active');
}
function _tickTurntable(){
  if(!_turntableActive) return;
  _turntableAngle+=_turntableSpeed;
  const r=cam.position.distanceTo(ctrl.target);
  cam.position.x=ctrl.target.x+Math.sin(_turntableAngle)*r;
  cam.position.z=ctrl.target.z+Math.cos(_turntableAngle)*r;
}

const _dipEl=()=>document.getElementById('dip');

/**
 * Dip to black: fade out → call fn → fade in.
 * dipDur = ms for each half (fade-out + fade-in).
 */
function _dip(fn, dipDur=350){
  const el=_dipEl(); if(!el){fn();return;}
  el.style.transition=`opacity ${dipDur}ms ease`;
  el.style.opacity='1';
  setTimeout(()=>{
    fn();
    el.style.opacity='0';
  }, dipDur+20);  // slight buffer so the cut lands during full black
}

function _startCinematic(){
  if(!_cinematicClips.length) return;
  
  const cin = camCfg.cinematic || {};
  if(cin.sound) SFX.playFile(cin.sound);
  
  _savedTarget.copy(ctrl.target);
  _stopTurntable(); _flyActive=false; _cinematicPlaying=true; _cinematicIdx=0;
  _playCinematicClip(0);
  const btn=document.querySelector('.cin-btn');
  if(btn){btn.classList.add('playing');btn.querySelector('span').textContent='STOP';}
}
function _stopCinematic(){
  if (!_cinematicPlaying) return;

  _cinematicPlaying=false;
  _cinematicMixers.forEach(mx=>mx.stopAllAction());
  // Fade back up if we're mid-dip
  const el=_dipEl();if(el) el.style.opacity='0';
  const btn=document.querySelector('.cin-btn');
  if(btn){btn.classList.remove('playing');btn.querySelector('span').textContent='PLAY CINEMATIC';}
  ctrl.target.copy(_savedTarget);
}
function _poseAtCinematicStart(idx){
  // Snap the RENDER camera to the opening frame (t=0) of cinematic camera `idx`.
  const node=_cinematicNodes[idx],clip=_cinematicClips[idx],mx=_cinematicMixers[idx];
  if(!node||!clip||!mx) return false;
  mx.stopAllAction();
  const action=mx.clipAction(clip);
  action.reset(); action.play(); action.paused=true; action.time=0;
  mx.update(0);                       // evaluate the node's transform at frame 0
  node.updateWorldMatrix(true,false);
  node.getWorldPosition(cam.position);
  node.getWorldQuaternion(cam.quaternion);
  const fw=new THREE.Vector3(0,0,-1).applyQuaternion(cam.quaternion);
  ctrl.target.copy(cam.position).add(fw.multiplyScalar(5));
  cam.updateMatrixWorld();
  return true;
}

function _playCinematicClip(idx){
  if(idx>=_cinematicClips.length){
    // End of sequence — dip to black, snap to the first frame of the first
    // camera, then stop so orbit controls resume from that opening pose.
    _dip(()=>{ _poseAtCinematicStart(0); _stopCinematic(); });
    return;
  }
  _cinematicMixers.forEach(mx=>mx.stopAllAction());
  const clip=_cinematicClips[idx];
  const mx=_cinematicMixers[idx]||_cinematicMixers[0];
  if(!mx||!clip){_stopCinematic();return;}

  // Dip to black, then switch camera and play
  _dip(()=>{
    const action=mx.clipAction(clip);
    action.setLoop(THREE.LoopOnce,1);
    action.clampWhenFinished=true;
    action.reset().play();
    mx.addEventListener('finished',function onF(){
      mx.removeEventListener('finished',onF);
      _playCinematicClip(++_cinematicIdx);
    });
  });
}

/**
 * Given a clip, return the node in `root` that it animates a transform on.
 * The render camera follows THIS node, so it must be the node the tracks bind to.
 */
function _resolveTrackNode(clip){
  if(!root||!clip) return null;
  for(const tr of clip.tracks){
    const prop=tr.name.split('.').pop();
    if(prop!=='position'&&prop!=='quaternion'&&prop!=='rotation'&&prop!=='scale') continue;
    const nodeName=tr.name.split('.')[0].replace(/\[\d+\]$/,'');
    const safe=nodeName.replace(/ /g,'_');
    let found=null;
    root.traverse(o=>{ if(!found&&(o.name===nodeName||o.name===safe)) found=o; });
    if(found) return found;
  }
  return null;
}

function _initCinematicMixers(gltf){
  const seq=(camCfg.cinematic||{}).sequence||[];
  const loaded=[];
  seq.forEach((entry)=>{
    const safeName = entry.name.replace(/ /g, '_');

    // 1. Resolve the actual camera node in the loaded scene by name.
    let camNode = null;
    if(root) root.traverse(o=>{ if(!camNode&&(o.name===entry.name || o.name===safeName)) camNode=o; });

    // 2. Prefer the clip that actually animates this camera node (track-target
    //    match). Loose name 'includes' matching can wrongly grab a part clip.
    let clip=null;
    if(camNode){
      clip=gltf.animations.find(a=>a.tracks.some(t=>{
        const nn=t.name.split('.')[0].replace(/\[\d+\]$/,'');
        return nn===camNode.name||nn===entry.name||nn===safeName;
      }));
    }
    // 3. Fallbacks: track-target by name, then clip-name match.
    if(!clip){
      clip=gltf.animations.find(a=>a.tracks.some(t=>{
        const nn=t.name.split('.')[0].replace(/\[\d+\]$/,'');
        return nn===entry.name||nn===safeName;
      }));
    }
    if(!clip){
      clip=gltf.animations.find(a=>
        a.name===entry.name||a.name===safeName||
        a.name.toLowerCase().includes(entry.name.toLowerCase())||
        entry.name.toLowerCase().includes(a.name.toLowerCase())
      );
    }
    if(!clip){
      console.warn('[WCE] cinematic: no clip found for camera',entry.name);
      return;
    }

    // 4. If name lookup failed, derive the node straight from the matched clip's
    //    transform tracks. Getting this wrong (null node) is what made the
    //    sequence merely dip to black instead of flying the camera.
    if(!camNode) camNode=_resolveTrackNode(clip);
    if(!camNode) console.warn('[WCE] cinematic: camera node not found for',entry.name,'— camera will not move');

    _cinematicMixers.push(new THREE.AnimationMixer(root));
    _cinematicClips.push(clip);
    _cinematicNodes.push(camNode);
    loaded.push(entry.name+' ('+clip.name+(camNode?(' → '+camNode.name):' [NO NODE]')+')');
  });
  console.log('[WCE] cinematic clips loaded:',loaded);
}

// ── HOTSPOT SYSTEM ───────────────────────────────────────────────────────

const hotspots=[];
// Flat list of occludable meshes, built once when the model loads (see the
// root.traverse() in the gltf load callback). Geo-subset switching only
// toggles .visible on these same objects — they're never added/removed from
// the scene graph — so a one-time flat list avoids re-walking the full
// hierarchy on every single occlusion raycast (the costly part once there
// are several hotspots, since each one raycasts independently).
let _occluderMeshes=[];

function _rgbCss(c){
  // c = [r,g,b] floats 0-1  →  css rgb string
  if(!c||c.length<3) return 'var(--hot)';
  return `rgb(${Math.round(c[0]*255)},${Math.round(c[1]*255)},${Math.round(c[2]*255)})`;
}

function _makeHotspotEl(color, scale){
  const css=_rgbCss(color);
  const mult = (scale || 0.25) / 0.25; 
  const el=document.createElement('div');
  el.className='hs-sprite clickable';
  el.style.transform = `translate(-50%,-50%) scale(${mult})`;
  el.innerHTML=`<div class="hs-ring" style="border-color:${css};box-shadow:0 0 8px ${css}44"></div>`+
               `<div class="hs-dot"  style="background:${css};box-shadow:0 0 6px ${css}"></div>`;
  return el;
}

function _hsGlowPx(scale){
  // On-screen glow radius (px): ring is 44px wide, sprite scales by scale/0.25,
  // pulse expands to ~1.4x and the box-shadow adds a little — sample that area.
  const mult=(scale||0.25)/0.25;
  return 24*mult;
}

function _initHotspots(){
  const layer=document.getElementById('hotspot-layer');
  allAnimDefs().forEach(def=>{
    if(def.trigger==='hotspot'&&def.hotspot_position&&!def.hidden_ui){
      const pos=def.hotspot_position;
      const el=_makeHotspotEl(def.hotspot_color, def.hotspot_scale);
      layer.appendChild(el);
      hotspots.push({name:def.name,pos:new THREE.Vector3(pos[0],pos[1],pos[2]),el,px:_hsGlowPx(def.hotspot_scale),op:null});
      el.addEventListener('pointerdown',(e)=>{ e.stopPropagation(); triggerAnim(def.name); });
    }
    // Extra/additional hotspot triggers — independent of this control's own
    // main trigger type, each one fires the same animation on click and gets
    // the same realtime occlusion/scale ticking as the main hotspots.
    (def.extra_hotspots||[]).forEach((xh,xi)=>{
      if(!xh||!xh.position||def.hidden_ui) return;
      const pos=xh.position;
      const el=_makeHotspotEl(xh.color, xh.scale);
      layer.appendChild(el);
      hotspots.push({name:'__extra_'+def.name+'_'+xi,pos:new THREE.Vector3(pos[0],pos[1],pos[2]),el,px:_hsGlowPx(xh.scale),op:null});
      el.addEventListener('pointerdown',(e)=>{ e.stopPropagation(); triggerAnim(def.name); });
    });
  });
  // Sequence hotspots
  ((CFG.animations||{}).sequences||[]).forEach(seq=>{   
    if(seq.trigger!=='hotspot'||!seq.hotspot_position) return;
    const pos=seq.hotspot_position;
    const el=_makeHotspotEl(seq.hotspot_color||[1,0.42,0.21], seq.hotspot_scale??0.35);
    layer.appendChild(el);
    hotspots.push({name:'__seq_'+seq.name,pos:new THREE.Vector3(pos[0],pos[1],pos[2]),el,px:_hsGlowPx(seq.hotspot_scale??0.35),op:null});
    el.addEventListener('pointerdown',(e)=>{ e.stopPropagation(); executeSequence(seq.name); });
  });
  // Cinematic hotspot
  const cin=camCfg.cinematic||{};
  if(cin.trigger==='hotspot'&&cin.hotspot_position){
    const pos=cin.hotspot_position;
    const el=_makeHotspotEl(cin.hotspot_color, cin.hotspot_scale);
    layer.appendChild(el);
    hotspots.push({name:'__cin__',pos:new THREE.Vector3(pos[0],pos[1],pos[2]),el,px:_hsGlowPx(cin.hotspot_scale),op:null});
    el.addEventListener('pointerdown',(e)=>{ e.stopPropagation(); _cinematicPlaying?_stopCinematic():_startCinematic(); });
  }
}

// ── 3D Annotations — purely informational markers (text or looping video on
// click), never trigger an animation/state change. Reuses the hotspot array's
// existing projection/occlusion tracking in _tickHotspots (proven, already
// optimized for many markers), just with its own quiet-until-hover visual
// style instead of the constant hs-pulse animation, and its own click
// behavior (show a popup) instead of triggering an animation.
const _annotationDefs=[];
let _annotLeaveTimer=null;
function _makeAnnotationEl(a){
  const el=document.createElement('div');
  el.className='annot-marker';
  const px=Math.max(8,(a.size||1)*24);
  el.style.width=px+'px'; el.style.height=px+'px';
  el.style.transform='translate(-50%,-50%)';
  const s=CFG.annotation_popup_style||{};
  const col=s.markerColor||'#c8a96e';
  const glow=s.markerGlow!=null?s.markerGlow:6;
  const bw=s.markerBorderWidth!=null?s.markerBorderWidth:2;
  el.style.background=col;
  el.style.boxShadow=glow>0?('0 0 '+glow+'px '+col):'none';
  el.style.borderWidth=bw+'px';
  el.style.opacity=(s.markerOpacity!=null?s.markerOpacity:100)/100;
  return el;
}
function _closeAnnotationPopup(){
  const p=document.getElementById('annot-popup-active');
  if(p) p.remove();
}
function _showAnnotationPopup(a, el){
  _closeAnnotationPopup();
  const pop=document.createElement('div');
  pop.className='annot-popup'; pop.id='annot-popup-active';
  pop.dataset.forAnnotation=a.name;

  const s=CFG.annotation_popup_style||{};
  const bgOpacity=(s.bgOpacity!=null?s.bgOpacity:92)/100;
  const bgHex=s.bgColor||'#0a0a0c';
  const bgRgb=[1,3,5].map(i=>parseInt(bgHex.substr(i,2),16)||0);
  pop.style.background='rgba('+bgRgb[0]+','+bgRgb[1]+','+bgRgb[2]+','+bgOpacity+')';
  pop.style.borderColor=s.borderColor||'#c8a96e';
  pop.style.borderWidth=(s.borderWidth!=null?s.borderWidth:1)+'px';
  pop.style.borderStyle='solid';
  pop.style.borderRadius=(s.radius!=null?s.radius:6)+'px';
  pop.style.color=s.textColor||'#ffffff';
  pop.style.fontSize=(s.textFontSize!=null?s.textFontSize:14)+'px';
  pop.style.cursor='default';   // avoid the text-select cursor over plain text content

  const canvasEl=document.getElementById('c');
  const canvasRect=canvasEl?canvasEl.getBoundingClientRect():{left:0,top:0,width:innerWidth,height:innerHeight};

  let inner='<div class="annot-popup-close">✕</div>';
  if(a.show_video && a.video){
    // Sized purely from the Designer's own setting — matches the mock
    // preview exactly, no 3D-object dimension involved at all anymore.
    const vw=(s.videoWidthPct!=null?s.videoWidthPct:26)/100*canvasRect.width;
    pop.style.width=vw+'px';
    pop.style.maxWidth='none';
    inner+='<video src="'+a.video+'" autoplay loop muted playsinline></video>';
  } else {
    pop.style.width='';
    pop.style.maxWidth='320px';
    const fs=(s.textFontSize!=null?s.textFontSize:14);
    inner+='<div style="font-size:'+fs+'px">'+(a.text||'').replace(/</g,'&lt;')+'</div>';
  }
  pop.innerHTML=inner;
  document.body.appendChild(pop);

  // Positioned at the marker's own projected screen location.
  const pw=pop.offsetWidth, ph=pop.offsetHeight;
  let left, top;
  if(a.position){
    const v=new THREE.Vector3(a.position[0],a.position[1],a.position[2]).project(cam);
    const sx=canvasRect.left+(v.x*0.5+0.5)*canvasRect.width;
    const sy=canvasRect.top+(-v.y*0.5+0.5)*canvasRect.height;
    left=sx-pw/2; top=sy-ph/2;
  } else {
    // No position resolved (deleted?) — fall back to centered on the canvas.
    left=canvasRect.left+canvasRect.width/2-pw/2;
    top=canvasRect.top+canvasRect.height/2-ph/2;
  }
  left=Math.max(8,Math.min(left,innerWidth-pw-8));
  top=Math.max(8,Math.min(top,innerHeight-ph-8));
  pop.style.left=left+'px'; pop.style.top=top+'px';
  pop.querySelector('.annot-popup-close').addEventListener('click', _closeAnnotationPopup);
  // The popup is a separate element (appended to document.body, not a
  // child of the marker), but it visually sits right on top of it — so it
  // needs to participate in the exact same hover state, not just the
  // marker. Otherwise moving from the marker onto the popup's own text
  // falls into the gap between the two, closes the popup, reveals the
  // marker again underneath, and reopens it — the flicker this was about.
  pop.addEventListener('pointerenter',()=>{
    if(_annotLeaveTimer){ clearTimeout(_annotLeaveTimer); _annotLeaveTimer=null; }
  });
  pop.addEventListener('pointerleave',()=>{
    if(_annotLeaveTimer) clearTimeout(_annotLeaveTimer);
    _annotLeaveTimer=setTimeout(()=>{ _annotLeaveTimer=null; _closeAnnotationPopup(); }, 120);
  });
}
function _stateMatchesSubset(current, subsetState){
  return Object.entries(subsetState||{}).every(([k,v])=>current[k]===v);
}
function _annotationConditionMet(a){
  if(!a.link_type || a.link_type==='none') return true;
  if(a.link_type==='mat_subset' || a.link_type==='global_set'){
    const pool=(CFG.mat_subsets||[]).concat(CFG.global_mat_sets||[]);
    const s=pool.find(x=>x.name===a.link_target);
    return s ? _stateMatchesSubset(matSt, s.state) : false;
  }
  if(a.link_type==='geo_subset'){
    const s=(CFG.geometry_subsets||[]).find(x=>x.name===a.link_target);
    if(!s || !s.state) return false;
    return Object.entries(s.state).every(([parent,child])=>!!geoSt[child.replace(/ /g,'_')]);
  }
  return true;
}
function _updateAnnotationVisibility(){
  _annotationDefs.forEach(({def,hs})=>{
    const visible=_annotationConditionMet(def);
    hs.hidden=!visible;
    if(!visible){ hs.el.style.display='none'; hs.op=0; }
  });
}
function _initAnnotations(){
  const layer=document.getElementById('hotspot-layer');
  if(!layer) return;
  (CFG.annotations||[]).forEach(a=>{
    const pos=a.position;
    const el=_makeAnnotationEl(a);
    layer.appendChild(el);
    const hs={name:'__annot_'+a.name,pos:new THREE.Vector3(pos[0],pos[1],pos[2]),el,px:Math.max(8,(a.size||1)*24),op:null,isAnnotation:true};
    hotspots.push(hs);
    _annotationDefs.push({def:a,hs});
    // Real hover devices (mouse/trackpad) keep the existing hover behavior.
    // Touch devices have no meaningful "hover" state at all — pointerenter/
    // pointerleave behave inconsistently across mobile browsers (may need a
    // tap-and-hold, may never fire leave until tapping elsewhere) — so those
    // get an explicit tap-to-toggle instead: tap opens it, tap the same
    // marker again closes it, tap anywhere else also closes it.
    const _hasHover = window.matchMedia('(hover: hover)').matches;
    if(_hasHover){
      // Debounced leave: the marker's screen position gets recalculated every
      // tick even while fully visible and the camera is nominally still (sub-
      // pixel floating-point/damping jitter is normal) — if the pointer sits
      // right at the marker's edge, that jitter alone can trigger enter/leave
      // repeatedly in the same frame or two, which without this reads as the
      // popup flickering open and shut. A short grace period, cancelled if the
      // pointer re-enters before it fires, absorbs that without adding any
      // perceptible delay to a genuine, deliberate leave. Shared at module
      // scope (_annotLeaveTimer, declared once above) rather than per-marker,
      // so the popup itself (a separate element, appended to document.body,
      // not a child of the marker) can also participate in the same hover
      // state — hovering the popup's own text was otherwise falling into the
      // gap between the two elements, causing the marker's leave/enter to
      // fire back-to-back and the cursor to flicker between text-select and
      // pointer as the popup rapidly closed and reopened underneath it.
      el.addEventListener('pointerenter',()=>{
        if(_annotLeaveTimer){ clearTimeout(_annotLeaveTimer); _annotLeaveTimer=null; }
        _showAnnotationPopup(a, el);
      });
      el.addEventListener('pointerleave',()=>{
        if(_annotLeaveTimer) clearTimeout(_annotLeaveTimer);
        _annotLeaveTimer=setTimeout(()=>{ _annotLeaveTimer=null; _closeAnnotationPopup(); }, 120);
      });
    } else {
      el.addEventListener('click',(e)=>{
        e.stopPropagation();
        const existing=document.getElementById('annot-popup-active');
        const alreadyOpenForThis = existing && existing.dataset.forAnnotation===a.name;
        if(alreadyOpenForThis){
          _closeAnnotationPopup();
        } else {
          _showAnnotationPopup(a, el);
        }
      });
    }
  });
  _updateAnnotationVisibility();
  if(!window._wceAnnotOutsideTapAttached){
    window._wceAnnotOutsideTapAttached=true;
    document.addEventListener('click',(e)=>{
      const pop=document.getElementById('annot-popup-active');
      if(pop && !pop.contains(e.target) && !e.target.closest('.annot-marker')) _closeAnnotationPopup();
    }, true);
  }
}

// Dedicated raycaster for occlusion so we never clobber the pointer raycaster.
const _hsRay=new THREE.Raycaster();
// Metres of slack so the very surface a hotspot sits ON doesn't occlude it,
// while geometry farther in front (e.g. the far side of the car body) does.
const HOTSPOT_OCCLUSION_BIAS=0.12;
const _hsDir=new THREE.Vector3();
const _hsTmpV=new THREE.Vector3(); // pre-alloc: reused every frame instead of .clone()
// Centre + 2 samples (was a 9-point ring). With the temporal smoothing below
// and the ~12 Hz throttle, this looks identical but costs a fraction — each
// sample is a full-model raycast, so fewer samples + lower rate is the fix for
// the orbit-time stutter.
const _HS_SAMPLES=[[0,0]];   // centre only — temporal smoothing covers the rest
const _HS_NDC={x:0,y:0};
const _HS_OCC_INTERVAL_MS=100;  // recompute occlusion at ~10 Hz, not per frame
// Skip the occlusion raycast entirely while the camera is still — a directional
// view's occlusion only changes when the camera moves. This is the big win:
// during a static hold (and with render-on-demand) there are zero raycasts.
let _hsCamX=1e9,_hsCamY=1e9,_hsCamZ=1e9,_hsCamMoved=true;
let _hsFrame=0;

function _hsSampleOccluded(nx,ny,distToHs){
  if(!root||!_occluderMeshes.length) return false;
  _HS_NDC.x=nx; _HS_NDC.y=ny;
  _hsRay.setFromCamera(_HS_NDC,cam);
  _hsRay.far=Math.max(distToHs-HOTSPOT_OCCLUSION_BIAS,0.0001);
  const hits=_hsRay.intersectObjects(_occluderMeshes,false);
  for(const h of hits){
    if(!h.object||h.object.visible===false) continue;
    if(h.object.userData && h.object.userData.wce_no_occlude) continue;
    if(h.distance<distToHs-HOTSPOT_OCCLUSION_BIAS) return true;
  }
  return false;
}

function _tickHotspots(){
  _hsFrame++;
  const W=innerWidth,H=innerHeight;
  // Detect camera movement once per tick (position is enough for occlusion).
  const cp=cam.position;
  _hsCamMoved=(Math.abs(cp.x-_hsCamX)+Math.abs(cp.y-_hsCamY)+Math.abs(cp.z-_hsCamZ))>1e-4;
  if(_hsCamMoved){ _hsCamX=cp.x; _hsCamY=cp.y; _hsCamZ=cp.z; }
  hotspots.forEach((hs,idx)=>{
    if(hs.hidden){ hs.el.style.display='none'; return; }
    // If already invisible and camera hasn't moved, nothing can have changed.
    // Skip project(), DOM write, and raycast entirely — zero cost per frame.
    if(hs.op!=null && hs.op<0.012 && !_hsCamMoved) return;
    if(hs._offScreen && (_hsFrame%3)!==(idx%3)){
      if(hs.op>0.012){hs.op*=0.8; hs.el.style.opacity=hs.op.toFixed(3); if(hs.op<0.012) hs.el.style.display='none';}
      return;
    }
    _hsTmpV.copy(hs.pos).project(cam);
    // Camera not valid yet on this particular tick (e.g. mid-setup during the
    // initial fly-in) — leave this marker's state completely untouched and
    // retry next tick, rather than recording a result derived from NaN.
    if(!isFinite(_hsTmpV.x)||!isFinite(_hsTmpV.y)||!isFinite(_hsTmpV.z)) return;
    let target;

    // Cheap early-out: behind the camera, or well outside the viewport
    // margin — skip the occlusion raycast entirely. With several hotspots
    // scattered around a model, most are off-screen at any given camera
    // angle, so this is the biggest win as the hotspot count grows.
    if(_hsTmpV.z>1||_hsTmpV.x<-1.3||_hsTmpV.x>1.3||_hsTmpV.y<-1.3||_hsTmpV.y>1.3){
      hs._offScreen=true; target=0;
    } else {
      hs._offScreen=false;
      const sx=(_hsTmpV.x*0.5+0.5)*W, sy=(-_hsTmpV.y*0.5+0.5)*H;
      hs.el.style.left=sx+'px';
      hs.el.style.top =sy+'px';

      // Recompute occlusion at ~10 Hz, and only while the camera is moving —
      // a still camera can't change occlusion, so we reuse the last result.
      // Stagger is spread across the full interval window relative to the
      // CURRENT hotspot count, so total raycasts/sec stays roughly constant
      // however many hotspots exist, instead of growing with the count.
      // Annotation markers go through this exact same occlusion check as
      // hotspots — hidden behind geometry the same way.
      const _nowMs=performance.now();
      const _stagger=idx*(_HS_OCC_INTERVAL_MS/Math.max(1,hotspots.length));
      if(hs.vis==null || (_hsCamMoved && (_nowMs-(hs._lastOcc||0))>=_HS_OCC_INTERVAL_MS)){
        hs._lastOcc=_nowMs+_stagger;
        _hsDir.copy(hs.pos).sub(cam.position);
        const distToHs=_hsDir.length();
        const R=hs.px||24;
        let occ=0;
        for(let i=0;i<_HS_SAMPLES.length;i++){
          const px=sx+_HS_SAMPLES[i][0]*R, py=sy+_HS_SAMPLES[i][1]*R;
          const nx=(px/W)*2-1, ny=-(py/H)*2+1;
          if(_hsSampleOccluded(nx,ny,distToHs)) occ++;
        }
        const v=1-(occ/_HS_SAMPLES.length);
        hs.vis=v*v*(3-2*v);   // smoothstep → softer edge falloff
      }
      target=hs.vis;
    }

    // Temporal smoothing of opacity removes flicker as the ray grazes edges.
    hs.op=(hs.op==null)?target:hs.op+(target-hs.op)*0.3;
    if(hs.op<0.012){
      hs.el.style.display='none';
    } else {
      hs.el.style.display='block';
      hs.el.style.opacity=hs.op.toFixed(3);
      hs.el.style.pointerEvents=hs.op>0.5?'auto':'none';
    }
  });
}


// ── IMAGE TRIGGERS ─────────────────────────────────────────────────────────
// DOM overlay approach — identical to hotspots but shows an <img> element
// instead of a pulsing ring. Transparent PNG areas show the HTML background,
// not the 3D scene, eliminating every green-tint / blending issue.
// Occlusion uses the same raycaster logic as hotspots.
const _imgTriggers=[];

function _initImageTriggers(){
  const layer=document.getElementById('hotspot-layer'); // reuse the same overlay layer
  if(!layer) return;

  function _add(def,fn){
    if(!def.image_file) return;

    const el=document.createElement('img');
    el.src='images/'+def.image_file;
    console.log('[WCE] image trigger src:',el.src,'file:',def.image_file);
    el.onerror=()=>console.error('[WCE] image trigger FAILED to load:',el.src);
    const _opStr='opacity:'+(def.image_opacity??1);
    el.style.cssText=[
      'position:absolute',
      'transform:translate(-50%,-50%)',
      _opStr,
      'cursor:pointer',
      'pointer-events:none',
      'display:none',
      'user-select:none',
      '-webkit-user-drag:none',
      'object-fit:contain',
    ].join(';');
    layer.appendChild(el);

    const p=def.image_position||[0,0,0];
    const worldPos=new THREE.Vector3(p[0],p[1],p[2]);

    // Build the quaternion that rotates the plane (same as mesh approach)
    // so we can project its corners to screen space for sizing.
    const toRad=Math.PI/180;
    const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(
      Math.PI/2+(def.image_rotation_x||0)*toRad,
      (def.image_rotation_z||0)*toRad,
      -(def.image_rotation_y||0)*toRad,
      'YXZ'
    ));
    const halfW=(def.image_width??1)/2;
    const halfH=(def.image_height??1)/2;
    // Corner offset vectors in world space (used for screen-space size estimation)
    const cornerR=new THREE.Vector3(halfW,0,0).applyQuaternion(q);
    const cornerU=new THREE.Vector3(0,halfH,0).applyQuaternion(q);

    el.addEventListener('pointerdown',(e)=>{ e.stopPropagation(); fn(); });
    _imgTriggers.push({worldPos,worldW:def.image_width??1,worldH:def.image_height??1,imgOp:def.image_opacity??1,el,fn,op:0,vis:null,_lastOcc:0});
  }

  allAnimDefs().forEach(d=>{   
    if(d.trigger==='image') _add(d,()=>triggerAnim(d.name));
    (d.extra_images||[]).forEach(ei=>{ _add(ei,()=>triggerAnim(d.name)); });
  });
  const cin=camCfg.cinematic||{};
  if(cin.trigger==='image') _add(cin,()=>_cinematicPlaying?_stopCinematic():_startCinematic());
  ((CFG.animations||{}).sequences||[]).forEach(s=>{
    if(s.trigger==='image') _add(s,()=>executeSequence(s.name));
  });
}

function _tickImgTriggers(){
  if(!_imgTriggers.length) return;
  const W=innerWidth, H=innerHeight;
  const _nowMs=performance.now();
  const _OCC_MS=100;

  _imgTriggers.forEach((it,idx)=>{
    if(it.op!=null && it.op<0.012 && !_hsCamMoved){ it.el.style.display='none'; return; }
    if(it._offScreen && (_hsFrame%2)!==(idx%2)){
      if(it.op>0.012){it.op*=0.8; it.el.style.opacity=it.op.toFixed(3);}
      return;
    }
    _hsTmpV.copy(it.worldPos).project(cam);

    // Behind camera or well off-screen
    if(_hsTmpV.z>1||_hsTmpV.x<-1.4||_hsTmpV.x>1.4||_hsTmpV.y<-1.4||_hsTmpV.y>1.4){
      it._offScreen=true; it.op=(it.op??0)*0.7;
      if(it.op<0.012){ it.el.style.display='none'; }
      return;
    }
    it._offScreen=false;

    const sx=(_hsTmpV.x*0.5+0.5)*W;
    const sy=(-_hsTmpV.y*0.5+0.5)*H;

    // Occlusion check — throttled to ~10Hz, skipped when camera is still
    const _stagger=idx*(_OCC_MS/Math.max(1,_imgTriggers.length));
    if(it.vis==null||(_hsCamMoved&&(_nowMs-(it._lastOcc||0))>=_OCC_MS)){
      it._lastOcc=_nowMs+_stagger;
      _hsDir.copy(it.worldPos).sub(cam.position);
      const dist=_hsDir.length();
      _hsRay.set(cam.position,_hsDir.normalize());
      _hsRay.far=dist-HOTSPOT_OCCLUSION_BIAS;
      const hits=_hsRay.intersectObjects(_occluderMeshes,false);
      it.vis=hits.length===0?1:0;
    }

    const target=it.vis??0;
    it.op=(it.op==null)?target:it.op+(target-it.op)*0.3;

    if(it.op<0.012){
      it.el.style.display='none';
      return;
    }

    // Compute pixel size from world dimensions + camera distance.
    // This gives perspective-correct stable scaling (same as how any 3D
    // object appears to resize as you orbit) without jitter from corner
    // projection artifacts.
    const dist=Math.max(0.1, cam.position.distanceTo(it.worldPos));
    const tanHalfFov=Math.tan(cam.fov*Math.PI/360);
    const pxH=Math.max(20,(it.worldH/(dist*tanHalfFov*2))*H);
    const pxW=Math.max(20,(it.worldW/(dist*tanHalfFov*2*cam.aspect))*W);

    it.el.style.display='block';
    it.el.style.left=sx+'px';
    it.el.style.top =sy+'px';
    it.el.style.width =(Math.max(20,pxW))+'px';
    it.el.style.height=(Math.max(20,pxH))+'px';
    it.el.style.opacity=(it.op*it.imgOp).toFixed(3);
    it.el.style.pointerEvents=it.op>0.5?'auto':'none';
  });
}


// Helper for adding ad-hoc hotspot triggers (used by buildSequenceUI).
function _registerHotspot(objName, fn){
  if(!objName||!fn) return;
  const hs=hotspots.find(h=>h.name===objName);
  if(hs) hs.fn=fn; // attach callback to existing hotspot element
}

// ── RENDER LOOP ──────────────────────────────────────────────────────────

// Declared before the render loop (which references it) to avoid a temporal
// dead-zone error; the rest of the AR state lives in the AR module below.
let _xrActive=false;
(function tick(){
  requestAnimationFrame(tick);
  if(_xrActive) return;   // XR drives its own loop
  const dist=ctrl.getDistance();
  const cosPhi=Math.max(-1,Math.min(1,(FLOOR_Z-ctrl.target.y)/dist));
  ctrl.maxPolarAngle=Math.acos(cosPhi)-0.01;
  // Optional roof: camera can't rise above the CAM_ROOF plane.
  if(ROOF_Z!=null){
    const cosR=Math.max(-1,Math.min(1,(ROOF_Z-ctrl.target.y)/dist));
    ctrl.minPolarAngle=Math.min(Math.acos(cosR)+0.01, ctrl.maxPolarAngle-0.02);
  }
  _tickTurntable();
  _tickMixers();
  const _tdt=Math.min(0.05,(performance.now()-_lastTransT)/1000); _lastTransT=performance.now();
  _tickTransitions(_tdt);

  if(_cinematicPlaying && _cinematicNodes[_cinematicIdx]){
    const cNode = _cinematicNodes[_cinematicIdx];
    cNode.getWorldPosition(cam.position);
    cNode.getWorldQuaternion(cam.quaternion);
    const fw = new THREE.Vector3(0,0,-1).applyQuaternion(cam.quaternion);
    ctrl.target.copy(cam.position).add(fw.multiplyScalar(dist > 0.1 ? dist : 5));
  } else {
    // ctrl.update() runs every frame — keeps OrbitControls internal spherical
    // state synced so there is never stale state between flies.
    // _tickFly() runs AFTER and overrides the position for the fly arc.
    _applyCamDistanceLock();
    ctrl.update();
    _correctCamDistanceLock();
    _camLockDebugLog('after 1st ctrl.update()');
    // Safety net: OrbitControls' internal math can produce Infinity/NaN if
    // its orbit radius ever gets too close to zero (this happened with an
    // earlier, too-aggressive Lock Tumble/Pan value) — once corrupted, the
    // camera never recovers on its own. Restore from the last known-good
    // position instead of leaving it (and everything that projects through
    // it, like hotspots) permanently broken.
    if(!isFinite(cam.position.x)||!isFinite(cam.position.y)||!isFinite(cam.position.z)
       ||!isFinite(ctrl.target.x)||!isFinite(ctrl.target.y)||!isFinite(ctrl.target.z)){
      if(_camHasGoodState){
        cam.position.copy(_camLastGoodPos);
        ctrl.target.copy(_camLastGoodTarget);
      } else {
        // Never had a valid frame at all (e.g. broken from the very first
        // position set at script load) — nothing to restore from, so fall
        // back to a hardcoded, always-safe default instead of staying stuck.
        cam.position.set(0,2,10);
        ctrl.target.set(0,0.8,0);
      }
      ctrl.minDistance=Math.max(ctrl.minDistance,0.05);
      ctrl.maxDistance=Math.max(ctrl.maxDistance,0.05);
      ctrl.update();
    } else {
      _camLastGoodPos.copy(cam.position);
      _camLastGoodTarget.copy(ctrl.target);
      _camHasGoodState=true;
    }
    if(_flyPending){
      _flyFromPos.copy(cam.position); _flyFromTgt.copy(ctrl.target);
      _flyToPos.copy(_flyDestPos); _flyToTgt.copy(_flyDestTgt);
      _flyFromFov=cam.fov; _flyToFov=_flyDestFov;
      if(_flyDestSound) SFX.playFile(_flyDestSound);
      _flyPending=false; _flyActive=true; _flyT=0;
    }
    if(_flyActive){
      _tickFly();
      cam.lookAt(ctrl.target);
    } else {
    // Re-asserted again here, not just before the earlier update() call above
    // — this second update() is the one actually processing live user input
    // (rotation/zoom), and several other things run in between the two
    // calls each frame. Without reasserting immediately before this one too,
    // the lock could still be bypassed right where it mattered most.
    _applyCamDistanceLock();
    ctrl.update();
    _camLockDebugLog('after 2nd ctrl.update() (pre pan-clamp)');
    _correctCamDistanceLock();
    _camLockDebugLog('after direct correction');
    // Clamp pan target. Shift cam.position by the same delta so orbit
    // relationship is preserved with no visual jump. Also drain any
    // residual damped pan offset stored in OrbitControls.
    // Locked cameras are excluded entirely — this clamps against the
    // model's general bounding box, which has no awareness of a specific,
    // deliberately close/precise locked shot. It doesn't break the locked
    // DISTANCE (position and target shift by the same delta, preserving the
    // radius between them) — but it silently relocates where that fixed
    // view is centered, which is exactly a locked camera drifting off its
    // configured shot even while technically staying "locked" to wherever
    // it drifted to.
    if(_panMin!==null && !_camDistanceLocked){
      const _dx=Math.max(_panMin.x,Math.min(_panMax.x,ctrl.target.x))-ctrl.target.x;
      const _dy=Math.max(_panMin.y,Math.min(_panMax.y,ctrl.target.y))-ctrl.target.y;
      const _dz=Math.max(_panMin.z,Math.min(_panMax.z,ctrl.target.z))-ctrl.target.z;
      if(_dx||_dy||_dz){
        ctrl.target.x+=_dx; ctrl.target.y+=_dy; ctrl.target.z+=_dz;
        cam.position.x+=_dx; cam.position.y+=_dy; cam.position.z+=_dz;
        // Drain residual pan offset if OrbitControls exposes it
        if(ctrl._panOffset) ctrl._panOffset.set(0,0,0);
      }
    }
    _camLockDebugLog('end of frame (post pan-clamp)');
  }
  }

  // Continuous activity keeps the draw window open; otherwise we draw only for
  // the short window opened by interaction / camera damping (requestRender).
  const _now=performance.now();
  // Called unconditionally, not inline in the || chain below — it has a
  // position-tracking side effect that must run every single frame, which
  // short-circuit evaluation could otherwise skip whenever an earlier
  // condition in that chain is already true.
  const _settling=_cameraStillSettling();
  const _active = _flyActive || _turntableActive || _cinematicPlaying || _hoverOn
                || _now<_animActiveUntil || Object.keys(_segWatch).length>0
                || _matTweens.length>0 || _geoTweens.length>0 || _userInteracting
                || _settling;
  if(_active) _renderUntil=_now+100;

  if(_now<=_renderUntil){
    comp.render();
    // Hotspots: skip entirely during AR — the raycaster runs against the full
    // scene (including the AR clone) and causes the frame-rate drop you saw.
    if(!_xrActive) try{ _tickHotspots(); }catch(e){ console.error('[WCE] Hotspot tick failed:', e); }
    if(!_xrActive) _tickImgTriggers();
  }
})();

// ── AR (WebXR on Android, pre-baked USDZ on iOS) ─────────────────────────────
// Android: WebXR immersive-ar — live three.js scene, current config, unchanged.
// iOS:     pre-baked USDZ files written at Blender export time. The AR button
//          shows only the combos (geo × mat) the artist marked for AR, so the
//          user picks from valid pre-baked configs before Quick Look opens.
//          No blob generation, no async before the click — works reliably.
let _xrSession=null, _xrRefSpace=null, _xrHitSource=null;
let _arReticle=null, _arModel=null, _arPlaced=false, _arBgBackup=null, _xrFrameErrored=false;

function _isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent)
      || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
}
function _quickLookSupported(){
  const a=document.createElement('a');
  return !!(a.relList && a.relList.supports && a.relList.supports('ar'));
}
function _slug(n){ return n.toLowerCase().replace(/[^a-z0-9_-]/g,'_').replace(/^_+|_+$/g,''); }
function _arUSDZPath(geoName, matName){
  const parts=[];
  if(geoName) parts.push(_slug(geoName));
  if(matName) parts.push(_slug(matName));
  return 'IOS AR/ar__'+(parts.length?parts.join('__'):'default')+'.usdz';
}

// ── iOS AR picker ─────────────────────────────────────────────────────────────
let _arPickerOpen=false;
const _arGeoSets = (CFG.ar&&CFG.ar.geo_sets)||[];
const _arMatSets = (CFG.ar&&CFG.ar.mat_sets)||[];

function _showARPicker(){
  if(_arPickerOpen) return;
  _arPickerOpen=true;

  // Overlay
  const ov=document.createElement('div');
  ov.id='ar-picker-ov';
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 0 40px';

  const box=document.createElement('div');
  box.style.cssText='background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:18px;width:min(360px,90vw);font-family:Rajdhani,sans-serif';

  const title=document.createElement('div');
  title.textContent='Choose AR configuration';
  title.style.cssText='font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--text);margin-bottom:14px;font-weight:600';
  box.appendChild(title);

  // State
  let selGeo=(_arGeoSets.length===1)?_arGeoSets[0].name:null;
  let selMat=(_arMatSets.length===1)?_arMatSets[0].name:null;

  function _makeSection(label, items, onSel, getVal){
    if(!items.length) return null;
    const sec=document.createElement('div');
    sec.style.cssText='margin-bottom:12px';
    const lbl=document.createElement('div');
    lbl.textContent=label;
    lbl.style.cssText='font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:6px';
    sec.appendChild(lbl);
    const row=document.createElement('div');
    row.style.cssText='display:flex;flex-wrap:wrap;gap:6px';
    items.forEach(it=>{
      const b=document.createElement('button');
      b.textContent=it.name;
      b.style.cssText='padding:6px 12px;background:var(--panel);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:Rajdhani,sans-serif;font-size:11px;letter-spacing:.1em;cursor:pointer';
      b.onclick=()=>{
        row.querySelectorAll('button').forEach(x=>x.style.borderColor='var(--border)');
        b.style.borderColor='var(--accent)';
        onSel(it.name);
        _updateLaunch();
      };
      if(getVal()===it.name) b.style.borderColor='var(--accent)';
      row.appendChild(b);
    });
    sec.appendChild(row);
    return sec;
  }

  const geoSec=_makeSection('Body Style',_arGeoSets,n=>{selGeo=n;},()=>selGeo);
  const matSec=_makeSection('Colour / Finish',_arMatSets,n=>{selMat=n;},()=>selMat);
  if(geoSec) box.appendChild(geoSec);
  if(matSec) box.appendChild(matSec);

  const launch=document.createElement('button');
  launch.textContent='View in AR';
  launch.style.cssText='width:100%;padding:10px;margin-top:8px;background:var(--accent);border:none;border-radius:4px;color:#0b0b0b;font-family:Rajdhani,sans-serif;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;opacity:.4';
  launch.disabled=true;

  function _updateLaunch(){
    const ready=(!_arGeoSets.length||selGeo)&&(!_arMatSets.length||selMat);
    launch.disabled=!ready;
    launch.style.opacity=ready?'1':'.4';
  }
  _updateLaunch();

  launch.onclick=()=>{
    // Synchronous file URL — no await, stays inside the user gesture.
    const path=_arUSDZPath(selGeo,selMat);
    const a=document.createElement('a');
    a.rel='ar'; a.href=path;
    const img=document.createElement('img');
    img.src='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
    img.style.cssText='position:absolute;width:1px;height:1px;opacity:0';
    a.appendChild(img);
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ a.remove(); _closeARPicker(); },2000);
  };
  box.appendChild(launch);

  const cancel=document.createElement('button');
  cancel.textContent='Cancel';
  cancel.style.cssText='width:100%;padding:8px;margin-top:6px;background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--muted);font-family:Rajdhani,sans-serif;font-size:11px;letter-spacing:.12em;cursor:pointer';
  cancel.onclick=_closeARPicker;
  box.appendChild(cancel);

  ov.appendChild(box);
  document.body.appendChild(ov);
}

function _closeARPicker(){
  _arPickerOpen=false;
  const ov=document.getElementById('ar-picker-ov');
  if(ov) ov.remove();
}

async function _initAR(){
  if(!(CFG.ar && (CFG.ar.ios_enabled || CFG.ar.android_enabled))) return;
  const btn=document.getElementById('ar-btn');
  if(!btn) return;

  if(_isIOS() && _quickLookSupported()){
    if(!CFG.ar.ios_enabled) return;
    // iOS: only show button if at least one USDZ was pre-baked
    const hasCombos=_arGeoSets.length||_arMatSets.length;
    if(!hasCombos) return;
    btn.style.display='flex';
    btn.dataset.realArAvailable='1';
    // If there's only one combo, skip the picker and go straight to Quick Look.
    const singleGeo=_arGeoSets.length<=1?(_arGeoSets[0]?.name||null):null;
    const singleMat=_arMatSets.length<=1?(_arMatSets[0]?.name||null):null;
    const needsPicker=_arGeoSets.length>1||_arMatSets.length>1;
    btn.onclick=()=>{
      if(needsPicker){ _showARPicker(); return; }
      const path=_arUSDZPath(singleGeo,singleMat);
      const a=document.createElement('a'); a.rel='ar'; a.href=path;
      const img=document.createElement('img');
      img.src='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
      img.style.cssText='position:absolute;width:1px;height:1px;opacity:0';
      a.appendChild(img); document.body.appendChild(a); a.click();
      setTimeout(()=>a.remove(),2000);
    };
    return;
  }

  // Android/desktop: WebXR
  if(!CFG.ar.android_enabled) return;
  let mode=null;
  try{ if(navigator.xr && await navigator.xr.isSessionSupported('immersive-ar')) mode='webxr'; }catch(e){}
  if(!mode) return;
  btn.style.display='flex';
  btn.dataset.realArAvailable='1';
  btn.onclick=()=>_startWebXR();
}

// Android/WebXR — immersive-ar with floor hit-test and tap-to-place.
async function _startWebXR(){
  if(!root || _xrSession){ return; }
  const btn=document.getElementById('ar-btn');
  if(btn) btn.disabled=true;
  try{
    _xrFrameErrored=false;
    _xrSession=await navigator.xr.requestSession('immersive-ar',{
      requiredFeatures:['hit-test'],
      optionalFeatures:['dom-overlay','local-floor'],
      domOverlay:{root:document.body}
    });

    _xrActive=true;
    renderer.xr.enabled=true;
    await renderer.xr.setSession(_xrSession);

    _arBgBackup=scene.background; scene.background=null;
    if(typeof _groundSky!=='undefined' && _groundSky) _groundSky.visible=false;
    if(root) root.visible=false;

    const rg=new THREE.RingGeometry(0.07,0.09,32).rotateX(-Math.PI/2);
    _arReticle=new THREE.Mesh(rg,new THREE.MeshBasicMaterial({color:0x39c5ff}));
    _arReticle.matrixAutoUpdate=false; _arReticle.visible=false; scene.add(_arReticle);

    _arModel=root.clone(true); _arModel.visible=false;
    const box=new THREE.Box3().setFromObject(root);
    const sz=box.getSize(new THREE.Vector3());
    const maxd=Math.max(sz.x,sz.y,sz.z)||1;
    const targetMetres=1.0;
    _arModel.scale.setScalar(targetMetres/maxd);
    (function _syncMats(s,d){
      const sm=[],dm=[];
      s.traverse(o=>{if(o.isMesh)sm.push(o);});
      d.traverse(o=>{if(o.isMesh)dm.push(o);});
      sm.forEach((m,i)=>{if(dm[i])dm[i].material=m.material;});
    })(root,_arModel);
    scene.add(_arModel); _arPlaced=false;

    let exit=document.getElementById('ar-exit');
    if(!exit){exit=document.createElement('button');exit.id='ar-exit';exit.style.cssText='position:fixed;top:14px;right:14px;z-index:10000;padding:8px 14px;background:rgba(0,0,0,.6);border:1px solid #fff;border-radius:4px;color:#fff;font-family:Rajdhani,sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer';document.body.appendChild(exit);}
    exit.textContent='Exit AR'; exit.style.display='block';
    exit.onclick=()=>{ try{_xrSession?.end();}catch(e){} };

    let hint=document.getElementById('ar-hint');
    if(!hint){hint=document.createElement('div');hint.id='ar-hint';hint.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:64px;z-index:10000;padding:8px 14px;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;font-family:Rajdhani,sans-serif;font-size:11px;letter-spacing:.08em;text-align:center';document.body.appendChild(hint);}
    hint.textContent='Point at the floor, then tap to place'; hint.style.display='block';

    try{ _xrRefSpace=await _xrSession.requestReferenceSpace('local-floor'); }
    catch(e){ _xrRefSpace=await _xrSession.requestReferenceSpace('local'); }
    const viewer=await _xrSession.requestReferenceSpace('viewer');
    _xrHitSource=await _xrSession.requestHitTestSource({space:viewer});

    _xrSession.addEventListener('select',()=>{
      if(_arReticle&&_arReticle.visible&&_arModel){
        _arModel.position.setFromMatrixPosition(_arReticle.matrix);
        _arModel.visible=true; _arPlaced=true;
        hint.textContent='Tap again to reposition';
      }
    });
    _xrSession.addEventListener('end',_endWebXR);
    renderer.setAnimationLoop(_onXRFrame);
  }catch(e){
    console.error('[WCE] AR setup failed:',e);
    alert('Could not start AR. Use Chrome on Android over HTTPS.');
    try{ if(_xrSession) await _xrSession.end(); }catch(_e){}
    _endWebXR();
  }finally{
    if(btn) btn.disabled=false;
  }
}

function _onXRFrame(t,frame){
  try{
    if(frame&&_xrHitSource&&_xrRefSpace){
      const hits=frame.getHitTestResults(_xrHitSource);
      if(hits.length){
        const pose=hits[0].getPose(_xrRefSpace);
        if(pose){ _arReticle.visible=!_arPlaced; _arReticle.matrix.fromArray(pose.transform.matrix); }
        else if(_arReticle) _arReticle.visible=false;
      } else if(_arReticle) _arReticle.visible=false;
    }
    renderer.render(scene,cam);
  }catch(e){
    if(!_xrFrameErrored){ _xrFrameErrored=true; console.error('[WCE] XR frame:',e); try{_xrSession?.end();}catch(_e){} }
  }
}

function _endWebXR(){
  renderer.setAnimationLoop(null);
  try{ if(_xrHitSource&&_xrHitSource.cancel)_xrHitSource.cancel(); }catch(e){}
  _xrHitSource=null;
  if(_arReticle){scene.remove(_arReticle);_arReticle.geometry.dispose();_arReticle.material.dispose();_arReticle=null;}
  if(_arModel){scene.remove(_arModel);_arModel=null;}
  if(root) root.visible=true;
  if(typeof _groundSky!=='undefined'&&_groundSky) _groundSky.visible=true;
  scene.background=_arBgBackup; _arBgBackup=null;
  renderer.xr.enabled=false; _xrActive=false; _xrSession=null; _xrFrameErrored=false;
  const exit=document.getElementById('ar-exit'); if(exit) exit.style.display='none';
  const hint=document.getElementById('ar-hint'); if(hint) hint.style.display='none';
  if(typeof requestRender==='function') requestRender(1000);
}

_initAR();


function _arInvalidate(){                       // config changed → USDZ is stale
  if(_arUSDZUrl){ try{URL.revokeObjectURL(_arUSDZUrl);}catch(e){} _arUSDZUrl=null; }

  const btn=document.getElementById('ar-btn'); const lbl=btn?btn.querySelector('span'):null;
  if(lbl && lbl.textContent==='Open in AR') lbl.textContent='View in AR';
}

async function _onModelLoaded(gltf){
    root=gltf.scene; root.visible=false; scene.add(root);
    // Re-apply the default Environment/Light selection now that root
    // actually exists. The earlier _loadHDRIItem(_initHdri) call (fired
    // before the model even started fetching, to kick off the HDRI texture
    // load in parallel) calls _applyEnvironmentAndLight too, but every
    // findNode() lookup in it silently fails with no `root` to search —
    // so without this, the initial Environment/Light choice never actually
    // gets applied and every switch collection is left at whatever raw
    // visibility state the GLB happened to export with.
    _applyEnvironmentAndLight(_initHdri);
    // Compute model bounding box once after load — used to clamp pan in the tick loop.
    const _modelBox=new THREE.Box3().setFromObject(root);
    if(_modelBox.isEmpty()){
      // No actual geometry in the scene at all — Box3 represents "empty" as
      // an Infinity/-Infinity sentinel, which would otherwise corrupt the
      // camera's real position the instant pan-clamping ever ran. Leaving
      // _panMin/_panMax at null (their existing default) simply disables
      // pan-clamping entirely rather than computing garbage bounds from it.
      _panMin=null; _panMax=null;
    } else {
      _panMin=_modelBox.min.clone(); _panMax=_modelBox.max.clone();
      const _panMargin=Math.max((CFG.camera&&CFG.camera.zoom_min)??2,(_panMax.x-_panMin.x)*0.25);
      _panMin.x-=_panMargin; _panMin.z-=_panMargin;
      _panMax.x+=_panMargin; _panMax.z+=_panMargin;
      _panMin.y=FLOOR_Z;
      _panMax.y=(ROOF_Z!=null?ROOF_Z:_panMax.y+_panMargin);
    }
    try{
      const allMats=await gltf.parser.getDependencies('materials');
      const sR=['map','emissiveMap','sheenColorMap','specularColorMap'];
      const lR=['normalMap','roughnessMap','metalnessMap','aoMap','displacementMap','alphaMap',
                'sheenRoughnessMap','transmissionMap','thicknessMap','clearcoatMap',
                'clearcoatNormalMap','clearcoatRoughnessMap'];
      allMats.forEach(m=>{
        if(m?.name) matMap[m.name]=m;
        if(m){sR.forEach(k=>{if(m[k])m[k].colorSpace=THREE.SRGBColorSpace;});
               lR.forEach(k=>{if(m[k])m[k].colorSpace=THREE.LinearSRGBColorSpace;});}
      });
    }catch(e){console.warn('[WCE] prefetch materials:',e);}

    root.traverse(o=>{
      if(o.isMesh){
        o.castShadow=true;o.receiveShadow=true;
        
        // --- NEW BVH LOGIC START ---
        const isSkinned = o.isSkinnedMesh;
        const hasShapeKeys = o.morphTargetInfluences && o.morphTargetInfluences.length > 0;
        if(isSkinned || hasShapeKeys){

          // Rigid mesh: Build static BVH tree for zero-lag occlusion
          o.geometry.computeBoundsTree();

        }
        // --- NEW BVH LOGIC END ---

        const ms=Array.isArray(o.material)?o.material:[o.material];
        if(!o.userData.origMatNames) o.userData.origMatNames=ms.map(m=>m?.name||'');
        const hasAO=o.geometry&&o.geometry.hasAttribute('color');
        ms.forEach(m=>{
          if(m?.name) matMap[m.name]=m;
          if(m){
            ['map','emissiveMap'].forEach(k=>{if(m[k])m[k].colorSpace=THREE.SRGBColorSpace;});
            ['normalMap','roughnessMap','metalnessMap'].forEach(k=>{if(m[k])m[k].colorSpace=THREE.LinearSRGBColorSpace;});
            if(hasAO){m.vertexColors=true;m.needsUpdate=true;}
          }
        });
      }
      if(o.isLight){
        o.castShadow=true;
        if(o.shadow){o.shadow.mapSize.set(1024,1024);o.shadow.bias=-0.001;o.shadow.normalBias=0.02;}
      }
    });

    (CFG.area_lights||[]).forEach(al=>{
      const light=new THREE.RectAreaLight(new THREE.Color(...al.color),al.intensity,al.width,al.height);
      light.name=al.name;light.position.set(...al.position);
      if(al.quaternion) light.quaternion.set(...al.quaternion);
      else if(al.rotation) light.rotation.set(...al.rotation); // legacy config fallback
      // al.rig is missing on config.json exported before this fix — treat
      // that as "unknown rig", kept always-on so old exports keep working
      // exactly as before rather than suddenly going dark.
      light.userData.wceRig=al.rig||null;
      scene.add(light);

    });

    _initAnimMixers(gltf);
    // ── Snap all controls/combos to their configured default_state HERE —
    // before hide() is called, while the loader is definitely still covering
    // the screen. This ensures the model is always revealed in the correct
    // pose with no visible jump or transition from state 0.
    _applyDefaultAnimStates();
    _initCinematicMixers(gltf);
    _initImageTriggers();
    _initHotspots();
    // A failure in here must never be able to block hide() below, or the
    // globals ui.js depends on from being exposed — that would silently
    // break the entire page (hotspots included), not just annotations.
    try{ _initAnnotations(); }catch(e){ console.error('[WCE] Annotations failed to initialize:', e); }

    // Debug handle: inspect from the browser console, e.g.
    //   WCE.CFG.animations.combos   |   Object.keys(WCE.animMixers)   |   WCE.trigger('Part_0')
    try{ window.WCE={
      CFG, animMixers, animClips, animState,
      hoverClips:()=>({rise:_hoverRiseClip&&_hoverRiseClip.name,loop:_hoverLoopClip&&_hoverLoopClip.name,on:_hoverOn}),
      trigger:triggerAnim, gltf
    }; }catch(e){}

    prog(100,'READY');hide();

    // Default geo must be applied AFTER applyVariant / refreshAdvMat —
    // applyVariant walks geometry_exposed and would overwrite it otherwise.

    // ── Expose all globals ui.js needs BEFORE ensureGeoDefaults runs ─────────
    window.CFG=CFG; window.varData=varData; window.root=root; window.WCE_OVERLAYS=WCE_OVERLAYS;
    window.scene=scene; window.WCE_THEME=WCE_THEME; window.WCE_PROFILES=WCE_PROFILES; window.WCE_THUMBNAIL_GROUPS=WCE_THUMBNAIL_GROUPS;
    window.matSt=matSt; window.geoSt=geoSt; window.animState=animState;
    window.camCfg=camCfg; window._TRANS=_TRANS; window.SFX=SFX;
    window.triggerAnim=triggerAnim; window.flyToAnimState=flyToAnimState; window.flyToCamera=flyToCamera;
    window._isFlyActive=function(){return _flyActive||_flyPending;}; // for sequence poll in ui.js
    window.applyMat=applyMat; window.applyGeoSubset=applyGeoSubset;
    window.applyGeoToggle=applyGeoToggle; window.applyVariant=applyVariant;
    window.applyMatSubset=applyMatSubset; window.refreshActive=refreshActive;
    window.refreshAdvMat=refreshAdvMat; window.allAnimDefs=allAnimDefs;
    window.findNode=findNode; window._geoDissolveNode=_geoDissolveNode;
    window._loadHDRIItem=_loadHDRIItem;
    window._registerHotspot=_registerHotspot;
    window._startCinematic=_startCinematic; window._stopCinematic=_stopCinematic;
    window._startTurntable=_startTurntable; window._stopTurntable=_stopTurntable;
    window.scene=scene; window.renderer=renderer; window._ambientLight=_ambientLight;
    try{Object.defineProperty(window,'_cinematicPlaying',{get:()=>_cinematicPlaying,set:v=>{_cinematicPlaying=v;},configurable:true});}catch(e){}
    try{Object.defineProperty(window,'_turntableActive',{get:()=>_turntableActive,set:v=>{_turntableActive=v;},configurable:true});}catch(e){}
    try{Object.defineProperty(window,'_hdriActiveFile',{get:()=>_hdriActiveFile,set:v=>{_hdriActiveFile=v;},configurable:true});}catch(e){}
    (function ensureGeoDefaults(){
      const exposed=CFG.geometry_exposed||{};
      const norm=n=>n.replace(/^GEOMETRIES_/i,'').toLowerCase();
      const chosen=new Set(Object.values(CFG.default_geo_state||{}).map(v=>norm(String(v))));
      function walk(pN,tree){
        const ch=(tree.children||[]).filter(c=>!c.name.toLowerCase().includes('common'));
        if(ch.length>1&&!ch.some(c=>chosen.has(norm(c.name))))
          applyGeoToggle(ch[0].name,ch.map(c=>c.name));
        (tree.children||[]).forEach(c=>{if(c.children?.length) walk(c.name,c);});
      }
      Object.entries(exposed).forEach(([pN,tree])=>walk(pN,tree));
    })();

    window._wce={CFG,matMap,cloneCache,varData};

    try{
      if(CFG.containers)
        Object.entries(CFG.containers).forEach(([c,vals])=>{if(vals?.length) matSt[c]=vals[0];});
      const allSubs=[...(CFG.mat_subsets||[]),(CFG.global_mat_sets||[])].flat();
      const dms=CFG.default_mat_subset;
      const sub=dms?allSubs.find(s=>s.name===dms.name&&s.category===dms.category):allSubs[0]||null;
      if(sub) Object.assign(matSt,sub.state);
      Object.entries(matSt).forEach(([c,m])=>applyMat(c,m));
      buildUI();
      // Apply defaults in order — all state must be settled before marking buttons.
      const dv=CFG.default_variant&&varData[CFG.default_variant]?CFG.default_variant:null;
      if(dv) applyVariant(dv); else refreshAdvMat(matSt);
      if(CFG.default_geo_state&&Object.keys(CFG.default_geo_state).length){
        applyGeoSubset(CFG.default_geo_state);
        if(typeof buildAdvGeo==='function') buildAdvGeo();
      }
      if(typeof refreshActive==='function') refreshActive();
      if(typeof refreshAdvMat==='function') refreshAdvMat(matSt);
      // Mark default mat-subset pill — match name AND category to avoid
      // highlighting all pills named e.g. "GREY" across different categories.
      if(sub){
        document.querySelectorAll('.pb2[data-sc]').forEach(b=>{
          if(b.textContent.trim()===sub.name && b.dataset.sc===sub.category)
            b.classList.add('active');
        });
      }
      // Mark default geo-package pill: compare package state dict directly
      // against CFG.default_geo_state (same format) — reliable, no geoSt key mismatch.
      (CFG.geometry_subsets||[]).forEach((gpkg,gi)=>{
        const pst=gpkg.state||{};
        const dst=CFG.default_geo_state||{};
        if(!Object.keys(pst).length) return;
        const match=Object.entries(pst).every(([p,c])=>dst[p]===c);
        if(match){ const b=document.querySelector(`.pb2[data-gi="${gi}"]`); if(b) b.classList.add('active'); }
      });
      // Mark active HDRI button.
      document.querySelectorAll('.pb2[data-hf]').forEach(b=>{
        const isActive=b.dataset.hf===_hdriActiveFile
          ||(!_hdriActiveFile&&(CFG.hdris||[]).find(h=>h.default)?.file===b.dataset.hf);
        b.classList.toggle('active',!!isActive);
      });
      root.visible=true;
      requestRender(1000);   // ensure the freshly-loaded model is drawn
    }catch(uiErr){console.error('[WCE] UI error:',uiErr);stEl.textContent='UI ERROR';}
}

// Converts a variant name ('current'/'high'/'medium'/'low') into its actual
// file path. 'current' is the one irregular case — it's the plain default
// model file at the export root (or Normal subfolder), not a per-variant
// subfolder pattern like the other three.
function _wceVariantPath(variant){
  if(variant === 'current') return 'High/915092e5e08d_high.gltf';
  const token = CFG.model_token || 'High/915092e5e08d_high.gltf'.replace(/^.*\//,'').replace(/\.[^.]+$/,'');
  const ext = CFG.model_ext || 'High/915092e5e08d_high.gltf'.split('.').pop();
  const folderName = variant.charAt(0).toUpperCase()+variant.slice(1);
  return folderName+'/'+token+'_'+variant+'.'+ext;
}

// Heuristic only — there's no reliable way to read a visitor's actual GPU
// strength from the browser. Touch-only (no real hover) is the strongest
// available signal for phone/tablet; CPU core count is broadly supported;
// device memory is Chrome/Edge-only (undefined elsewhere), so it can only
// ever refine the guess, never be depended on alone.
//
// Score-based, not fixed thresholds: a hardcoded set of cutoffs (e.g. "≤4
// cores → Medium, >4 → Current") silently breaks depending on which
// variants happen to be checked for a given export — a tier the thresholds
// never produce as an output is unreachable even if it was exported, and
// which tier that is changes depending on the combination. Computing a
// continuous 0-100 score and distributing it evenly across however many
// variants are ACTUALLY available guarantees every checked combination is
// fully reachable, regardless of which subset of Current/High/Medium/Low
// that turns out to be.
function _wceDetectDeviceTier(){
  const hasHover = window.matchMedia('(hover: hover)').matches;
  const cores = navigator.hardwareConcurrency || 4;
  const mem = navigator.deviceMemory;   // undefined on Safari/Firefox

  let score = Math.min(100, Math.max(0, (cores-2)/(16-2)*100));
  if(mem !== undefined){
    const memScore = Math.min(100, Math.max(0, (mem-2)/(16-2)*100));
    score = (score+memScore)/2;
  }

  const order = ['low','medium','high','current'];
  let eligible = order.filter(v => (CFG.available_variants||['current']).includes(v));
  if(eligible.length === 0) eligible = ['current'];

  // Touch devices never exceed Medium — capped here regardless of score,
  // not by clamping the score itself, so a touch device with a high
  // capability score still lands on the BEST tier available up to (and
  // never past) Medium, rather than being pushed toward Low unnecessarily.
  if(!hasHover){
    const mIdx = eligible.indexOf('medium');
    if(mIdx !== -1) eligible = eligible.slice(0, mIdx+1);
    else eligible = eligible.filter(v => v === 'low');
    if(eligible.length === 0) eligible = [order.filter(v=>(CFG.available_variants||['current']).includes(v))[0]];
  }

  const bucket = 100/eligible.length;
  const idx = Math.min(eligible.length-1, Math.floor(score/bucket));
  return eligible[idx];
}

// Test Offline can pass ?preview_variant=high/medium/low/current to force a
// specific variant for manual preview — takes priority over auto-detection
// whenever present. With no override (a real visitor, not a preview
// session), the variant is chosen automatically from detected device
// capability instead. _wceDetectDeviceTier() already only ever selects from
// CFG.available_variants, so its result is always valid — no separate
// fallback/re-check needed on top of it.
function _wceResolveModelFile(){
  const params = new URLSearchParams(window.location.search);
  const forced = params.get('preview_variant');
  const variant = forced ? forced : _wceDetectDeviceTier();
  return _wceVariantPath(variant);
}
const _actualModelFile = _wceResolveModelFile();

if(window.WCE_DESIGNER_MODE){
  // UI Designer mode: skip the (potentially large/slow) model fetch entirely
  // and hand _onModelLoaded an empty stand-in scene graph instead. Every
  // downstream call already tolerates findNode() returning nothing, so the
  // full sidebar/default-state logic still runs — just with no mesh to touch.
  // The canvas is hidden and replaced with a plain gradient so styling work
  // isn't blocked on (or slowed down by) the real geometry loading.
  document.documentElement.style.background='linear-gradient(160deg,#ffffff,#eef0f3)';
  document.body.style.background='linear-gradient(160deg,#ffffff,#eef0f3)';
  if(canvas) canvas.style.display='none';
  const _stubGltf={scene:new THREE.Group(), parser:{getDependencies:async()=>[]}, animations:[]};
  _onModelLoaded(_stubGltf);
} else {
  loader.load(_actualModelFile,
    _onModelLoaded,
    e=>{
      if(e.total&&e.total>0) prog(25+Math.round(e.loaded/e.total*70),'LOADING MODEL');
      else prog(50,'LOADING MODEL…');
    },
    _onLoadError
  );
}

// ── SCENE HELPERS ────────────────────────────────────────────────────────

function findNode(name){
  let res=null;
  const s=name.replace(/ /g,'_');
  if(root) root.traverse(o=>{if(o.name===name||o.name===s) res=o;});
  return res;
}

// GEO_TOGGLE/GEO_FLICKER need this fallback specifically for Area lights:
// findNode() only searches inside root (the glTF model's own hierarchy), but
// Area lights are rebuilt as RectAreaLights added directly to the top-level
// scene (see the area_lights loader) — siblings of root, not descendants of
// it, so a plain findNode() call can never see them.
function _findGeoTarget(name){
  const n=findNode(name);
  if(n) return n;
  const s=name.replace(/ /g,'_');
  return _areaLights.find(l=>l.name===name||l.name===s) || null;
}

// ── MATERIAL / VARIANT SYSTEM ────────────────────────────────────────────

function applyVariant(name){
  const d=varData[name];if(!d)return;
  activeV=name;
  qsa('.gb').forEach(x=>x.classList.remove('active'));
  qsa('.pb2[data-sc]').forEach(x=>x.classList.remove('active'));
  qsa('.pb2[data-tp="gp"]').forEach(x=>x.classList.remove('active'));
  const SKIP=['CAMERA_SETTINGS','MAT_SUBSETS','GLOBAL_MAT_SETS','GEO_SETS','LIGHTS','ENVIRONMENTS'];
  const exposed=CFG.geometry_exposed||{};
  Object.entries(d).forEach(([k,v])=>{
    if(!k.startsWith('GEOMETRIES_')||!exposed[k]) return;
    const sv=typeof v==='string'?v.replace(/ /g,'_'):v;
    if(sv==='NONE'||sv===''||sv==null){const n=findNode(k);if(n){n.visible=false;delete geoSt[k];}}
    else{const sib=exposed[k].children.map(c=>c.name);if(sib.length) applyGeoToggle(sv,sib);}
  });
  Object.entries(d).forEach(([k,v])=>{
    if(k.startsWith('GEOMETRIES_')||SKIP.includes(k)) return;
    if(typeof v==='string'&&v&&v!=='NONE'){applyMat(k,v);matSt[k]=v;}
  });
  const gs=Array.isArray(d.GEO_SETS)?d.GEO_SETS:[];
  const sgp=document.getElementById('sgp');
  if(gs.length){
    sgp.innerHTML='<div class="st">Packages</div>';
    const g=mk('div','pg');
    gs.forEach(s=>{const b=mk('button','pb2');b.dataset.tp='gp';b.textContent=s.name;
      b.onclick=()=>{applyGeoSubset(s.state);qsa('.pb2[data-tp="gp"]').forEach(x=>x.classList.remove('active'));b.classList.add('active');};
      g.appendChild(b);});
    sgp.appendChild(g);
  }else buildGeoPkgs();
  const ms=Array.isArray(d.MAT_SUBSETS)?d.MAT_SUBSETS:[];
  const sms=document.getElementById('sms');
  if(ms.length){
    sms.innerHTML='';const byCat={};
    ms.forEach(s=>{(byCat[s.category]=byCat[s.category]||[]).push(s);});
    Object.entries(byCat).forEach(([cat,items])=>{
      const t=mk('div','st');t.textContent=cat;sms.appendChild(t);
      const g=mk('div','pg');
      items.forEach(s=>{const b=mk('button','pb2');b.dataset.sc=cat;b.textContent=s.name;
        b.onclick=()=>{applyMatSubset(s.state);qsa('.gb').forEach(x=>x.classList.remove('active'));
          qsa('.pb2[data-sc]').forEach(x=>x.classList.remove('active'));b.classList.add('active');refreshAdvMat(s.state);};
        g.appendChild(b);});
      sms.appendChild(g);
    });
  }else buildMatSubs();
  document.getElementById('vl').textContent=name.replace(/_/g,' ').toUpperCase();
  stEl.textContent=name;buildAdvGeo();refreshAdvMat(matSt);refreshActive();
}
function applyMatSubset(st){Object.entries(st).forEach(([c,m])=>{applyMat(c,m);matSt[c]=m;});refreshActive();if(typeof _updateAnnotationVisibility==='function')_updateAnnotationVisibility();}
function resolveMatName(n){return(CFG.mat_name_map&&CFG.mat_name_map[n])?CFG.mat_name_map[n]:n;}
const cloneCache={};
function applyMat(container,matName){
  // Keep the AR clone's materials in sync with the live root.
  if(typeof _arModel!=='undefined' && _arModel && root){
    const srcM=[]; root.traverse(o=>{if(o.isMesh)srcM.push(o);});
    const dstM=[]; _arModel.traverse(o=>{if(o.isMesh)dstM.push(o);});
    srcM.forEach((sm,i)=>{if(dstM[i])dstM[i].material=sm.material;});
  }
  const resolved=resolveMatName(matName);
  const srcMat=matMap[resolved]||matMap[matName];
  if(!srcMat||!root) return;
  let cu=container.toUpperCase();if(cu.startsWith('MAT_')) cu=cu.slice(4);
  const target='MAT_'+cu;
  function slotMatches(n){const u=n.toUpperCase();return u===target||u.startsWith(target+'.')||u===cu||u.startsWith(cu+'.');}
  if(!cloneCache[container]) cloneCache[container]={};
  if(!cloneCache[container][matName]){
    const clone=srcMat.clone();
    clone.name=srcMat.name+'__wce_'+container+'_'+matName;
    const pbr=(CFG.mat_colors||{})[matName]||(CFG.mat_colors||{})[resolved];
    if(pbr){
      if(pbr.color) clone.color.setRGB(pbr.color[0],pbr.color[1],pbr.color[2]);
      if(pbr.metallic!=null) clone.metalness=pbr.metallic;
      if(pbr.roughness!=null) clone.roughness=pbr.roughness;
      if(pbr.emissive) clone.emissive.setRGB(pbr.emissive[0],pbr.emissive[1],pbr.emissive[2]);
      if(pbr.emissiveIntensity!=null) clone.emissiveIntensity=pbr.emissiveIntensity;
      clone.needsUpdate=true;
    }
    // Snapshot the intended target so transitions always lerp toward the true
    // destination (not a value left over from an interrupted tween).
    clone.userData.wceTarget={
      color:clone.color.clone(),
      metalness:clone.metalness,
      roughness:clone.roughness,
      emissive:(clone.emissive?clone.emissive.clone():new THREE.Color(0,0,0)),
    };
    cloneCache[container][matName]=clone;
  }
  const m=cloneCache[container][matName];
  // Smooth transition: tween colour/metallic/roughness/emissive from the
  // currently shown material to the target. Snaps if the maps differ (can't
  // lerp across different textures) or if disabled.
  const smooth=!!_TRANS.material;
  let fromMat=null;
  if(smooth){
    root.traverse(o=>{
      if(fromMat||!o.isMesh) return;
      const orig=o.userData.origMatNames||[];
      for(let i=0;i<orig.length;i++){ if(slotMatches(orig[i])){ fromMat=Array.isArray(o.material)?o.material[i]:o.material; break; } }
    });
  }
  root.traverse(o=>{
    if(!o.isMesh) return;
    const orig=o.userData.origMatNames||[];
    const wasArr=Array.isArray(o.material);
    const slots=wasArr?[...o.material]:[o.material];
    let changed=false;
    const hasAO=o.geometry&&o.geometry.hasAttribute('color');
    for(let i=0;i<orig.length;i++){
      if(slotMatches(orig[i])){slots[i]=m;if(hasAO&&!m.vertexColors){m.vertexColors=true;m.needsUpdate=true;}changed=true;}
    }
    if(changed) o.material=wasArr?slots:slots[0];
  });
  if(smooth && fromMat && fromMat!==m && (fromMat.map||null)===(m.map||null)){
    // Same (or no) albedo map → safe to lerp scalar/colour values. Tween from
    // the previously-shown material to this clone's stored target.
    const to=m.userData.wceTarget||{color:m.color.clone(),metalness:m.metalness,roughness:m.roughness,emissive:(m.emissive?m.emissive.clone():new THREE.Color(0,0,0))};
    const from={color:fromMat.color.clone(),metalness:fromMat.metalness,roughness:fromMat.roughness,emissive:(fromMat.emissive?fromMat.emissive.clone():new THREE.Color(0,0,0))};
    // Start at the previous look, then ramp to the target.
    m.color.copy(from.color);
    m.metalness=from.metalness; m.roughness=from.roughness;
    if(m.emissive) m.emissive.copy(from.emissive);
    for(let i=_matTweens.length-1;i>=0;i--) if(_matTweens[i].mat===m) _matTweens.splice(i,1);
    _matTweens.push({mat:m,from,to,t:0,dur:(_TRANS.mat_ms||300)});
    _bumpAnim((_TRANS.mat_ms||300)+150);
  }
}

<script>
/* Same-tab live reload — active only on the local preview server, never on a
   deployed (GitHub Pages) site. Polls the build token ~1×/s and hard-reloads
   this tab when a new export bumps it. */
(function(){
  var host=location.hostname;
  if(host!=='localhost'&&host!=='127.0.0.1') return;

    fetch('/__wce_reload__',{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){
      if(tok===null) tok=t; else if(t!==tok) location.reload();

  }
  setInterval(poll,1000); poll();
})();
