// ── Section View — up to 3 independent axis clipping planes (X/Y/Z), each
// either a Hollow Cut (just clips, see-through into the interior) or a
// Solid Cap (also renders a colored cross-section at the cut), using the
// same stencil technique as three.js's own official
// webgl_clipping_stencil example. Entirely presence-based: CFG.section_view
// only ever contains keys for axes explicitly enabled in Blender; nothing
// here does anything at all otherwise. Plane convention deliberately
// matches that reference exactly (normal pointing in the NEGATIVE
// direction per axis, so 'constant' is directly the world-space cut
// coordinate with no sign flip) rather than re-deriving it, since getting
// a clipping-plane sign backwards is easy to get subtly wrong.
const _sectionAxes={};        // axisKey -> {active, position, plane}
let _sectionModelBox=null;
let _sectionClippableMeshes=null;   // null = no restriction (falls back to the GEOMETRIES_ ancestor check) — otherwise a Set of the exact meshes bounds_objects scoped the cut to
let _sectionActivePlanes=[];    // read by applyMat's clone hook so a freshly-cloned material picks up whichever cuts are currently active

function _wceSectionAxisNormal(axisKey){
  return axisKey==='x' ? new THREE.Vector3(-1,0,0)
       : axisKey==='y' ? new THREE.Vector3(0,-1,0)
       : new THREE.Vector3(0,0,-1);
}

function _wceSectionConstant(axisKey, percent){
  if(!_sectionModelBox) return 0;
  const lo=_sectionModelBox.min[axisKey], hi=_sectionModelBox.max[axisKey];
  const t=Math.min(1,Math.max(0,percent/100));
  return lo + (hi-lo)*t;
}

// Exact-match only, on purpose — a bounds object the artist picked in
// Blender should either be found precisely or skipped entirely, never
// fuzzy/prefix-matched against a similarly-named object (e.g. Plane vs
// Plane_01 vs Plane.001, which Blender's own duplicate-numbering makes
// easy to end up with). The one thing this DOES account for: Blender's
// dot-numbered duplicate names (Plane.001) are commonly sanitized to an
// underscore (Plane_001) by the glTF exporter, so that one specific,
// known substitution is tried as a second exact attempt — nothing looser.
function _wceSectionFindExact(name){
  if(!root) return null;
  let found=null;
  root.traverse(o=>{ if(!found && o.name===name) found=o; });
  if(found) return found;
  const sanitized=name.replace(/\./g,'_');
  if(sanitized===name) return null;
  root.traverse(o=>{ if(!found && o.name===sanitized) found=o; });
  return found;
}

// The bounding box of JUST this object's own geometry, in world space —
// deliberately NOT recursing into children (unlike Box3.expandByObject,
// which walks the whole descendant hierarchy by default). A selected
// object's bounds should only ever reflect what was actually selected.
function _wceSectionOwnBox(obj){
  if(!obj || !obj.isMesh || !obj.geometry) return null;
  obj.updateWorldMatrix(true,false);
  if(!obj.geometry.boundingBox) obj.geometry.computeBoundingBox();
  if(!obj.geometry.boundingBox) return null;
  return obj.geometry.boundingBox.clone().applyMatrix4(obj.matrixWorld);
}

// True only if `o` (or one of its ancestors) sits inside a GEOMETRIES_
// collection — the actual product geometry. Used to keep Section View's
// clipping planes off everything else in the scene (ground planes,
// backdrop dressing, light rigs in ENVIRONMENTS_/LIGHTS_), which should
// never be cut just because the product is.
function _wceSectionIsProductMesh(o){
  let cur=o;
  while(cur){
    if(cur.name && cur.name.indexOf('GEOMETRIES_')===0) return true;
    cur=cur.parent;
  }
  return false;
}

function _wceSectionRebuild(){
  if(!root) return;
  const order=['x','y','z'];
  const activeAxes=order.filter(k=>_sectionAxes[k] && _sectionAxes[k].active);
  _sectionActivePlanes=activeAxes.map(k=>_sectionAxes[k].plane);
  root.traverse(o=>{
    if(!o.isMesh || !o.material) return;
    const mats=Array.isArray(o.material)?o.material:[o.material];
    // Explicitly reset to empty for anything out of scope (not just "skip"
    // it) — guarantees it's never left clipped from an earlier state.
    // Bounds objects, when configured, take precedence over the general
    // GEOMETRIES_ check — restricting the cut to just what was picked.
    const inScope = _sectionClippableMeshes ? _sectionClippableMeshes.has(o) : _wceSectionIsProductMesh(o);
    const planes = inScope ? _sectionActivePlanes : [];
    mats.forEach(m=>{ if(m) m.clippingPlanes=planes; });
  });
  if(typeof requestRender==='function') requestRender(500);
}

function wceSectionSetActive(axisKey, active){
  const ax=_sectionAxes[axisKey]; if(!ax) return;
  ax.active=!!active;
  _wceSectionRebuild();
}

function wceSectionSetPosition(axisKey, percent){
  const ax=_sectionAxes[axisKey]; if(!ax) return;
  ax.position=percent;
  ax.plane.constant=_wceSectionConstant(axisKey, percent);
  if(typeof requestRender==='function') requestRender(300);
}

function _wceInitSectionView(modelBox){
  const cfg=CFG.section_view||{};
  if(!Object.keys(cfg).length) return;   // no axis was ever enabled — presence-based, do nothing at all
  let effectiveBox=null;
  if(cfg.bounds_objects && cfg.bounds_objects.length){
    // Artist picked specific objects in Blender — the 0-100% range spans
    // just their combined bounding box instead of the whole model, AND
    // the cut itself is scoped to only these objects (plus their own
    // descendants — unlike the box calculation above, which deliberately
    // stays non-recursive, restricting what actually gets cut is more
    // useful the other way: picking a parent object should reasonably
    // bring its own child meshes along too).
    const customBox=new THREE.Box3();
    const clippable=new Set();
    let foundAny=false;
    cfg.bounds_objects.forEach(name=>{
      const n=_wceSectionFindExact(name);
      const b=n?_wceSectionOwnBox(n):null;
      if(b){
        customBox.union(b);
        foundAny=true;
        n.traverse(o=>{ if(o.isMesh) clippable.add(o); });
      }
      else console.warn('[WCE] Section View: bounds object \''+name+'\' was not found (or has no mesh geometry) — ignoring it.');
    });
    if(foundAny && !customBox.isEmpty()){ effectiveBox=customBox; _sectionClippableMeshes=clippable; }
  }
  if(!effectiveBox){
    // Nothing usable was configured — fall back to every GEOMETRIES_
    // collection in the model (the actual product geometry), NOT the
    // whole scene: that would also sweep up ground planes, environment
    // set-pieces, and anything else living outside GEOMETRIES_.
    const geoBox=new THREE.Box3();
    let foundAny=false;
    root.traverse(o=>{
      if(o.name && o.name.indexOf('GEOMETRIES_')===0){ geoBox.expandByObject(o); foundAny=true; }
    });
    effectiveBox = (foundAny && !geoBox.isEmpty()) ? geoBox : modelBox;
  }
  _sectionModelBox=effectiveBox;
  ['x','y','z'].forEach(axisKey=>{
    const a=cfg[axisKey];
    if(!a) return;
    const plane=new THREE.Plane(_wceSectionAxisNormal(axisKey), 0);
    _sectionAxes[axisKey]={
      active:!!a.startup_enabled,
      position:(a.startup_position!=null?a.startup_position:50),
      plane,
    };
    plane.constant=_wceSectionConstant(axisKey, _sectionAxes[axisKey].position);
  });
  renderer.localClippingEnabled=true;
  _wceSectionRebuild();
  if(typeof buildSectionViewUI==='function') buildSectionViewUI();
}
window._wceSectionSetActive=wceSectionSetActive;
window._wceSectionSetPosition=wceSectionSetPosition;
window._wceSectionAxes=_sectionAxes;

async function _onModelLoaded(gltf){
    root=gltf.scene; root.visible=false; scene.add(root);
    // The mat-cache dummy mesh (Blender-side __WCE_MAT_CACHE__) has to exist
    // in the actual export for its materials to be forced in at all, AND
    // stay reachable in the live scene graph afterward — removing it
    // outright (tried earlier) broke material switching again, confirmed by
    // direct testing, meaning something later in this function depends on
    // it still being present. Hidden instead (visible=false), never
    // actually removed.
    const _wceMatCacheNodes = [];
    root.traverse(o=>{ if(o.name && o.name.indexOf('__WCE_MAT_CACHE__')===0) _wceMatCacheNodes.push(o); });
    _wceMatCacheNodes.forEach(o=>{ o.visible=false; });
    // Re-apply the default Environment/Light selection now that root
    // actually exists. The earlier _loadHDRIItem(_initHdri) call (fired
    // before the model even started fetching, to kick off the HDRI texture
    // load in parallel) calls _applyEnvironmentAndLight too, but every
    // findNode() lookup in it silently fails with no `root` to search —
    // so without this, the initial Environment/Light choice never actually
    // gets applied and every switch collection is left at whatever raw
    // visibility state the GLB happened to export with.
    _applyEnvironmentAndLight(_initHdri);
    // Compute model bounding box once after load — used to clamp pan in the
    // tick loop. The mat-cache node(s) are temporarily detached JUST for
    // this calculation (Box3.setFromObject() includes invisible descendants
    // too, and this mesh sits far below the real model — including it would
    // badly distort the pan-clamp bounds) then immediately reattached to
    // their original parents right after, so they're back in the scene
    // graph for whatever later code needs them reachable.
    const _wceMatCacheParents = _wceMatCacheNodes.map(o=>o.parent);
    _wceMatCacheNodes.forEach(o=>{ if(o.parent) o.parent.remove(o); });
    const _modelBox=new THREE.Box3().setFromObject(root);
    _wceMatCacheNodes.forEach((o,i)=>{ if(_wceMatCacheParents[i]) _wceMatCacheParents[i].add(o); });
    if(_modelBox.isEmpty()){
      // No actual geometry in the scene at all — Box3 represents "empty" as
      // an Infinity/-Infinity sentinel, which would otherwise corrupt the
      // camera's real position the instant pan-clamping ever ran. Leaving
      // _panMin/_panMax at null (their existing default) simply disables
      // pan-clamping entirely rather than computing garbage bounds from it.
      _panMin=null; _panMax=null;
    } else {
      _panMin=_modelBox.min.clone(); _panMax=_modelBox.max.clone();
      const _panMargin=Math.max((CFG.camera&&CFG.camera.zoom_min)??2,(_panMax.x-_panMin.x)*0.25);
      _panMin.x-=_panMargin; _panMin.z-=_panMargin;
      _panMax.x+=_panMargin; _panMax.z+=_panMargin;
      _panMin.y=FLOOR_Z;
      _panMax.y=(ROOF_Z!=null?ROOF_Z:_panMax.y+_panMargin);
    }
    if(!_modelBox.isEmpty()) _wceInitSectionView(_modelBox);
    try{
      const allMats=await gltf.parser.getDependencies('materials');
      const sR=['map','emissiveMap','sheenColorMap','specularColorMap'];
      const lR=['normalMap','roughnessMap','metalnessMap','aoMap','displacementMap','alphaMap',
                'sheenRoughnessMap','transmissionMap','thicknessMap','clearcoatMap',
                'clearcoatNormalMap','clearcoatRoughnessMap'];
      allMats.forEach(m=>{
        if(m?.name) matMap[m.name]=m;
        if(m){sR.forEach(k=>{if(m[k])m[k].colorSpace=THREE.SRGBColorSpace;});
               lR.forEach(k=>{if(m[k])m[k].colorSpace=THREE.LinearSRGBColorSpace;});}
      });
    }catch(e){console.warn('[WCE] prefetch materials:',e);}

    root.traverse(o=>{
      if(o.isMesh){
        o.castShadow=true;o.receiveShadow=true;
        
        // --- NEW BVH LOGIC START ---
        const isSkinned = o.isSkinnedMesh;
        const hasShapeKeys = o.morphTargetInfluences && o.morphTargetInfluences.length > 0;
        if(isSkinned || hasShapeKeys){
          // Deforming mesh: Skip BVH, use native dynamic raycaster
          _occluderMeshes.push(o);
        } else {
          // Rigid mesh: Build static BVH tree for zero-lag occlusion
          o.geometry.computeBoundsTree();
          _occluderMeshes.push(o);
        }
        // --- NEW BVH LOGIC END ---

        const ms=Array.isArray(o.material)?o.material:[o.material];
        if(!o.userData.origMatNames) o.userData.origMatNames=ms.map(m=>m?.name||'');
        const hasAO=o.geometry&&o.geometry.hasAttribute('color');
        ms.forEach(m=>{
          if(m?.name) matMap[m.name]=m;
          if(m){
            ['map','emissiveMap'].forEach(k=>{if(m[k])m[k].colorSpace=THREE.SRGBColorSpace;});
            ['normalMap','roughnessMap','metalnessMap'].forEach(k=>{if(m[k])m[k].colorSpace=THREE.LinearSRGBColorSpace;});
            if(m.vertexColors!==hasAO){m.vertexColors=hasAO;m.needsUpdate=true;}
          }
        });
      }
      if(o.isLight){
        o.intensity = o.intensity / WCE_LIGHT_INTENSITY_DIVISOR;
        const _shadowCfg = (CFG.light_shadows||{})[o.name];
        o.castShadow = (_shadowCfg!=null) ? !!_shadowCfg : true;
        if(o.shadow){o.shadow.mapSize.set(1024,1024);o.shadow.bias=-0.001;o.shadow.normalBias=0.02;}
      }
    });

    (CFG.area_lights||[]).forEach(al=>{
      const light=new THREE.RectAreaLight(new THREE.Color(...al.color),al.intensity,al.width,al.height);
      light.name=al.name;light.position.set(...al.position);
      if(al.quaternion) light.quaternion.set(...al.quaternion);
      else if(al.rotation) light.rotation.set(...al.rotation); // legacy config fallback
      // al.rig is missing on config.json exported before this fix — treat
      // that as "unknown rig", kept always-on so old exports keep working
      // exactly as before rather than suddenly going dark.
      light.userData.wceRig=al.rig||null;
      scene.add(light);
      _areaLights.push(light);
    });
    // The earlier _applyEnvironmentAndLight(_initHdri) call (page-load time)
    // ran before any area lights above existed yet — its own area-light
    // visibility loop iterated a still-empty _areaLights array and did
    // nothing at all. Three.js defaults a newly-created light to visible,
    // so without re-applying here, the very first render would show every
    // area light regardless of which one the active environment actually
    // calls for, correcting itself only once a visitor switches environments
    // for the first time.
    _applyEnvironmentAndLight(_initHdri);

    _initAnimMixers(gltf);
    // ── Snap all controls/combos to their configured default_state HERE —
    // before hide() is called, while the loader is definitely still covering
    // the screen. This ensures the model is always revealed in the correct
    // pose with no visible jump or transition from state 0.
    _applyDefaultAnimStates();
    _initCinematicMixers(gltf);
    _initImageTriggers();
    _initHotspots();
    // A failure in here must never be able to block hide() below, or the
    // globals ui.js depends on from being exposed — that would silently
    // break the entire page (hotspots included), not just annotations.
    try{ _initAnnotations(); }catch(e){ console.error('[WCE] Annotations failed to initialize:', e); }

    // Debug handle: inspect from the browser console, e.g.
    //   WCE.CFG.animations.combos   |   Object.keys(WCE.animMixers)   |   WCE.trigger('Part_0')
    try{ window.WCE={
      CFG, animMixers, animClips, animState,
      hoverClips:()=>({rise:_hoverRiseClip&&_hoverRiseClip.name,loop:_hoverLoopClip&&_hoverLoopClip.name,on:_hoverOn}),
      trigger:triggerAnim, gltf
    }; }catch(e){}

    // Pre-compile the alphaHash dissolve-transition shader (used by Geo
    // Toggle and Flicker) now, while a wait is already expected — shader
    // compilation is a genuinely blocking, synchronous WebGL cost, and
    // paying it here instead of on the visitor's first Flicker/Toggle click
    // is what fixes the one-time freeze-then-fine behavior those had.
    // A throwaway scene/mesh, never added to the real graph — this only
    // needs to prime the renderer's program cache, not render anything.
    try{
      const _wmMat=new THREE.MeshStandardMaterial();
      _wmMat.alphaHash=true; _wmMat.transparent=false; _wmMat.depthWrite=true;
      _wmMat.opacity=0.5; _wmMat.needsUpdate=true;
      const _wmGeo=new THREE.BoxGeometry(0.001,0.001,0.001);
      const _wmMesh=new THREE.Mesh(_wmGeo,_wmMat);
      const _wmScene=new THREE.Scene(); _wmScene.add(_wmMesh);
      renderer.compile(_wmScene, cam);
      _wmGeo.dispose(); _wmMat.dispose();
    }catch(e){ console.warn('[WCE] dissolve shader warm-up:', e); }

    prog(100,'READY');hide();

    // Play from Startup: fire each configured control/combo's first
    // transition 5s after the canvas becomes visible — not immediately,
    // since hide()'s own reveal transition and the first few real frames
    // (camera settling, environment fade-in, etc.) hadn't actually finished
    // yet, so the animation was starting before the visitor could see it
    // begin. triggerAnim() itself already knows whether Keep Playing is
    // also on for this one — if so, this single call correctly starts the
    // continuous loop instead of just a single step, with no special-
    // casing needed here.
    //
    // play_from_startup_mobile is a per-animation opt-out for phones
    // specifically (matching the same hover-capability signal used
    // elsewhere to distinguish touch devices) — !== false rather than a
    // plain truthy check so older exports without this field at all (from
    // before it existed) still default to firing on phones too, matching
    // the Blender-side property's own default.
    const _wceIsPhoneStartup = !window.matchMedia('(hover: hover)').matches;
    setTimeout(()=>{
      allAnimDefs().forEach(_wceDef=>{
        if(_wceDef.play_from_startup && (!_wceIsPhoneStartup || _wceDef.play_from_startup_mobile!==false)) triggerAnim(_wceDef.name);
      });
      (CFG.mat_animations||[]).forEach(_wceDef=>{
        if(_wceDef.play_from_startup && (!_wceIsPhoneStartup || _wceDef.play_from_startup_mobile!==false)) triggerMatGeoAnim('MAT', _wceDef.source_key);
      });
      (CFG.geo_animations||[]).forEach(_wceDef=>{
        if(_wceDef.play_from_startup && (!_wceIsPhoneStartup || _wceDef.play_from_startup_mobile!==false)) triggerMatGeoAnim('GEO', _wceDef.source_key);
      });
    }, 5000);

    // Default geo must be applied AFTER applyVariant / refreshAdvMat —
    // applyVariant walks geometry_exposed and would overwrite it otherwise.

    // ── Expose all globals ui.js needs BEFORE ensureGeoDefaults runs ─────────
    window.CFG=CFG; window.varData=varData; window.root=root; window.WCE_OVERLAYS=WCE_OVERLAYS;
    window.scene=scene; window.WCE_THEME=WCE_THEME; window.WCE_PROFILES=WCE_PROFILES; window.WCE_THUMBNAIL_GROUPS=WCE_THUMBNAIL_GROUPS;
    window.matSt=matSt; window.geoSt=geoSt; window.animState=animState;
    window.camCfg=camCfg; window._TRANS=_TRANS; window.SFX=SFX;
    window.triggerAnim=triggerAnim; window.flyToAnimState=flyToAnimState; window.flyToCamera=flyToCamera;
    window._isFlyActive=function(){return _flyActive||_flyPending;}; // for sequence poll in ui.js
    window.applyMat=applyMat; window.applyGeoSubset=applyGeoSubset;
    window.applyGeoToggle=applyGeoToggle; window.applyVariant=applyVariant;
    window.applyMatSubset=applyMatSubset; window.refreshActive=refreshActive;
    window.refreshAdvMat=refreshAdvMat; window.allAnimDefs=allAnimDefs;
    window.findNode=findNode; window._geoDissolveNode=_geoDissolveNode;
    window._loadHDRIItem=_loadHDRIItem;
    window._wceApplyPPFilter=_wceApplyPPFilter;
    window._registerHotspot=_registerHotspot;
    window._startCinematic=_startCinematic; window._stopCinematic=_stopCinematic;
    window._startTurntable=_startTurntable; window._stopTurntable=_stopTurntable;
    window.scene=scene; window.renderer=renderer; window._ambientLight=_ambientLight;
    try{Object.defineProperty(window,'_cinematicPlaying',{get:()=>_cinematicPlaying,set:v=>{_cinematicPlaying=v;},configurable:true});}catch(e){}
    try{Object.defineProperty(window,'_turntableActive',{get:()=>_turntableActive,set:v=>{_turntableActive=v;},configurable:true});}catch(e){}
    try{Object.defineProperty(window,'_hdriActiveFile',{get:()=>_hdriActiveFile,set:v=>{_hdriActiveFile=v;},configurable:true});}catch(e){}
    (function ensureGeoDefaults(){
      const exposed=CFG.geometry_exposed||{};
      const norm=n=>n.replace(/^GEOMETRIES_/i,'').toLowerCase();
      const chosen=new Set(Object.values(CFG.default_geo_state||{}).map(v=>norm(String(v))));
      function walk(pN,tree){
        const ch=(tree.children||[]).filter(c=>!c.name.toLowerCase().includes('common'));
        if(ch.length>1&&!ch.some(c=>chosen.has(norm(c.name))))
          applyGeoToggle(ch[0].name,ch.map(c=>c.name));
        (tree.children||[]).forEach(c=>{if(c.children?.length) walk(c.name,c);});
      }
      Object.entries(exposed).forEach(([pN,tree])=>walk(pN,tree));
    })();

    window._wce={CFG,matMap,cloneCache,varData};

    try{
      if(CFG.containers_all)
        // Every container's first material applies as a starting default
        // here, regardless of whether its picker is exposed in the
        // sidebar — a hidden container's part has no other real
        // material to fall back to (its Blender-side material is just
        // a pass-through placeholder), so without this it would show
        // nothing at all rather than its first real option.
        Object.entries(CFG.containers_all).forEach(([c,vals])=>{if(vals?.length) matSt[c]=vals[0];});
      const allSubs=[...(CFG.mat_subsets||[]),(CFG.global_mat_sets||[])].flat();
      // Each category resolves its own default independently and they
      // apply here in the artist-controlled priority order -- later
      // entries overwrite earlier ones for any container they both
      // touch, which is the whole mechanism for resolving two
      // categories that both claim the same part (e.g. Monotone vs
      // Bitone both setting the body): whichever is later in the list
      // wins for that container, deterministically, every load.
      (CFG.default_mat_subsets||[]).forEach(dms=>{
        const sub=allSubs.find(s=>s.name===dms.name&&s.category===dms.category);
        if(sub) Object.assign(matSt,sub.state);
      });
      Object.entries(matSt).forEach(([c,m])=>applyMat(c,m));
      buildUI();
      if(window.WCE_OFFLINE_PREVIEW){
        _wceStatsInitUI();
        _wceInitVariantSwitcher();
      }
      // Apply defaults in order — all state must be settled before marking buttons.
      const dv=CFG.default_variant&&varData[CFG.default_variant]?CFG.default_variant:null;
      if(dv) applyVariant(dv); else refreshAdvMat(matSt);
      if(CFG.default_geo_state&&Object.keys(CFG.default_geo_state).length){
        applyGeoSubset(CFG.default_geo_state);
        if(typeof buildAdvGeo==='function') buildAdvGeo();
      }
      if(typeof refreshActive==='function') refreshActive();
      if(typeof refreshAdvMat==='function') refreshAdvMat(matSt);
      // Mark default mat-subset pills — one per category now, match name
      // AND category to avoid highlighting all pills named e.g. "GREY"
      // across different categories.
      (CFG.default_mat_subsets||[]).forEach(dms=>{
        document.querySelectorAll('.pb2[data-sc]').forEach(b=>{
          if(b.textContent.trim()===dms.name && b.dataset.sc===dms.category)
            b.classList.add('active');
        });
      });
      // Mark default geo-package pill: compare package state dict directly
      // against CFG.default_geo_state (same format) — reliable, no geoSt key mismatch.
      (CFG.geometry_subsets||[]).forEach((gpkg,gi)=>{
        const pst=gpkg.state||{};
        const dst=CFG.default_geo_state||{};
        if(!Object.keys(pst).length) return;
        const match=Object.entries(pst).every(([p,c])=>dst[p]===c);
        if(match){ const b=document.querySelector(`.pb2[data-gi="${gi}"]`); if(b) b.classList.add('active'); }
      });
      // Mark active HDRI button.
      document.querySelectorAll('.pb2[data-hf]').forEach(b=>{
        const isActive=b.dataset.hf===_hdriActiveFile
          ||(!_hdriActiveFile&&(CFG.hdris||[]).find(h=>h.default)?.file===b.dataset.hf);
        b.classList.toggle('active',!!isActive);
      });
      root.visible=true;
      requestRender(1000);   // ensure the freshly-loaded model is drawn
    }catch(uiErr){console.error('[WCE] UI error:',uiErr);stEl.textContent='UI ERROR';}
}

// Converts a variant name ('current'/'high'/'medium'/'low'/'verylow') into
// its actual file path. 'current' is the one irregular case — it's the
// plain default model file at the export root (or Normal subfolder), not a
// per-variant subfolder pattern like the other four. Folder names are an
// explicit map, not a generic capitalize-first-letter transform — 'verylow'
// needs "VeryLow" (capital L too), which a generic transform would get wrong.
const _WCE_VARIANT_FOLDER_NAMES = {high:'High', medium:'Medium', low:'Low', verylow:'VeryLow'};
function _wceVariantPath(variant){
  if(variant === 'current') return 'Medium/915092e5e08d_medium.gltf';
  const token = CFG.model_token || 'Medium/915092e5e08d_medium.gltf'.replace(/^.*\//,'').replace(/\.[^.]+$/,'');
  const ext = CFG.model_ext || 'Medium/915092e5e08d_medium.gltf'.split('.').pop();
  const folderName = _WCE_VARIANT_FOLDER_NAMES[variant] || (variant.charAt(0).toUpperCase()+variant.slice(1));
  return folderName+'/'+token+'_'+variant+'.'+ext;
}

// ── Performance Stats Overlay ─────────────────────────────────────────────
// FPS/frame-time are measured directly via performance.now() deltas between
// frames — fully accurate, the same technique tools like stats.js use. CPU
// is the fraction of each frame's time budget actually spent doing work on
// the main thread (rendering + everything else in tick()) versus idle — a
// real, measured signal, not an estimate. GPU is the render-command
// execution time reported by the browser's own WebGL timer query extension
// where the browser supports it (inconsistent across browsers — some have
// deprecated it over timing-attack security concerns, so this always shows
// "unavailable" rather than a fake number when unsupported).
//
// Display refresh is throttled independently of frame-data collection — the
// graph buffer collects a new sample every single frame (so the graph line
// itself stays smooth and accurate), but the TEXT (FPS/ms/CPU/GPU numbers)
// only actually repaints roughly every 350ms, since repainting numbers on
// every rendered frame updates far faster than is actually readable.
const _WCE_STATS_TEXT_REFRESH_MS = 350;
let _wceStatsLastTextUpdate = 0;

function _wceStatsInitUI(){
  const btn = document.createElement('button');
  btn.id = 'wce-stats-toggle';
  btn.textContent = 'Show Statistics';
  _wceStatsApplyWinButtonStyle(btn);
  document.body.appendChild(btn);

  const panel = document.createElement('div');
  panel.id = 'wce-stats-panel';
  panel.style.cssText = 'position:fixed;z-index:10000;'+
    'background:rgba(240,240,240,.97);color:#111;border:1px solid #888;border-radius:4px;'+
    'padding:10px;font-family:Arial,Helvetica,sans-serif;font-size:12px;width:220px;display:none;'+
    'box-shadow:0 2px 8px rgba(0,0,0,.3);';
  panel.innerHTML =
    '<div id="wce-stats-drag" style="display:flex;justify-content:space-between;margin-bottom:8px;cursor:move;user-select:none;font-weight:bold">'+
      '<span>Performance</span>'+
      '<span id="wce-stats-close" style="cursor:pointer;padding:0 4px">✕</span>'+
    '</div>'+
    '<canvas id="wce-stats-graph" width="196" height="46" style="width:100%;display:block;background:#000;border-radius:2px;margin-bottom:8px"></canvas>'+
    '<div id="wce-stats-fps" style="font-size:20px;font-weight:bold;line-height:1.2"></div>'+
    '<div id="wce-stats-frametime" style="color:#555;margin-bottom:4px"></div>'+
    '<div id="wce-stats-cpu" style="color:#333"></div>'+
    '<div id="wce-stats-gpu" style="color:#333"></div>'+
    '<div id="wce-stats-render" style="color:#333;margin-top:4px;border-top:1px solid #ccc;padding-top:4px"></div>';
  document.body.appendChild(panel);

  // Default positions — button top-left, panel just below it.
  btn.style.left='16px'; btn.style.top='16px';
  panel.style.left='16px'; panel.style.top='56px';

  function _wceOpenPanel(){
    panel.style.display = 'block';
    _wceStats.enabled = true;
    _wceStats.frameTimes = []; _wceStats.lastFrameStart = null;
    sessionStorage.setItem('wce_stats_open', '1');
  }
  function _wceClosePanel(){
    panel.style.display = 'none';
    _wceStats.enabled = false;
    sessionStorage.removeItem('wce_stats_open');
  }

  btn.addEventListener('click', ()=>{
    if(btn.dataset.wceDragged === '1'){ btn.dataset.wceDragged=''; return; }   // a drag isn't a click
    const showing = panel.style.display !== 'none';
    if(showing) _wceClosePanel(); else _wceOpenPanel();
  });
  document.getElementById('wce-stats-close').onclick = _wceClosePanel;

  // Both draggable, moving as ONE linked pair — dragging either element
  // keeps their relative offset, so grabbing the button drags the panel
  // with it and vice versa, per the requested behavior.
  _wceStatsMakeDraggablePair(btn, panel);

  // Auto-reopens after a variant-switch page reload — sessionStorage
  // survives a full reload (unlike in-memory JS state), which a fresh
  // page load otherwise has no way to know about. This is the site's own,
  // independent exported output — a different context from Claude.ai's
  // own artifact-preview sandbox, where browser storage is disallowed.
  if(sessionStorage.getItem('wce_stats_open') === '1') _wceOpenPanel();
}

function _wceStatsApplyWinButtonStyle(btn){
  btn.style.cssText = 'position:fixed;z-index:10001;'+
    'font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#000;'+
    'background:linear-gradient(to bottom,#f5f5f5,#e1e1e1);'+
    'border:1px solid #adadad;border-radius:2px;'+
    'padding:6px 12px;cursor:move;user-select:none;'+
    'box-shadow:inset 1px 1px 0 #fff, 1px 1px 2px rgba(0,0,0,.15);';
  btn.addEventListener('mousedown', ()=>{ btn.style.background='linear-gradient(to bottom,#e1e1e1,#d0d0d0)'; });
  window.addEventListener('mouseup', ()=>{ btn.style.background='linear-gradient(to bottom,#f5f5f5,#e1e1e1)'; });
}

function _wceStatsMakeDraggablePair(btn, panel){
  let dragging=false, lastX=0, lastY=0, moved=false;
  function onDown(e){
    dragging=true; moved=false; lastX=e.clientX; lastY=e.clientY;
    e.preventDefault();
  }
  btn.addEventListener('pointerdown', onDown);
  document.addEventListener('pointerdown', e=>{
    if(e.target.closest && e.target.closest('#wce-stats-drag')) onDown(e);
  });
  window.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const dx=e.clientX-lastX, dy=e.clientY-lastY;
    if(Math.abs(dx)>2 || Math.abs(dy)>2) moved=true;
    lastX=e.clientX; lastY=e.clientY;
    [btn, panel].forEach(el=>{
      const r=el.getBoundingClientRect();
      el.style.left=(r.left+dx)+'px'; el.style.top=(r.top+dy)+'px';
    });
  });
  window.addEventListener('pointerup', ()=>{
    if(dragging && moved) btn.dataset.wceDragged='1';   // suppress the click that follows a real drag
    dragging=false;
  });
}

function _wceStatsRenderOverlay(){
  const canvas = document.getElementById('wce-stats-graph');
  if(!canvas) return;   // panel not yet built

  // Graph redraws every frame for smooth motion — only the text below is
  // throttled, since a scrolling line reads fine at full frame rate but
  // rapidly-changing numbers don't.
  const ctx = canvas.getContext('2d');
  const w=canvas.width, h=canvas.height;
  ctx.clearRect(0,0,w,h);
  const samples = _wceStats.frameTimes;
  if(samples.length>=2){
    const maxMs = Math.max(33, ...samples);
    const y60 = h - Math.min(1, 16.67/maxMs)*h;
    ctx.strokeStyle='rgba(0,0,0,.2)'; ctx.lineWidth=1; ctx.beginPath();
    ctx.moveTo(0,y60); ctx.lineTo(w,y60); ctx.stroke();
    ctx.strokeStyle='#2ecc40'; ctx.lineWidth=1.5; ctx.beginPath();
    samples.forEach((v,i)=>{
      const x=(i/(samples.length-1))*w, y=h-Math.min(1,v/maxMs)*h;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
  }

  const now = performance.now();
  if(now - _wceStatsLastTextUpdate < _WCE_STATS_TEXT_REFRESH_MS) return;
  _wceStatsLastTextUpdate = now;

  const fpsEl = document.getElementById('wce-stats-fps');
  const fps = Math.round(_wceStats.fps);
  fpsEl.textContent = fps+' FPS';
  fpsEl.style.color = fps>=50 ? '#1a8a1a' : (fps>=30 ? '#c98a00' : '#c0392b');
  document.getElementById('wce-stats-frametime').textContent = _wceStats.frameTimeMs.toFixed(2)+' ms/frame';
  document.getElementById('wce-stats-cpu').textContent = 'CPU: '+_wceStats.cpuPct.toFixed(1)+'%';
  document.getElementById('wce-stats-gpu').textContent = _wceStats.gpuSupported
    ? ('GPU: '+(_wceStats.gpuMs!=null ? _wceStats.gpuMs.toFixed(2)+' ms' : '—'))
    : 'GPU: unavailable in this browser';
  // Three.js's own built-in counters — free to read, no extra render cost.
  // Calls is the actual draw call count for the last frame; geometries/
  // textures are how many currently live in GPU memory (both drop when
  // something gets disposed, e.g. an old material-clone swap).
  const _ri = renderer.info;
  document.getElementById('wce-stats-render').innerHTML =
    'Draw calls: '+_ri.render.calls+'<br>'+
    'Triangles: '+_ri.render.triangles.toLocaleString()+'<br>'+
    'Geometries: '+_ri.memory.geometries+' &nbsp; Textures: '+_ri.memory.textures;
}

// ── Top-center variant switcher ───────────────────────────────────────────
// Fully independent of the Statistics panel — switching variants never
// requires opening it. Every tier always shows in the same fixed layout;
// whichever weren't actually checked for this export appear visibly
// disabled/greyed rather than being omitted, keeping the layout consistent
// export to export. Clicking a variant does a genuine page reload with
// ?preview_variant=<key> — reusing the exact same, already-correct
// initialization path a fresh page load goes through, rather than trying
// to patch materials/armatures/textures into an already-running scene.
function _wceInitVariantSwitcher(){
  const available = CFG.available_variants || ['current'];
  const tiers = [
    {key:'current', label:'Highest'},
    {key:'high',    label:'High'},
    {key:'medium',  label:'Medium'},
    {key:'low',     label:'Low'},
    {key:'verylow', label:'Very Low'},
  ];
  const params = new URLSearchParams(window.location.search);
  const activeVariant = params.get('preview_variant') || 'current';

  const bar = document.createElement('div');
  bar.id = 'wce-variant-switcher';
  bar.style.cssText = 'position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:10000;'+
    'display:flex;gap:6px;font-family:Arial,Helvetica,sans-serif;';

  let dragging=false, moved=false, lastX=0, lastY=0;
  function onDown(e){
    dragging=true; moved=false; lastX=e.clientX; lastY=e.clientY;
    // Once dragged, positioning switches to plain left/top — the initial
    // centering transform only makes sense before the user has ever moved it.
    if(bar.style.transform){
      const r = bar.getBoundingClientRect();
      bar.style.transform = ''; bar.style.left=r.left+'px'; bar.style.top=r.top+'px';
    }
  }
  window.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const dx=e.clientX-lastX, dy=e.clientY-lastY;
    if(Math.abs(dx)>2 || Math.abs(dy)>2) moved=true;
    lastX=e.clientX; lastY=e.clientY;
    const r=bar.getBoundingClientRect();
    bar.style.left=(r.left+dx)+'px'; bar.style.top=(r.top+dy)+'px';
  });
  window.addEventListener('pointerup', ()=>{ dragging=false; });

  tiers.forEach(t=>{
    const isAvailable = available.includes(t.key);
    const isActive = t.key === activeVariant;
    const b = document.createElement('button');
    b.textContent = t.label;
    b.disabled = !isAvailable;
    // Windows-button look, adapted per state: active = pressed-in (darker,
    // inset shadow), available = standard raised button, disabled = flat,
    // muted — matching how Windows itself renders a disabled control.
    if(!isAvailable){
      b.style.cssText = 'padding:6px 12px;font-size:11px;border-radius:2px;cursor:not-allowed;'+
        'font-family:Arial,Helvetica,sans-serif;color:#999;background:#e8e8e8;border:1px solid #ccc;';
    } else if(isActive){
      b.style.cssText = 'padding:6px 12px;font-size:11px;border-radius:2px;cursor:move;'+
        'font-family:Arial,Helvetica,sans-serif;color:#000;'+
        'background:linear-gradient(to bottom,#d8d8d8,#c3c3c3);border:1px solid #999;'+
        'box-shadow:inset 1px 1px 2px rgba(0,0,0,.25);';
    } else {
      b.style.cssText = 'padding:6px 12px;font-size:11px;border-radius:2px;cursor:move;'+
        'font-family:Arial,Helvetica,sans-serif;color:#000;'+
        'background:linear-gradient(to bottom,#f5f5f5,#e1e1e1);border:1px solid #adadad;'+
        'box-shadow:inset 1px 1px 0 #fff, 1px 1px 2px rgba(0,0,0,.15);';
    }
    b.addEventListener('pointerdown', onDown);   // every button can drag the bar, disabled or not
    if(isAvailable){
      b.addEventListener('click', ()=>{
        if(moved) return;   // a drag isn't a click — the pointerup handler already stopped the drag
        if(isActive) return;
        const url = new URL(window.location.href);
        if(t.key==='current') url.searchParams.delete('preview_variant');
        else url.searchParams.set('preview_variant', t.key);
        window.location.href = url.toString();
      });
    }
    bar.appendChild(b);
  });
  document.body.appendChild(bar);
}

// Two-stage mobile detection, shared by the variant-tier cap below and the
// phone/tablet zoom lock: touch alone is NOT enough — a touch-enabled
// Windows/macOS laptop still has a real desktop-class GPU and a mouse or
// trackpad it can fall back on, so it must never get bucketed the same way
// a phone or tablet does. Test 1 (hover) already excludes those laptops in
// the overwhelming majority of cases (their trackpad/mouse reports real
// hover support even with a touchscreen present) — Test 2 (OS) is the
// backstop for the remaining edge cases (e.g. a 2-in-1 currently in tablet
// mode with no pointer attached), so only a device that BOTH lacks hover
// AND is actually running a mobile OS ever counts as mobile. iPads/Android
// tablets deliberately land in the same bucket as phones here — they don't
// have real discrete/desktop-class GPUs either, so the same caps apply.
function _wceIsMobileOS(){
  const ua = navigator.userAgent || '';
  if(/Android/i.test(ua)) return true;
  if(/iPhone|iPod|iPad/i.test(ua)) return true;
  // Modern iPadOS (13+) masquerades as desktop Safari on "Macintosh" in the
  // UA string — a real Mac never reports multi-touch, so that's the only
  // remaining way to tell them apart.
  if(navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) return true;
  return false;
}
function _wceIsMobileDevice(){
  const hasHover = window.matchMedia('(hover: hover)').matches;
  if(hasHover) return false;   // Test 1: real hover present — a capable laptop/desktop, touchscreen or not
  return _wceIsMobileOS();     // Test 2: no hover — only actually mobile if the OS agrees
}

// Heuristic only — there's no reliable way to read a visitor's actual GPU
// strength from the browser. Touch-only (no real hover) is the strongest
// available signal for phone/tablet; CPU core count is broadly supported;
// device memory is Chrome/Edge-only (undefined elsewhere), so it can only
// ever refine the guess, never be depended on alone.
//
// Score-based, not fixed thresholds: a hardcoded set of cutoffs (e.g. "≤4
// cores → Medium, >4 → Default") silently breaks depending on which
// variants happen to be checked for a given export — a tier the thresholds
// never produce as an output is unreachable even if it was exported, and
// which tier that is changes depending on the combination. Computing a
// continuous 0-100 score and distributing it evenly across however many
// variants are ACTUALLY available guarantees every checked combination is
// fully reachable, regardless of which subset of Default/High/Medium/Low/
// Very Low that turns out to be.
function _wceDetectDeviceTier(){
  const cores = navigator.hardwareConcurrency || 4;
  const mem = navigator.deviceMemory;   // undefined on Safari/Firefox

  let score = Math.min(100, Math.max(0, (cores-2)/(16-2)*100));
  if(mem !== undefined){
    const memScore = Math.min(100, Math.max(0, (mem-2)/(16-2)*100));
    score = (score+memScore)/2;
  }

  const order = ['verylow','low','medium','high','current'];
  let eligible = order.filter(v => (CFG.available_variants||['current']).includes(v));
  if(eligible.length === 0) eligible = ['current'];

  // Genuinely mobile devices (phones/tablets — see _wceIsMobileDevice above)
  // never exceed Medium — capped here regardless of score, not by clamping
  // the score itself, so a mobile device with a high capability score still
  // lands on the BEST tier available up to (and never past) Medium, rather
  // than being pushed toward Low/Very Low unnecessarily.
  if(_wceIsMobileDevice()){
    const mIdx = eligible.indexOf('medium');
    if(mIdx !== -1) eligible = eligible.slice(0, mIdx+1);
    else eligible = eligible.filter(v => v === 'low' || v === 'verylow');
    if(eligible.length === 0) eligible = [order.filter(v=>(CFG.available_variants||['current']).includes(v))[0]];
  }

  const bucket = 100/eligible.length;
  const idx = Math.min(eligible.length-1, Math.floor(score/bucket));
  return eligible[idx];
}

// View Online can pass ?preview_variant=high/medium/low/current to force a
// specific variant for manual preview — takes priority over auto-detection
// whenever present. With no override (a real visitor, not a preview
// session), the variant is chosen automatically from detected device
// capability instead. _wceDetectDeviceTier() already only ever selects from
// CFG.available_variants, so its result is always valid — no separate
// fallback/re-check needed on top of it.
function _wceResolveModelFile(){
  const params = new URLSearchParams(window.location.search);
  const forced = params.get('preview_variant');
  const variant = forced ? forced : _wceDetectDeviceTier();
  return _wceVariantPath(variant);
}
const _actualModelFile = _wceResolveModelFile();

if(window.WCE_DESIGNER_MODE){
  // UI Designer mode: skip the (potentially large/slow) model fetch entirely
  // and hand _onModelLoaded an empty stand-in scene graph instead. Every
  // downstream call already tolerates findNode() returning nothing, so the
  // full sidebar/default-state logic still runs — just with no mesh to touch.
  // The canvas is hidden and replaced with a plain gradient so styling work
  // isn't blocked on (or slowed down by) the real geometry loading.
  document.documentElement.style.background='linear-gradient(160deg,#ffffff,#eef0f3)';
  document.body.style.background='linear-gradient(160deg,#ffffff,#eef0f3)';
  if(canvas) canvas.style.display='none';
  const _stubGltf={scene:new THREE.Group(), parser:{getDependencies:async()=>[]}, animations:[]};
  _onModelLoaded(_stubGltf);
} else {
  loader.load(_actualModelFile,
    _onModelLoaded,
    e=>{
      if(e.total&&e.total>0) prog(25+Math.round(Math.min(1,e.loaded/e.total)*69),'LOADING MODEL');
      else prog(50,'LOADING MODEL…');
    },
    _onLoadError
  );
}

// ── SCENE HELPERS ────────────────────────────────────────────────────────

function findNode(name){
  let res=null;
  const s=name.replace(/ /g,'_');
  if(root) root.traverse(o=>{if(o.name===name||o.name===s) res=o;});
  return res;
}

// GEO_TOGGLE/GEO_FLICKER need this fallback specifically for Area lights:
// findNode() only searches inside root (the glTF model's own hierarchy), but
// Area lights are rebuilt as RectAreaLights added directly to the top-level
// scene (see the area_lights loader) — siblings of root, not descendants of
// it, so a plain findNode() call can never see them.
function _findGeoTarget(name){
  const n=findNode(name);
  if(n) return n;
  const s=name.replace(/ /g,'_');
  return _areaLights.find(l=>l.name===name||l.name===s) || null;
}

// ── MATERIAL / VARIANT SYSTEM ────────────────────────────────────────────

function applyVariant(name){
  const d=varData[name];if(!d)return;
  activeV=name;
  qsa('.gb').forEach(x=>x.classList.remove('active'));
  qsa('.pb2[data-sc]').forEach(x=>x.classList.remove('active'));
  qsa('.pb2[data-tp="gp"]').forEach(x=>x.classList.remove('active'));
  const SKIP=['CAMERA_SETTINGS','MAT_SUBSETS','GLOBAL_MAT_SETS','GEO_SETS','LIGHTS','ENVIRONMENTS'];
  const exposed=CFG.geometry_exposed||{};
  Object.entries(d).forEach(([k,v])=>{
    if(!k.startsWith('GEOMETRIES_')||!exposed[k]) return;
    const sv=typeof v==='string'?v.replace(/ /g,'_'):v;
    if(sv==='NONE'||sv===''||sv==null){const n=findNode(k);if(n){n.visible=false;delete geoSt[k];}}
    else{const sib=exposed[k].children.map(c=>c.name);if(sib.length) applyGeoToggle(sv,sib);}
  });
  Object.entries(d).forEach(([k,v])=>{
    if(k.startsWith('GEOMETRIES_')||SKIP.includes(k)) return;
    if(typeof v==='string'&&v&&v!=='NONE'){applyMat(k,v);matSt[k]=v;}
  });
  const gs=Array.isArray(d.GEO_SETS)?d.GEO_SETS:[];
  const sgp=document.getElementById('sgp');
  if(gs.length){
    sgp.innerHTML='<div class="st">Packages</div>';
    const g=mk('div','pg');
    gs.forEach(s=>{const b=mk('button','pb2');b.dataset.tp='gp';b.textContent=s.name;
      b.onclick=()=>{applyGeoSubset(s.state);qsa('.pb2[data-tp="gp"]').forEach(x=>x.classList.remove('active'));b.classList.add('active');};
      g.appendChild(b);});
    sgp.appendChild(g);
  }else buildGeoPkgs();
  const ms=Array.isArray(d.MAT_SUBSETS)?d.MAT_SUBSETS:[];
  const sms=document.getElementById('sms');
  if(ms.length){
    sms.innerHTML='';const byCat={};
    ms.forEach(s=>{(byCat[s.category]=byCat[s.category]||[]).push(s);});
    Object.entries(byCat).forEach(([cat,items])=>{
      const t=mk('div','st');t.textContent=cat;sms.appendChild(t);
      const g=mk('div','pg');
      items.forEach(s=>{const b=mk('button','pb2');b.dataset.sc=cat;b.textContent=s.name;
        b.onclick=()=>{applyMatSubset(s.state);qsa('.gb').forEach(x=>x.classList.remove('active'));
          qsa('.pb2[data-sc]').forEach(x=>x.classList.remove('active'));b.classList.add('active');refreshAdvMat(s.state);};
        g.appendChild(b);});
      sms.appendChild(g);
    });
  }else buildMatSubs();
  document.getElementById('vl').textContent=name.replace(/_/g,' ').toUpperCase();
  stEl.textContent=name;buildAdvGeo();refreshAdvMat(matSt);refreshActive();
}
function applyMatSubset(st){Object.entries(st).forEach(([c,m])=>{applyMat(c,m);matSt[c]=m;});refreshActive();if(typeof _updateAnnotationVisibility==='function')_updateAnnotationVisibility();}
function resolveMatName(n){return(CFG.mat_name_map&&CFG.mat_name_map[n])?CFG.mat_name_map[n]:n;}
const cloneCache={};
function _wceGetMatClone(container,matName,srcMat,resolved,needsAO){
  // AO is baked per-mesh vertex data, entirely independent of which
  // color/option a container is showing — a single container can
  // perfectly well span both AO-baked and non-baked parts at once. So
  // each (container, option) pair gets up to TWO clones here, one for
  // meshes with baked AO and one for meshes without, rather than one
  // shared instance whose vertexColors flag would otherwise have to be
  // fought over by whichever mesh happened to touch it last.
  const key=needsAO?'ao':'plain';
  if(!cloneCache[container]) cloneCache[container]={};
  if(!cloneCache[container][matName]) cloneCache[container][matName]={};
  if(!cloneCache[container][matName][key]){
    const clone=srcMat.clone();
    clone.name=srcMat.name+'__wce_'+container+'_'+matName+(needsAO?'_ao':'');
    clone.vertexColors=needsAO;
    // A freshly-created clone otherwise has no clippingPlanes at all,
    // regardless of whether Section View cuts are already active when a
    // visitor picks a new paint color afterward — _wceSectionRebuild()
    // only ever iterates the meshes that already existed at the time it
    // last ran, so it can't retroactively reach a clone made after it.
    if(typeof _sectionActivePlanes!=='undefined' && _sectionActivePlanes.length) clone.clippingPlanes=_sectionActivePlanes;
    const pbr=(CFG.mat_colors||{})[matName]||(CFG.mat_colors||{})[resolved];
    if(pbr){
      if(pbr.color) clone.color.setRGB(pbr.color[0],pbr.color[1],pbr.color[2]);
      if(pbr.metallic!=null) clone.metalness=pbr.metallic;
      if(pbr.roughness!=null) clone.roughness=pbr.roughness;
      if(pbr.emissive) clone.emissive.setRGB(pbr.emissive[0],pbr.emissive[1],pbr.emissive[2]);
      if(pbr.emissiveIntensity!=null) clone.emissiveIntensity=pbr.emissiveIntensity;
    }
    clone.needsUpdate=true;
    // Snapshot the intended target so transitions always lerp toward the true
    // destination (not a value left over from an interrupted tween).
    clone.userData.wceTarget={
      color:clone.color.clone(),
      metalness:clone.metalness,
      roughness:clone.roughness,
      emissive:(clone.emissive?clone.emissive.clone():new THREE.Color(0,0,0)),
    };
    cloneCache[container][matName][key]=clone;
  }
  return cloneCache[container][matName][key];
}
function applyMat(container,matName){
  // Keep the AR clone's materials in sync with the live root.
  if(typeof _arModel!=='undefined' && _arModel && root){
    const srcM=[]; root.traverse(o=>{if(o.isMesh)srcM.push(o);});
    const dstM=[]; _arModel.traverse(o=>{if(o.isMesh)dstM.push(o);});
    srcM.forEach((sm,i)=>{if(dstM[i])dstM[i].material=sm.material;});
  }
  const resolved=resolveMatName(matName);
  const srcMat=matMap[resolved]||matMap[matName];
  if(!srcMat||!root){
    console.error('[WCE DIAGNOSTIC] applyMat FAILED — container:', container, '| matName:', matName,
      '| resolved:', resolved, '| srcMat found:', !!srcMat, '| root exists:', !!root);
    console.error('[WCE DIAGNOSTIC] available matMap keys ('+Object.keys(matMap).length+'):', Object.keys(matMap).join(' | '));
    return;
  }
  let cu=container.toUpperCase();if(cu.startsWith('MAT_')) cu=cu.slice(4);
  const target='MAT_'+cu;
  function slotMatches(n){const u=n.toUpperCase();return u===target||u.startsWith(target+'.')||u===cu||u.startsWith(cu+'.');}

  // Smooth transition: tween colour/metallic/roughness/emissive from the
  // currently shown material to the target. Snaps if the maps differ (can't
  // lerp across different textures) or if disabled.
  const smooth=!!_TRANS.material;
  let fromMat=null;
  if(smooth){
    root.traverse(o=>{
      if(fromMat||!o.isMesh) return;
      const orig=o.userData.origMatNames||[];
      for(let i=0;i<orig.length;i++){ if(slotMatches(orig[i])){ fromMat=Array.isArray(o.material)?o.material[i]:o.material; break; } }
    });
  }

  // Each mesh gets whichever clone variant (AO or plain) actually matches
  // its own geometry — never one shared instance mutated to fit whichever
  // mesh happened to be processed last.
  const usedClones=new Set();
  root.traverse(o=>{
    if(!o.isMesh) return;
    const orig=o.userData.origMatNames||[];
    const wasArr=Array.isArray(o.material);
    const slots=wasArr?[...o.material]:[o.material];
    let changed=false;
    const hasAO=!!(o.geometry&&o.geometry.hasAttribute('color'));
    for(let i=0;i<orig.length;i++){
      if(slotMatches(orig[i])){
        const clone=_wceGetMatClone(container,matName,srcMat,resolved,hasAO);
        slots[i]=clone;
        usedClones.add(clone);
        changed=true;
      }
    }
    if(changed) o.material=wasArr?slots:slots[0];
  });

  // Tween (or snap) every variant actually in use this call, so whichever
  // clone(s) a visitor's own parts happen to need are all kept in sync.
  usedClones.forEach(m=>{
    if(smooth && fromMat && fromMat!==m && (fromMat.map||null)===(m.map||null)){
      // Same (or no) albedo map → safe to lerp scalar/colour values. Tween from
      // the previously-shown material to this clone's stored target.
      const to=m.userData.wceTarget||{color:m.color.clone(),metalness:m.metalness,roughness:m.roughness,emissive:(m.emissive?m.emissive.clone():new THREE.Color(0,0,0))};
      const from={color:fromMat.color.clone(),metalness:fromMat.metalness,roughness:fromMat.roughness,emissive:(fromMat.emissive?fromMat.emissive.clone():new THREE.Color(0,0,0))};
      // Start at the previous look, then ramp to the target.
      m.color.copy(from.color);
      m.metalness=from.metalness; m.roughness=from.roughness;
      if(m.emissive) m.emissive.copy(from.emissive);
      for(let i=_matTweens.length-1;i>=0;i--) if(_matTweens[i].mat===m) _matTweens.splice(i,1);
      _matTweens.push({mat:m,from,to,t:0,dur:(_TRANS.mat_ms||300)});
      _bumpAnim((_TRANS.mat_ms||300)+150);
    }
  });
}

// ── UI BUILDERS ──────────────────────────────────────────────────────────

// UI builders (buildUI..qsa) -> ui.js
</script>
<script>
/* Same-tab live reload — active only on the local preview server, never on a
   deployed (GitHub Pages) site. Polls the build token ~1×/s and hard-reloads
   this tab when a new export bumps it. */
(function(){
  var host=location.hostname;
  if(host!=='localhost'&&host!=='127.0.0.1') return;
  var tok=null;
  function poll(){
    fetch('/__wce_reload__',{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){
      if(tok===null) tok=t; else if(t!==tok) location.reload();
    }).catch(function(){});
  }
  setInterval(poll,1000); poll();
})();
</script>
