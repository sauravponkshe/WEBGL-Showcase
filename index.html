      el.addEventListener('pointerdown',(e)=>{ e.stopPropagation(); triggerAnim(def.name); });
    });
  });
  [['MAT',(CFG.mat_animations||[])], ['GEO',(CFG.geo_animations||[])]].forEach(([kind,list])=>{
    list.forEach(def=>{
      if(def.trigger_type==='hotspot'&&def.hotspot_position){
        const pos=def.hotspot_position;
        const el=_makeHotspotEl(def.hotspot_color, def.hotspot_scale);
        layer.appendChild(el);
        hotspots.push({name:def.source_key,pos:new THREE.Vector3(pos[0],pos[1],pos[2]),el,px:_hsGlowPx(def.hotspot_scale),op:null,track:_wceResolveTrack(def)});
        el.addEventListener('pointerdown',(e)=>{ e.stopPropagation(); triggerMatGeoAnim(kind, def.source_key); });
      }
      (def.extra_hotspots||[]).forEach((xh,xi)=>{
        if(!xh||!xh.position) return;
        const pos=xh.position;
        const el=_makeHotspotEl(xh.color, xh.scale);
        layer.appendChild(el);
        hotspots.push({name:'__extra_'+def.source_key+'_'+xi,pos:new THREE.Vector3(pos[0],pos[1],pos[2]),el,px:_hsGlowPx(xh.scale),op:null,track:_wceResolveTrack(xh)});
        el.addEventListener('pointerdown',(e)=>{ e.stopPropagation(); triggerMatGeoAnim(kind, def.source_key); });
      });
    });
  });
  // Sequence hotspots
  ((CFG.animations||{}).sequences||[]).forEach(seq=>{   
    if(seq.trigger!=='hotspot'||!seq.hotspot_position) return;
    const pos=seq.hotspot_position;
    const el=_makeHotspotEl(seq.hotspot_color||[1,0.42,0.21], seq.hotspot_scale??0.35);
    layer.appendChild(el);
    hotspots.push({name:'__seq_'+seq.name,pos:new THREE.Vector3(pos[0],pos[1],pos[2]),el,px:_hsGlowPx(seq.hotspot_scale??0.35),op:null,track:_wceResolveTrack(seq)});
    el.addEventListener('pointerdown',(e)=>{ e.stopPropagation(); executeSequence(seq.name); });
  });
  // Cinematic hotspot
  const cin=camCfg.cinematic||{};
  if(cin.trigger==='hotspot'&&cin.hotspot_position){
    const pos=cin.hotspot_position;
    const el=_makeHotspotEl(cin.hotspot_color, cin.hotspot_scale);
    layer.appendChild(el);
    hotspots.push({name:'__cin__',pos:new THREE.Vector3(pos[0],pos[1],pos[2]),el,px:_hsGlowPx(cin.hotspot_scale),op:null,track:_wceResolveTrack(cin)});
    el.addEventListener('pointerdown',(e)=>{ e.stopPropagation(); _cinematicPlaying?_stopCinematic():_startCinematic(); });
  }
}

// ── 3D Annotations — purely informational markers (text or looping video on
// click), never trigger an animation/state change. Reuses the hotspot array's
// existing projection/occlusion tracking in _tickHotspots (proven, already
// optimized for many markers), just with its own quiet-until-hover visual
// style instead of the constant hs-pulse animation, and its own click
// behavior (show a popup) instead of triggering an animation.
const _annotationDefs=[];
let _annotLeaveTimer=null;
function _makeAnnotationEl(a){
  const el=document.createElement('div');
  el.className='annot-marker';
  const px=Math.max(8,(a.size||1)*24);
  el.style.width=px+'px'; el.style.height=px+'px';
  el.style.transform='translate(-50%,-50%)';
  const s=CFG.annotation_popup_style||{};
  const col=s.markerColor||'#c8a96e';
  const glow=s.markerGlow!=null?s.markerGlow:6;
  const bw=s.markerBorderWidth!=null?s.markerBorderWidth:2;
  el.style.background=col;
  el.style.boxShadow=glow>0?('0 0 '+glow+'px '+col):'none';
  el.style.borderWidth=bw+'px';
  el.style.opacity=(s.markerOpacity!=null?s.markerOpacity:100)/100;
  return el;
}
function _closeAnnotationPopup(){
  const p=document.getElementById('annot-popup-active');
  if(p) p.remove();
}
function _showAnnotationPopup(a, el){
  _closeAnnotationPopup();
  const pop=document.createElement('div');
  pop.className='annot-popup'; pop.id='annot-popup-active';
  pop.dataset.forAnnotation=a.name;

  const s=CFG.annotation_popup_style||{};
  const bgOpacity=(s.bgOpacity!=null?s.bgOpacity:92)/100;
  const bgHex=s.bgColor||'#0a0a0c';
  const bgRgb=[1,3,5].map(i=>parseInt(bgHex.substr(i,2),16)||0);
  pop.style.background='rgba('+bgRgb[0]+','+bgRgb[1]+','+bgRgb[2]+','+bgOpacity+')';
  pop.style.borderColor=s.borderColor||'#c8a96e';
  pop.style.borderWidth=(s.borderWidth!=null?s.borderWidth:1)+'px';
  pop.style.borderStyle='solid';
  pop.style.borderRadius=(s.radius!=null?s.radius:6)+'px';
  pop.style.color=s.textColor||'#ffffff';
  pop.style.fontSize=(s.textFontSize!=null?s.textFontSize:14)+'px';
  pop.style.cursor='default';   // avoid the text-select cursor over plain text content

  const canvasEl=document.getElementById('c');
  const canvasRect=canvasEl?canvasEl.getBoundingClientRect():{left:0,top:0,width:innerWidth,height:innerHeight};

  let inner='<div class="annot-popup-close">✕</div>';
  if(a.content_type==='video' && a.video){
    // Sized purely from the Designer's own setting — matches the mock
    // preview exactly, no 3D-object dimension involved at all anymore.
    const vw=(s.videoWidthPct!=null?s.videoWidthPct:26)/100*canvasRect.width;
    pop.style.width=vw+'px';
    pop.style.maxWidth='none';
    inner+='<video src="'+a.video+'" autoplay loop muted playsinline></video>';
  } else if(a.content_type==='image' && a.image){
    const iw=(s.imageWidthPct!=null?s.imageWidthPct:26)/100*canvasRect.width;
    pop.style.width=iw+'px';
    pop.style.maxWidth='none';
    inner+='<img src="'+a.image+'" style="width:100%;height:auto;display:block">';
  } else {
    pop.style.width='';
    pop.style.maxWidth='320px';
    const fs=(s.textFontSize!=null?s.textFontSize:14);
    inner+='<div style="font-size:'+fs+'px">'+(a.text||'').replace(/</g,'&lt;')+'</div>';
  }
  pop.innerHTML=inner;
  document.body.appendChild(pop);

  // Positioned at the marker's own projected screen location.
  const pw=pop.offsetWidth, ph=pop.offsetHeight;
  let left, top;
  if(a.position){
    const v=new THREE.Vector3(a.position[0],a.position[1],a.position[2]).project(cam);
    const sx=canvasRect.left+(v.x*0.5+0.5)*canvasRect.width;
    const sy=canvasRect.top+(-v.y*0.5+0.5)*canvasRect.height;
    left=sx-pw/2; top=sy-ph/2;
  } else {
    // No position resolved (deleted?) — fall back to centered on the canvas.
    left=canvasRect.left+canvasRect.width/2-pw/2;
    top=canvasRect.top+canvasRect.height/2-ph/2;
  }
  left=Math.max(8,Math.min(left,innerWidth-pw-8));
  top=Math.max(8,Math.min(top,innerHeight-ph-8));
  pop.style.left=left+'px'; pop.style.top=top+'px';
  pop.querySelector('.annot-popup-close').addEventListener('click', _closeAnnotationPopup);
  // The popup is a separate element (appended to document.body, not a
  // child of the marker), but it visually sits right on top of it — so it
  // needs to participate in the exact same hover state, not just the
  // marker. Otherwise moving from the marker onto the popup's own text
  // falls into the gap between the two, closes the popup, reveals the
  // marker again underneath, and reopens it — the flicker this was about.
  pop.addEventListener('pointerenter',()=>{
    if(_annotLeaveTimer){ clearTimeout(_annotLeaveTimer); _annotLeaveTimer=null; }
  });
  pop.addEventListener('pointerleave',()=>{
    if(_annotLeaveTimer) clearTimeout(_annotLeaveTimer);
    _annotLeaveTimer=setTimeout(()=>{ _annotLeaveTimer=null; _closeAnnotationPopup(); }, 120);
  });
}
function _stateMatchesSubset(current, subsetState){
  return Object.entries(subsetState||{}).every(([k,v])=>current[k]===v);
}
function _annotationConditionMet(a){
  if(!a.link_type || a.link_type==='none') return true;
  if(a.link_type==='mat_subset' || a.link_type==='global_set'){
    const pool=(CFG.mat_subsets||[]).concat(CFG.global_mat_sets||[]);
    const s=pool.find(x=>x.name===a.link_target);
    return s ? _stateMatchesSubset(matSt, s.state) : false;
  }
  if(a.link_type==='geo_subset'){
    const s=(CFG.geometry_subsets||[]).find(x=>x.name===a.link_target);
    if(!s || !s.state) return false;
    return Object.entries(s.state).every(([parent,child])=>!!geoSt[child.replace(/ /g,'_')]);
  }
  return true;
}
function _updateAnnotationVisibility(){
  _annotationDefs.forEach(({def,hs})=>{
    const visible=_annotationConditionMet(def);
    hs.hidden=!visible;
    if(!visible){ hs.el.style.display='none'; hs.op=0; }
  });
}
function _initAnnotations(){
  const layer=document.getElementById('hotspot-layer');
  if(!layer) return;
  (CFG.annotations||[]).forEach(a=>{
    const pos=a.position;
    const el=_makeAnnotationEl(a);
    layer.appendChild(el);
    const hs={name:'__annot_'+a.name,pos:new THREE.Vector3(pos[0],pos[1],pos[2]),el,px:Math.max(8,(a.size||1)*24),op:null,isAnnotation:true,track:_wceResolveTrack(a)};
    hotspots.push(hs);
    _annotationDefs.push({def:a,hs});
    // Real hover devices (mouse/trackpad) use whichever trigger mode the
    // artist picked (Annotation Popup Style > Interaction) — default is
    // hover, matching the original behavior. Touch devices have no
    // meaningful "hover" state at all — pointerenter/pointerleave behave
    // inconsistently across mobile browsers (may need a tap-and-hold, may
    // never fire leave until tapping elsewhere) — so those always get the
    // tap-to-toggle behavior instead, regardless of what the dropdown says:
    // tap opens it, tap the same marker again closes it, tap anywhere else
    // also closes it.
    const _hasHover = window.matchMedia('(hover: hover)').matches;
    const _annotTriggerMode = (CFG.annotation_popup_style && CFG.annotation_popup_style.triggerMode) || 'hover';
    const _useHover = _hasHover && _annotTriggerMode !== 'click';
    if(_useHover){
      // Debounced leave: the marker's screen position gets recalculated every
      // tick even while fully visible and the camera is nominally still (sub-
      // pixel floating-point/damping jitter is normal) — if the pointer sits
      // right at the marker's edge, that jitter alone can trigger enter/leave
      // repeatedly in the same frame or two, which without this reads as the
      // popup flickering open and shut. A short grace period, cancelled if the
      // pointer re-enters before it fires, absorbs that without adding any
      // perceptible delay to a genuine, deliberate leave. Shared at module
      // scope (_annotLeaveTimer, declared once above) rather than per-marker,
      // so the popup itself (a separate element, appended to document.body,
      // not a child of the marker) can also participate in the same hover
      // state — hovering the popup's own text was otherwise falling into the
      // gap between the two elements, causing the marker's leave/enter to
      // fire back-to-back and the cursor to flicker between text-select and
      // pointer as the popup rapidly closed and reopened underneath it.
      el.addEventListener('pointerenter',()=>{
        if(_annotLeaveTimer){ clearTimeout(_annotLeaveTimer); _annotLeaveTimer=null; }
        _showAnnotationPopup(a, el);
      });
      el.addEventListener('pointerleave',()=>{
        if(_annotLeaveTimer) clearTimeout(_annotLeaveTimer);
        _annotLeaveTimer=setTimeout(()=>{ _annotLeaveTimer=null; _closeAnnotationPopup(); }, 120);
      });
    } else {
      el.addEventListener('click',(e)=>{
        e.stopPropagation();
        const existing=document.getElementById('annot-popup-active');
        const alreadyOpenForThis = existing && existing.dataset.forAnnotation===a.name;
        if(alreadyOpenForThis){
          _closeAnnotationPopup();
        } else {
          _showAnnotationPopup(a, el);
        }
      });
    }
  });
  _updateAnnotationVisibility();
  if(!window._wceAnnotOutsideTapAttached){
    window._wceAnnotOutsideTapAttached=true;
    document.addEventListener('click',(e)=>{
      const pop=document.getElementById('annot-popup-active');
      if(pop && !pop.contains(e.target) && !e.target.closest('.annot-marker')) _closeAnnotationPopup();
    }, true);
  }
}

// Dedicated raycaster for occlusion so we never clobber the pointer raycaster.
const _hsRay=new THREE.Raycaster();
// Metres of slack so the very surface a hotspot sits ON doesn't occlude it,
// while geometry farther in front (e.g. the far side of the car body) does.
const HOTSPOT_OCCLUSION_BIAS=0.12;
const _hsDir=new THREE.Vector3();
const _hsTmpV=new THREE.Vector3(); // pre-alloc: reused every frame instead of .clone()
// Centre + 2 samples (was a 9-point ring). With the temporal smoothing below
// and the ~12 Hz throttle, this looks identical but costs a fraction — each
// sample is a full-model raycast, so fewer samples + lower rate is the fix for
// the orbit-time stutter.
const _HS_SAMPLES=[[0,0]];   // centre only — temporal smoothing covers the rest
const _HS_NDC={x:0,y:0};
const _HS_OCC_INTERVAL_MS=100;  // recompute occlusion at ~10 Hz, not per frame
// Skip the occlusion raycast entirely while the camera is still — a directional
// view's occlusion only changes when the camera moves. This is the big win:
// during a static hold (and with render-on-demand) there are zero raycasts.
let _hsCamX=1e9,_hsCamY=1e9,_hsCamZ=1e9,_hsCamMoved=true;
let _hsFrame=0;

function _hsSampleOccluded(nx,ny,distToHs){
  if(!root||!_occluderMeshes.length) return false;
  _HS_NDC.x=nx; _HS_NDC.y=ny;
  _hsRay.setFromCamera(_HS_NDC,cam);
  _hsRay.far=Math.max(distToHs-HOTSPOT_OCCLUSION_BIAS,0.0001);
  const hits=_hsRay.intersectObjects(_occluderMeshes,false);
  for(const h of hits){
    if(!h.object||h.object.visible===false) continue;
    if(h.object.userData && h.object.userData.wce_no_occlude) continue;
    if(h.distance<distToHs-HOTSPOT_OCCLUSION_BIAS) return true;
  }
  return false;
}

function _tickHotspots(){
  _hsFrame++;
  const W=innerWidth,H=innerHeight;
  // Detect camera movement once per tick (position is enough for occlusion).
  const cp=cam.position;
  _hsCamMoved=(Math.abs(cp.x-_hsCamX)+Math.abs(cp.y-_hsCamY)+Math.abs(cp.z-_hsCamZ))>1e-4;
  if(_hsCamMoved){ _hsCamX=cp.x; _hsCamY=cp.y; _hsCamZ=cp.z; }
  hotspots.forEach((hs,idx)=>{
    if(hs.hidden){ hs.el.style.display='none'; return; }
    // Parented under an animated control at export time — follow the live
    // node instead of a frozen point. Cheap (one matrix-vector multiply),
    // so always done for tracked hotspots regardless of the static-hotspot
    // skip-optimization just below, which assumes a hotspot's own position
    // never changes on its own — not true here.
    if(hs.track){ hs.track.node.localToWorld(hs.pos.copy(hs.track.offset)); }
    // If already invisible and camera hasn't moved, nothing can have changed.
    // Skip project(), DOM write, and raycast entirely — zero cost per frame.
    if(hs.op!=null && hs.op<0.012 && !_hsCamMoved && !hs.track) return;
    if(hs._offScreen && (_hsFrame%3)!==(idx%3)){
      if(hs.op>0.012){hs.op*=0.8; hs.el.style.opacity=hs.op.toFixed(3); if(hs.op<0.012) hs.el.style.display='none';}
      return;
    }
    _hsTmpV.copy(hs.pos).project(cam);
    // Camera not valid yet on this particular tick (e.g. mid-setup during the
    // initial fly-in) — leave this marker's state completely untouched and
    // retry next tick, rather than recording a result derived from NaN.
    if(!isFinite(_hsTmpV.x)||!isFinite(_hsTmpV.y)||!isFinite(_hsTmpV.z)) return;
    let target;

    // Cheap early-out: behind the camera, or well outside the viewport
    // margin — skip the occlusion raycast entirely. With several hotspots
    // scattered around a model, most are off-screen at any given camera
    // angle, so this is the biggest win as the hotspot count grows.
    if(_hsTmpV.z>1||_hsTmpV.x<-1.3||_hsTmpV.x>1.3||_hsTmpV.y<-1.3||_hsTmpV.y>1.3){
      hs._offScreen=true; target=0;
    } else {
      hs._offScreen=false;
      const sx=(_hsTmpV.x*0.5+0.5)*W, sy=(-_hsTmpV.y*0.5+0.5)*H;
      hs.el.style.left=sx+'px';
      hs.el.style.top =sy+'px';

      // Recompute occlusion at ~10 Hz, and only while the camera is moving —
      // a still camera can't change occlusion, so we reuse the last result.
      // Stagger is spread across the full interval window relative to the
      // CURRENT hotspot count, so total raycasts/sec stays roughly constant
      // however many hotspots exist, instead of growing with the count.
      // Annotation markers go through this exact same occlusion check as
      // hotspots — hidden behind geometry the same way.
      const _nowMs=performance.now();
      const _stagger=idx*(_HS_OCC_INTERVAL_MS/Math.max(1,hotspots.length));
      if(hs.vis==null || (_hsCamMoved && (_nowMs-(hs._lastOcc||0))>=_HS_OCC_INTERVAL_MS)){
        hs._lastOcc=_nowMs+_stagger;
        _hsDir.copy(hs.pos).sub(cam.position);
        const distToHs=_hsDir.length();
        const R=hs.px||24;
        let occ=0;
        for(let i=0;i<_HS_SAMPLES.length;i++){
          const px=sx+_HS_SAMPLES[i][0]*R, py=sy+_HS_SAMPLES[i][1]*R;
          const nx=(px/W)*2-1, ny=-(py/H)*2+1;
          if(_hsSampleOccluded(nx,ny,distToHs)) occ++;
        }
        const v=1-(occ/_HS_SAMPLES.length);
        hs.vis=v*v*(3-2*v);   // smoothstep → softer edge falloff
      }
      target=hs.vis;
    }

    // Temporal smoothing of opacity removes flicker as the ray grazes edges.
    hs.op=(hs.op==null)?target:hs.op+(target-hs.op)*0.3;
    if(hs.op<0.012){
      hs.el.style.display='none';
    } else {
      hs.el.style.display='block';
      hs.el.style.opacity=hs.op.toFixed(3);
      hs.el.style.pointerEvents=hs.op>0.5?'auto':'none';
    }
  });
}


// ── IMAGE TRIGGERS ─────────────────────────────────────────────────────────
// DOM overlay approach — identical to hotspots but shows an <img> element
// instead of a pulsing ring. Transparent PNG areas show the HTML background,
// not the 3D scene, eliminating every green-tint / blending issue.
// Occlusion uses the same raycaster logic as hotspots.
const _imgTriggers=[];

function _initImageTriggers(){
  const layer=document.getElementById('hotspot-layer'); // reuse the same overlay layer
  if(!layer) return;

  function _add(def,fn){
    if(!def.image_file) return;

    const el=document.createElement('img');
    el.src='images/'+def.image_file;
    console.log('[WCE] image trigger src:',el.src,'file:',def.image_file);
    el.onerror=()=>console.error('[WCE] image trigger FAILED to load:',el.src);
    const _opStr='opacity:'+(def.image_opacity??1);
    el.style.cssText=[
      'position:absolute',
      'transform:translate(-50%,-50%)',
      _opStr,
      'cursor:pointer',
      'pointer-events:none',
      'display:none',
      'user-select:none',
      '-webkit-user-drag:none',
      'object-fit:contain',
    ].join(';');
    layer.appendChild(el);

    const p=def.image_position||[0,0,0];
    const worldPos=new THREE.Vector3(p[0],p[1],p[2]);

    // Build the quaternion that rotates the plane (same as mesh approach)
    // so we can project its corners to screen space for sizing.
    const toRad=Math.PI/180;
    const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(
      Math.PI/2+(def.image_rotation_x||0)*toRad,
      (def.image_rotation_z||0)*toRad,
      -(def.image_rotation_y||0)*toRad,
      'YXZ'
    ));
    const halfW=(def.image_width??1)/2;
    const halfH=(def.image_height??1)/2;
    // Corner offset vectors in world space (used for screen-space size estimation)
    const cornerR=new THREE.Vector3(halfW,0,0).applyQuaternion(q);
    const cornerU=new THREE.Vector3(0,halfH,0).applyQuaternion(q);

    el.addEventListener('pointerdown',(e)=>{ e.stopPropagation(); fn(); });
    _imgTriggers.push({worldPos,worldW:def.image_width??1,worldH:def.image_height??1,imgOp:def.image_opacity??1,el,fn,op:0,vis:null,_lastOcc:0,track:_wceResolveTrack(def)});
  }

  allAnimDefs().forEach(d=>{   
    if(d.trigger==='image') _add(d,()=>triggerAnim(d.name));
    (d.extra_images||[]).forEach(ei=>{ _add(ei,()=>triggerAnim(d.name)); });
  });
  [['MAT',(CFG.mat_animations||[])], ['GEO',(CFG.geo_animations||[])]].forEach(([kind,list])=>{
    list.forEach(d=>{
      if(d.trigger_type==='image') _add(d,()=>triggerMatGeoAnim(kind, d.source_key));
      (d.extra_images||[]).forEach(ei=>{ _add(ei,()=>triggerMatGeoAnim(kind, d.source_key)); });
    });
  });
  const cin=camCfg.cinematic||{};
  if(cin.trigger==='image') _add(cin,()=>_cinematicPlaying?_stopCinematic():_startCinematic());
  ((CFG.animations||{}).sequences||[]).forEach(s=>{
    if(s.trigger==='image') _add(s,()=>executeSequence(s.name));
  });
}

function _tickImgTriggers(){
  if(!_imgTriggers.length) return;
  const W=innerWidth, H=innerHeight;
  const _nowMs=performance.now();
  const _OCC_MS=100;

  _imgTriggers.forEach((it,idx)=>{
    // Parented under an animated control at export time — follow the live
    // node instead of a frozen point (see _wceResolveTrack / _tickHotspots,
    // same mechanism shared across hotspots/annotations/image triggers).
    if(it.track){ it.track.node.localToWorld(it.worldPos.copy(it.track.offset)); }
    if(it.op!=null && it.op<0.012 && !_hsCamMoved && !it.track){ it.el.style.display='none'; return; }
    if(it._offScreen && (_hsFrame%2)!==(idx%2)){
      if(it.op>0.012){it.op*=0.8; it.el.style.opacity=it.op.toFixed(3);}
      return;
    }
    _hsTmpV.copy(it.worldPos).project(cam);

    // Behind camera or well off-screen
    if(_hsTmpV.z>1||_hsTmpV.x<-1.4||_hsTmpV.x>1.4||_hsTmpV.y<-1.4||_hsTmpV.y>1.4){
      it._offScreen=true; it.op=(it.op??0)*0.7;
      if(it.op<0.012){ it.el.style.display='none'; }
      return;
    }
    it._offScreen=false;

    const sx=(_hsTmpV.x*0.5+0.5)*W;
    const sy=(-_hsTmpV.y*0.5+0.5)*H;

    // Occlusion check — throttled to ~10Hz, skipped when camera is still
    const _stagger=idx*(_OCC_MS/Math.max(1,_imgTriggers.length));
    if(it.vis==null||(_hsCamMoved&&(_nowMs-(it._lastOcc||0))>=_OCC_MS)){
      it._lastOcc=_nowMs+_stagger;
      _hsDir.copy(it.worldPos).sub(cam.position);
      const dist=_hsDir.length();
      _hsRay.set(cam.position,_hsDir.normalize());
      _hsRay.far=dist-HOTSPOT_OCCLUSION_BIAS;
      const hits=_hsRay.intersectObjects(_occluderMeshes,false);
      it.vis=hits.length===0?1:0;
    }

    const target=it.vis??0;
    it.op=(it.op==null)?target:it.op+(target-it.op)*0.3;

    if(it.op<0.012){
      it.el.style.display='none';
      return;
    }

    // Compute pixel size from world dimensions + camera distance.
    // This gives perspective-correct stable scaling (same as how any 3D
    // object appears to resize as you orbit) without jitter from corner
    // projection artifacts.
    const dist=Math.max(0.1, cam.position.distanceTo(it.worldPos));
    const tanHalfFov=Math.tan(cam.fov*Math.PI/360);
    const pxH=Math.max(20,(it.worldH/(dist*tanHalfFov*2))*H);
    const pxW=Math.max(20,(it.worldW/(dist*tanHalfFov*2*cam.aspect))*W);

    it.el.style.display='block';
    it.el.style.left=sx+'px';
    it.el.style.top =sy+'px';
    it.el.style.width =(Math.max(20,pxW))+'px';
    it.el.style.height=(Math.max(20,pxH))+'px';
    it.el.style.opacity=(it.op*it.imgOp).toFixed(3);
    it.el.style.pointerEvents=it.op>0.5?'auto':'none';
  });
}


// Helper for adding ad-hoc hotspot triggers (used by buildSequenceUI).
function _registerHotspot(objName, fn){
  if(!objName||!fn) return;
  const hs=hotspots.find(h=>h.name===objName);
  if(hs) hs.fn=fn; // attach callback to existing hotspot element
}

// ── RENDER LOOP ──────────────────────────────────────────────────────────

// Declared before the render loop (which references it) to avoid a temporal
// dead-zone error; the rest of the AR state lives in the AR module below.
let _xrActive=false;
(function tick(){
  requestAnimationFrame(tick);
  const _wceFrameStart = _wceStats.enabled ? performance.now() : 0;
  if(_xrActive) return;   // XR drives its own loop
  if(_camDistanceLocked){
    // Locked camera — sits wherever the artist deliberately placed it in
    // Blender, above/below the floor/roof relationship or not. The
    // dynamically-computed bounds below exist for free-roaming orbit and
    // would otherwise force this shot back into range the instant
    // OrbitControls' own update() runs below, producing a visible snap on
    // load for any locked camera positioned outside them — the exact same
    // class of bug _camDistanceLocked already exists to prevent for the
    // zoom range and pan clamp elsewhere in this same render loop.
    ctrl.minPolarAngle=0;
    ctrl.maxPolarAngle=Math.PI;
  } else {
    const dist=ctrl.getDistance();
    const cosPhi=Math.max(-1,Math.min(1,(FLOOR_Z-ctrl.target.y)/dist));
    ctrl.maxPolarAngle=Math.acos(cosPhi)-0.01;
    // Optional roof: camera can't rise above the CAM_ROOF plane.
    if(ROOF_Z!=null){
      const cosR=Math.max(-1,Math.min(1,(ROOF_Z-ctrl.target.y)/dist));
      ctrl.minPolarAngle=Math.min(Math.acos(cosR)+0.01, ctrl.maxPolarAngle-0.02);
    }
  }
  _tickTurntable();
  _tickMixers();
  const _tdt=Math.min(0.05,(performance.now()-_lastTransT)/1000); _lastTransT=performance.now();
  _tickTransitions(_tdt);

  if(_cinematicPlaying && _cinematicNodes[_cinematicIdx]){
    const cNode = _cinematicNodes[_cinematicIdx];
    cNode.getWorldPosition(cam.position);
    cNode.getWorldQuaternion(cam.quaternion);
    const fw = new THREE.Vector3(0,0,-1).applyQuaternion(cam.quaternion);
    ctrl.target.copy(cam.position).add(fw.multiplyScalar(dist > 0.1 ? dist : 5));
  } else {
    // ctrl.update() runs every frame — keeps OrbitControls internal spherical
    // state synced so there is never stale state between flies.
    // _tickFly() runs AFTER and overrides the position for the fly arc.
    _applyCamDistanceLock();
    ctrl.update();
    _correctCamDistanceLock();
    // Safety net: OrbitControls' internal math can produce Infinity/NaN if
    // its orbit radius ever gets too close to zero (this happened with an
    // earlier, too-aggressive Lock Tumble/Pan value) — once corrupted, the
    // camera never recovers on its own. Restore from the last known-good
    // position instead of leaving it (and everything that projects through
    // it, like hotspots) permanently broken.
    if(!isFinite(cam.position.x)||!isFinite(cam.position.y)||!isFinite(cam.position.z)
       ||!isFinite(ctrl.target.x)||!isFinite(ctrl.target.y)||!isFinite(ctrl.target.z)){
      if(_camHasGoodState){
        cam.position.copy(_camLastGoodPos);
        ctrl.target.copy(_camLastGoodTarget);
      } else {
        // Never had a valid frame at all (e.g. broken from the very first
        // position set at script load) — nothing to restore from, so fall
        // back to a hardcoded, always-safe default instead of staying stuck.
        cam.position.set(0,2,10);
        ctrl.target.set(0,0.8,0);
      }
      ctrl.minDistance=Math.max(ctrl.minDistance,0.05);
      ctrl.maxDistance=Math.max(ctrl.maxDistance,0.05);
      ctrl.update();
    } else {
      _camLastGoodPos.copy(cam.position);
      _camLastGoodTarget.copy(ctrl.target);
      _camHasGoodState=true;
    }
    if(_flyPending){
      _flyFromPos.copy(cam.position); _flyFromTgt.copy(ctrl.target);
      _flyToPos.copy(_flyDestPos); _flyToTgt.copy(_flyDestTgt);
      _flyFromFov=cam.fov; _flyToFov=_flyDestFov;
      if(_flyDestSound) SFX.playFile(_flyDestSound);
      _flyPending=false; _flyActive=true; _flyT=0;
    }
    if(_flyActive){
      _tickFly();
      cam.lookAt(ctrl.target);
    } else {
    // Re-asserted again here, not just before the earlier update() call above
    // — this second update() is the one actually processing live user input
    // (rotation/zoom), and several other things run in between the two
    // calls each frame. Without reasserting immediately before this one too,
    // the lock could still be bypassed right where it mattered most.
    _applyCamDistanceLock();
    ctrl.update();
    _correctCamDistanceLock();
    // Clamp pan target. Shift cam.position by the same delta so orbit
    // relationship is preserved with no visual jump. Also drain any
    // residual damped pan offset stored in OrbitControls.
    // Locked cameras are excluded entirely — this clamps against the
    // model's general bounding box, which has no awareness of a specific,
    // deliberately close/precise locked shot. It doesn't break the locked
    // DISTANCE (position and target shift by the same delta, preserving the
    // radius between them) — but it silently relocates where that fixed
    // view is centered, which is exactly a locked camera drifting off its
    // configured shot even while technically staying "locked" to wherever
    // it drifted to.
    if(_panMin!==null && !_camDistanceLocked){
      const _dx=Math.max(_panMin.x,Math.min(_panMax.x,ctrl.target.x))-ctrl.target.x;
      const _dy=Math.max(_panMin.y,Math.min(_panMax.y,ctrl.target.y))-ctrl.target.y;
      const _dz=Math.max(_panMin.z,Math.min(_panMax.z,ctrl.target.z))-ctrl.target.z;
      if(_dx||_dy||_dz){
        ctrl.target.x+=_dx; ctrl.target.y+=_dy; ctrl.target.z+=_dz;
        cam.position.x+=_dx; cam.position.y+=_dy; cam.position.z+=_dz;
        // Drain residual pan offset if OrbitControls exposes it
        if(ctrl._panOffset) ctrl._panOffset.set(0,0,0);
      }
    }
  }
  }

  // Continuous activity keeps the draw window open; otherwise we draw only for
  // the short window opened by interaction / camera damping (requestRender).
  const _now=performance.now();
  // Called unconditionally, not inline in the || chain below — it has a
  // position-tracking side effect that must run every single frame, which
  // short-circuit evaluation could otherwise skip whenever an earlier
  // condition in that chain is already true.
  const _settling=_cameraStillSettling();
  const _active = _flyActive || _turntableActive || _cinematicPlaying || _hoverOn
                || _now<_animActiveUntil || Object.keys(_segWatch).length>0
                || _matTweens.length>0 || _geoTweens.length>0 || _userInteracting
                || _settling;
  if(_active) _renderUntil=_now+100;

  if(_now<=_renderUntil){
    if(dofPass) _wceUpdateDofFocus();
    if(noisePass) noisePass.uniforms.time.value = _now*0.001;
    const _wceGpuQuery = _wceStatsBeginGpuQuery();
    comp.render();
    _wceStatsEndGpuQuery(_wceGpuQuery);
    // Hotspots: skip entirely during AR — the raycaster runs against the full
    // scene (including the AR clone) and causes the frame-rate drop you saw.
    if(!_xrActive) try{ _tickHotspots(); }catch(e){ console.error('[WCE] Hotspot tick failed:', e); }
    if(!_xrActive) _tickImgTriggers();
  }
  if(_wceStats.enabled){
    _wceStatsPollGpuQueries();
    const _wceNow = performance.now();
    if(_wceStats.lastFrameStart != null){
      const _delta = _wceNow - _wceStats.lastFrameStart;
      _wceStats.frameTimeMs = _delta;
      _wceStats.fps = _delta>0 ? 1000/_delta : 0;
      _wceStats.frameTimes.push(_delta);
      if(_wceStats.frameTimes.length > _wceStats.maxSamples) _wceStats.frameTimes.shift();
    }
    _wceStats.lastFrameStart = _wceNow;
    const _busyMs = _wceNow - _wceFrameStart;
    _wceStats.cpuPct = _wceStats.frameTimeMs>0 ? Math.min(100,(_busyMs/_wceStats.frameTimeMs)*100) : 0;
    if(typeof _wceStatsRenderOverlay==='function') _wceStatsRenderOverlay();
  }
})();

// ── AR (WebXR on Android, pre-baked USDZ on iOS) ─────────────────────────────
// Android: WebXR immersive-ar — live three.js scene, current config, unchanged.
// iOS:     pre-baked USDZ files written at Blender export time. The AR button
//          shows only the combos (geo × mat) the artist marked for AR, so the
//          user picks from valid pre-baked configs before Quick Look opens.
//          No blob generation, no async before the click — works reliably.
let _xrSession=null, _xrRefSpace=null, _xrHitSource=null;
let _arReticle=null, _arModel=null, _arPlaced=false, _arBgBackup=null, _arEnvBackup=null, _xrFrameErrored=false;
let _arEstimatedLight=null;

function _isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent)
      || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
}
function _quickLookSupported(){
  const a=document.createElement('a');
  return !!(a.relList && a.relList.supports && a.relList.supports('ar'));
}
function _slug(n){ return n.toLowerCase().replace(/[^a-z0-9_-]/g,'_').replace(/^_+|_+$/g,''); }
function _arUSDZPath(geoName, matName){
  const parts=[];
  if(geoName) parts.push(_slug(geoName));
  if(matName) parts.push(_slug(matName));
  return 'IOS AR/ar__'+(parts.length?parts.join('__'):'default')+'.usdz';
}

// ── iOS AR picker ─────────────────────────────────────────────────────────────
let _arPickerOpen=false;
const _arGeoSets = (CFG.ar&&CFG.ar.geo_sets)||[];
const _arMatSets = (CFG.ar&&CFG.ar.mat_sets)||[];

function _showARPicker(){
  if(_arPickerOpen) return;
  _arPickerOpen=true;

  // Overlay
  const ov=document.createElement('div');
  ov.id='ar-picker-ov';
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 0 40px';

  const box=document.createElement('div');
  box.style.cssText='background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:18px;width:min(360px,90vw);font-family:Rajdhani,sans-serif';

  const title=document.createElement('div');
  title.textContent='Choose AR configuration';
  title.style.cssText='font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--text);margin-bottom:14px;font-weight:600';
  box.appendChild(title);

  // State
  let selGeo=(_arGeoSets.length===1)?_arGeoSets[0].name:null;
  let selMat=(_arMatSets.length===1)?_arMatSets[0].name:null;

  function _makeSection(label, items, onSel, getVal){
    if(!items.length) return null;
    const sec=document.createElement('div');
    sec.style.cssText='margin-bottom:12px';
    const lbl=document.createElement('div');
    lbl.textContent=label;
    lbl.style.cssText='font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:6px';
    sec.appendChild(lbl);
    const row=document.createElement('div');
    row.style.cssText='display:flex;flex-wrap:wrap;gap:6px';
    items.forEach(it=>{
      const b=document.createElement('button');
      b.textContent=it.name;
      b.style.cssText='padding:6px 12px;background:var(--panel);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:Rajdhani,sans-serif;font-size:11px;letter-spacing:.1em;cursor:pointer';
      b.onclick=()=>{
        row.querySelectorAll('button').forEach(x=>x.style.borderColor='var(--border)');
        b.style.borderColor='var(--accent)';
        onSel(it.name);
        _updateLaunch();
      };
      if(getVal()===it.name) b.style.borderColor='var(--accent)';
      row.appendChild(b);
    });
    sec.appendChild(row);
    return sec;
  }

  const geoSec=_makeSection('Body Style',_arGeoSets,n=>{selGeo=n;},()=>selGeo);

// Android/WebXR — immersive-ar with floor hit-test and tap-to-place.
async function _startWebXR(){
  if(!root || _xrSession){ return; }
  const btn=document.getElementById('ar-btn');
  if(btn) btn.disabled=true;
  try{
    _xrFrameErrored=false;
    _xrSession=await navigator.xr.requestSession('immersive-ar',{
      requiredFeatures:['hit-test'],
      optionalFeatures:['dom-overlay','local-floor','light-estimation'],
      domOverlay:{root:document.body}
    });

    _xrActive=true;
    renderer.xr.enabled=true;
    await renderer.xr.setSession(_xrSession);

    _arBgBackup=scene.background; scene.background=null;
    _arEnvBackup=scene.environment; scene.environment=null;
    if(typeof _groundSky!=='undefined' && _groundSky) _groundSky.visible=false;
    if(root) root.visible=false;

    // Real-world light estimation: replaces the studio HDRI entirely with
    // lighting derived from the device's actual camera feed, so the placed
    // model reads as if it's really sitting in the room, not lit by
    // whatever environment was active in the regular web viewer. Falls back
    // to Three.js's own ambient/hemisphere default if the device doesn't
    // support the 'light-estimation' feature — never left unlit.
    _arEstimatedLight=new XREstimatedLight(renderer);
    _arEstimatedLight.addEventListener('estimationstart',()=>{
      scene.add(_arEstimatedLight);
      if(_arEstimatedLight.environment) scene.environment=_arEstimatedLight.environment;
    });
    _arEstimatedLight.addEventListener('estimationend',()=>{
      scene.remove(_arEstimatedLight);
      scene.environment=_arEnvBackup;
    });

    const rg=new THREE.RingGeometry(0.07,0.09,32).rotateX(-Math.PI/2);
    _arReticle=new THREE.Mesh(rg,new THREE.MeshBasicMaterial({color:0x39c5ff}));
    _arReticle.matrixAutoUpdate=false; _arReticle.visible=false; scene.add(_arReticle);

    _arModel=root.clone(true); _arModel.visible=false;
    // Geometry only — strip any lights that came along in the clone (punctual
    // point/spot/sun lights baked into the GLB are descendants of root, so a
    // plain deep clone copies them too). AR is meant to rely entirely on the
    // device's real-world light estimation above, not re-create the studio
    // lighting rig on top of it.
    (function _stripArLights(o){
      const lights=[];
      o.traverse(n=>{ if(n.isLight) lights.push(n); });
      lights.forEach(n=>{ if(n.parent) n.parent.remove(n); });
    })(_arModel);
    const box=new THREE.Box3().setFromObject(root);
    const sz=box.getSize(new THREE.Vector3());
    const maxd=Math.max(sz.x,sz.y,sz.z)||1;
    const targetMetres=1.0;
    _arModel.scale.setScalar(targetMetres/maxd);
    (function _syncMats(s,d){
      const sm=[],dm=[];
      s.traverse(o=>{if(o.isMesh)sm.push(o);});
      d.traverse(o=>{if(o.isMesh)dm.push(o);});
      sm.forEach((m,i)=>{if(dm[i])dm[i].material=m.material;});
    })(root,_arModel);
    scene.add(_arModel); _arPlaced=false;

    let exit=document.getElementById('ar-exit');
    if(!exit){exit=document.createElement('button');exit.id='ar-exit';exit.style.cssText='position:fixed;top:14px;right:14px;z-index:10000;padding:8px 14px;background:rgba(0,0,0,.6);border:1px solid #fff;border-radius:4px;color:#fff;font-family:Rajdhani,sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer';document.body.appendChild(exit);}
    exit.textContent='Exit AR'; exit.style.display='block';
    exit.onclick=()=>{ try{_xrSession?.end();}catch(e){} };

    let hint=document.getElementById('ar-hint');
    if(!hint){hint=document.createElement('div');hint.id='ar-hint';hint.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:64px;z-index:10000;padding:8px 14px;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;font-family:Rajdhani,sans-serif;font-size:11px;letter-spacing:.08em;text-align:center';document.body.appendChild(hint);}
    hint.textContent='Point at the floor, then tap to place'; hint.style.display='block';

    try{ _xrRefSpace=await _xrSession.requestReferenceSpace('local-floor'); }
    catch(e){ _xrRefSpace=await _xrSession.requestReferenceSpace('local'); }
    const viewer=await _xrSession.requestReferenceSpace('viewer');
    _xrHitSource=await _xrSession.requestHitTestSource({space:viewer});

    _xrSession.addEventListener('select',()=>{
      if(_arReticle&&_arReticle.visible&&_arModel){
        _arModel.position.setFromMatrixPosition(_arReticle.matrix);
        _arModel.visible=true; _arPlaced=true;
        hint.textContent='Tap again to reposition';
      }
    });
    _xrSession.addEventListener('end',_endWebXR);
    renderer.setAnimationLoop(_onXRFrame);
  }catch(e){
    console.error('[WCE] AR setup failed:',e);
    alert('Could not start AR. Use Chrome on Android over HTTPS.');
    try{ if(_xrSession) await _xrSession.end(); }catch(_e){}
    _endWebXR();
  }finally{
    if(btn) btn.disabled=false;
  }
}

function _onXRFrame(t,frame){
  try{
    if(frame&&_xrHitSource&&_xrRefSpace){
      const hits=frame.getHitTestResults(_xrHitSource);
      if(hits.length){
        const pose=hits[0].getPose(_xrRefSpace);
        if(pose){ _arReticle.visible=!_arPlaced; _arReticle.matrix.fromArray(pose.transform.matrix); }
        else if(_arReticle) _arReticle.visible=false;
      } else if(_arReticle) _arReticle.visible=false;
    }
    renderer.render(scene,cam);
  }catch(e){
    if(!_xrFrameErrored){ _xrFrameErrored=true; console.error('[WCE] XR frame:',e); try{_xrSession?.end();}catch(_e){} }
  }
}

function _endWebXR(){
  renderer.setAnimationLoop(null);
  try{ if(_xrHitSource&&_xrHitSource.cancel)_xrHitSource.cancel(); }catch(e){}
  _xrHitSource=null;
  if(_arReticle){scene.remove(_arReticle);_arReticle.geometry.dispose();_arReticle.material.dispose();_arReticle=null;}
  if(_arModel){scene.remove(_arModel);_arModel=null;}
  if(_arEstimatedLight){ scene.remove(_arEstimatedLight); _arEstimatedLight=null; }
  if(root) root.visible=true;
  if(typeof _groundSky!=='undefined'&&_groundSky) _groundSky.visible=true;
  scene.background=_arBgBackup; _arBgBackup=null;
  scene.environment=_arEnvBackup; _arEnvBackup=null;
  renderer.xr.enabled=false; _xrActive=false; _xrSession=null; _xrFrameErrored=false;
  const exit=document.getElementById('ar-exit'); if(exit) exit.style.display='none';
  const hint=document.getElementById('ar-hint'); if(hint) hint.style.display='none';
  if(typeof requestRender==='function') requestRender(1000);
}
