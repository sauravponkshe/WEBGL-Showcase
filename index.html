  lbEl.style.background='#c0392b';
  ldEl.style.opacity='1';ldEl.style.display='flex';ldEl.classList.remove('hidden');
  stEl.textContent='LOAD ERROR';
}

loader.load('model.gltf',
  async(gltf)=>{
    root=gltf.scene; root.visible=false; scene.add(root);
    // Compute model bounding box once after load — used to clamp pan in the tick loop.
    const _modelBox=new THREE.Box3().setFromObject(root);
    _panMin=_modelBox.min.clone(); _panMax=_modelBox.max.clone();
    const _panMargin=Math.max(CFG.camera.zoom_min??2,(_panMax.x-_panMin.x)*0.25);
    _panMin.x-=_panMargin; _panMin.z-=_panMargin;
    _panMax.x+=_panMargin; _panMax.z+=_panMargin;
    _panMin.y=FLOOR_Z;
    _panMax.y=(ROOF_Z!=null?ROOF_Z:_panMax.y+_panMargin);
    try{
      const allMats=await gltf.parser.getDependencies('materials');
      const sR=['map','emissiveMap','sheenColorMap','specularColorMap'];
      const lR=['normalMap','roughnessMap','metalnessMap','aoMap','displacementMap','alphaMap',
                'sheenRoughnessMap','transmissionMap','thicknessMap','clearcoatMap',
                'clearcoatNormalMap','clearcoatRoughnessMap'];
      allMats.forEach(m=>{
        if(m?.name) matMap[m.name]=m;
        if(m){sR.forEach(k=>{if(m[k])m[k].colorSpace=THREE.SRGBColorSpace;});
               lR.forEach(k=>{if(m[k])m[k].colorSpace=THREE.LinearSRGBColorSpace;});}
      });
    }catch(e){console.warn('[WCE] prefetch materials:',e);}

    root.traverse(o=>{
      if(o.isMesh){
        o.castShadow=true;o.receiveShadow=true;
        _occluderMeshes.push(o);
        const ms=Array.isArray(o.material)?o.material:[o.material];
        if(!o.userData.origMatNames) o.userData.origMatNames=ms.map(m=>m?.name||'');
        const hasAO=o.geometry&&o.geometry.hasAttribute('color');
        ms.forEach(m=>{
          if(m?.name) matMap[m.name]=m;
          if(m){
            ['map','emissiveMap'].forEach(k=>{if(m[k])m[k].colorSpace=THREE.SRGBColorSpace;});
            ['normalMap','roughnessMap','metalnessMap'].forEach(k=>{if(m[k])m[k].colorSpace=THREE.LinearSRGBColorSpace;});
            if(hasAO){m.vertexColors=true;m.needsUpdate=true;}
          }
        });
      }
      if(o.isLight){
        o.castShadow=true;
        if(o.shadow){o.shadow.mapSize.set(1024,1024);o.shadow.bias=-0.001;o.shadow.normalBias=0.02;}
      }
    });

    (CFG.area_lights||[]).forEach(al=>{
      const light=new THREE.RectAreaLight(new THREE.Color(...al.color),al.intensity,al.width,al.height);
      light.name=al.name;light.position.set(...al.position);
      if(al.quaternion) light.quaternion.set(...al.quaternion);
      else if(al.rotation) light.rotation.set(...al.rotation); // legacy config fallback
      scene.add(light);
    });

    _initAnimMixers(gltf);
    // ── Snap all controls/combos to their configured default_state HERE —
    // before hide() is called, while the loader is definitely still covering
    // the screen. This ensures the model is always revealed in the correct
    // pose with no visible jump or transition from state 0.
    _applyDefaultAnimStates();
    _initCinematicMixers(gltf);
    _initImageTriggers();
    _initMeshTriggers();
    _initHotspots();

    // Debug handle: inspect from the browser console, e.g.
    //   WCE.CFG.animations.combos   |   Object.keys(WCE.animMixers)   |   WCE.trigger('Part_0')
    try{ window.WCE={
      CFG, animMixers, animClips, animState,
      hoverClips:()=>({rise:_hoverRiseClip&&_hoverRiseClip.name,loop:_hoverLoopClip&&_hoverLoopClip.name,on:_hoverOn}),
      trigger:triggerAnim, gltf
    }; }catch(e){}

    prog(100,'READY');hide();

    // Default geo must be applied AFTER applyVariant / refreshAdvMat —
    // applyVariant walks geometry_exposed and would overwrite it otherwise.

    // ── Expose all globals ui.js needs BEFORE ensureGeoDefaults runs ─────────
    window.CFG=CFG; window.varData=varData; window.root=root;
    window.matSt=matSt; window.geoSt=geoSt; window.animState=animState;
    window.camCfg=camCfg; window._TRANS=_TRANS; window.SFX=SFX;
    window.triggerAnim=triggerAnim; window.flyToAnimState=flyToAnimState; window.flyToCamera=flyToCamera;
    window._isFlyActive=function(){return _flyActive||_flyPending;}; // for sequence poll in ui.js
    window.applyMat=applyMat; window.applyGeoSubset=applyGeoSubset;
    window.applyGeoToggle=applyGeoToggle; window.applyVariant=applyVariant;
    window.applyMatSubset=applyMatSubset; window.refreshActive=refreshActive;
    window.refreshAdvMat=refreshAdvMat; window.allAnimDefs=allAnimDefs;
    window.findNode=findNode; window._geoDissolveNode=_geoDissolveNode;
    window._loadHDRIItem=_loadHDRIItem; window._addMeshTrigger=_addMeshTrigger;
    window._registerHotspot=_registerHotspot;
    window._startCinematic=_startCinematic; window._stopCinematic=_stopCinematic;
    window._startTurntable=_startTurntable; window._stopTurntable=_stopTurntable;
    try{Object.defineProperty(window,'_cinematicPlaying',{get:()=>_cinematicPlaying,set:v=>{_cinematicPlaying=v;},configurable:true});}catch(e){}
    try{Object.defineProperty(window,'_turntableActive',{get:()=>_turntableActive,set:v=>{_turntableActive=v;},configurable:true});}catch(e){}
    try{Object.defineProperty(window,'_hdriActiveFile',{get:()=>_hdriActiveFile,set:v=>{_hdriActiveFile=v;},configurable:true});}catch(e){}
    (function ensureGeoDefaults(){
      const exposed=CFG.geometry_exposed||{};
      const norm=n=>n.replace(/^GEOMETRIES_/i,'').toLowerCase();
      const chosen=new Set(Object.values(CFG.default_geo_state||{}).map(v=>norm(String(v))));
      function walk(pN,tree){
        const ch=(tree.children||[]).filter(c=>!c.name.toLowerCase().includes('common'));
        if(ch.length>1&&!ch.some(c=>chosen.has(norm(c.name))))
          applyGeoToggle(ch[0].name,ch.map(c=>c.name));
        (tree.children||[]).forEach(c=>{if(c.children?.length) walk(c.name,c);});
      }
      Object.entries(exposed).forEach(([pN,tree])=>walk(pN,tree));
    })();

    window._wce={CFG,matMap,cloneCache,varData};

    try{
      if(CFG.containers)
        Object.entries(CFG.containers).forEach(([c,vals])=>{if(vals?.length) matSt[c]=vals[0];});
      const allSubs=[...(CFG.mat_subsets||[]),(CFG.global_mat_sets||[])].flat();
      const dms=CFG.default_mat_subset;
      const sub=dms?allSubs.find(s=>s.name===dms.name&&s.category===dms.category):allSubs[0]||null;
      if(sub) Object.assign(matSt,sub.state);
      Object.entries(matSt).forEach(([c,m])=>applyMat(c,m));
      buildUI();
      // Apply defaults in order — all state must be settled before marking buttons.
      const dv=CFG.default_variant&&varData[CFG.default_variant]?CFG.default_variant:null;
      if(dv) applyVariant(dv); else refreshAdvMat(matSt);
      if(CFG.default_geo_state&&Object.keys(CFG.default_geo_state).length){
        applyGeoSubset(CFG.default_geo_state);
        if(typeof buildAdvGeo==='function') buildAdvGeo();
      }
      if(typeof refreshActive==='function') refreshActive();
      if(typeof refreshAdvMat==='function') refreshAdvMat(matSt);
      // Mark default mat-subset pill — match name AND category to avoid
      // highlighting all pills named e.g. "GREY" across different categories.
      if(sub){
        document.querySelectorAll('.pb2[data-sc]').forEach(b=>{
          if(b.textContent.trim()===sub.name && b.dataset.sc===sub.category)
            b.classList.add('active');
        });
      }
      // Mark default geo-package pill: compare package state dict directly
      // against CFG.default_geo_state (same format) — reliable, no geoSt key mismatch.
      (CFG.geometry_subsets||[]).forEach((gpkg,gi)=>{
        const pst=gpkg.state||{};
        const dst=CFG.default_geo_state||{};
        if(!Object.keys(pst).length) return;
        const match=Object.entries(pst).every(([p,c])=>dst[p]===c);
        if(match){ const b=document.querySelector(`.pb2[data-gi="${gi}"]`); if(b) b.classList.add('active'); }
      });
      // Mark active HDRI button.
      document.querySelectorAll('.pb2[data-hf]').forEach(b=>{
        const isActive=b.dataset.hf===_hdriActiveFile
          ||(!_hdriActiveFile&&(CFG.hdris||[]).find(h=>h.default)?.file===b.dataset.hf);
        b.classList.toggle('active',!!isActive);
      });
      root.visible=true;
      requestRender(1000);   // ensure the freshly-loaded model is drawn
    }catch(uiErr){console.error('[WCE] UI error:',uiErr);stEl.textContent='UI ERROR';}
  },
  e=>{
    if(e.total&&e.total>0) prog(25+Math.round(e.loaded/e.total*70),'LOADING MODEL');
    else prog(50,'LOADING MODEL…');
  },
  _onLoadError
);

// ── SCENE HELPERS ────────────────────────────────────────────────────────

function findNode(name){
  let res=null;
  const s=name.replace(/ /g,'_');
  if(root) root.traverse(o=>{if(o.name===name||o.name===s) res=o;});
  return res;
}

// ── MATERIAL / VARIANT SYSTEM ────────────────────────────────────────────

function applyVariant(name){
  const d=varData[name];if(!d)return;
  activeV=name;
  qsa('.gb').forEach(x=>x.classList.remove('active'));
  qsa('.pb2[data-sc]').forEach(x=>x.classList.remove('active'));
  qsa('.pb2[data-tp="gp"]').forEach(x=>x.classList.remove('active'));
  const SKIP=['CAMERA_SETTINGS','MAT_SUBSETS','GLOBAL_MAT_SETS','GEO_SETS','LIGHTS','ENVIRONMENTS'];
  const exposed=CFG.geometry_exposed||{};
  Object.entries(d).forEach(([k,v])=>{
    if(!k.startsWith('GEOMETRIES_')||!exposed[k]) return;
    const sv=typeof v==='string'?v.replace(/ /g,'_'):v;
    if(sv==='NONE'||sv===''||sv==null){const n=findNode(k);if(n){n.visible=false;delete geoSt[k];}}
    else{const sib=exposed[k].children.map(c=>c.name);if(sib.length) applyGeoToggle(sv,sib);}
  });
  Object.entries(d).forEach(([k,v])=>{
    if(k.startsWith('GEOMETRIES_')||SKIP.includes(k)) return;
    if(typeof v==='string'&&v&&v!=='NONE'){applyMat(k,v);matSt[k]=v;}
  });
  const gs=Array.isArray(d.GEO_SETS)?d.GEO_SETS:[];
  const sgp=document.getElementById('sgp');
  if(gs.length){
    sgp.innerHTML='<div class="st">Packages</div>';
    const g=mk('div','pg');
    gs.forEach(s=>{const b=mk('button','pb2');b.dataset.tp='gp';b.textContent=s.name;
      b.onclick=()=>{applyGeoSubset(s.state);qsa('.pb2[data-tp="gp"]').forEach(x=>x.classList.remove('active'));b.classList.add('active');};
      g.appendChild(b);});
    sgp.appendChild(g);
  }else buildGeoPkgs();
  const ms=Array.isArray(d.MAT_SUBSETS)?d.MAT_SUBSETS:[];
  const sms=document.getElementById('sms');
  if(ms.length){
    sms.innerHTML='';const byCat={};
    ms.forEach(s=>{(byCat[s.category]=byCat[s.category]||[]).push(s);});
    Object.entries(byCat).forEach(([cat,items])=>{
      const t=mk('div','st');t.textContent=cat;sms.appendChild(t);
      const g=mk('div','pg');
      items.forEach(s=>{const b=mk('button','pb2');b.dataset.sc=cat;b.textContent=s.name;
        b.onclick=()=>{applyMatSubset(s.state);qsa('.gb').forEach(x=>x.classList.remove('active'));
          qsa('.pb2[data-sc]').forEach(x=>x.classList.remove('active'));b.classList.add('active');refreshAdvMat(s.state);};
        g.appendChild(b);});
      sms.appendChild(g);
    });
  }else buildMatSubs();
  document.getElementById('vl').textContent=name.replace(/_/g,' ').toUpperCase();
  stEl.textContent=name;buildAdvGeo();refreshAdvMat(matSt);refreshActive();
}
function applyMatSubset(st){Object.entries(st).forEach(([c,m])=>{applyMat(c,m);matSt[c]=m;});refreshActive();}
function resolveMatName(n){return(CFG.mat_name_map&&CFG.mat_name_map[n])?CFG.mat_name_map[n]:n;}
const cloneCache={};
function applyMat(container,matName){
  // Keep the AR clone's materials in sync with the live root.
  if(typeof _arModel!=='undefined' && _arModel && root){
    const srcM=[]; root.traverse(o=>{if(o.isMesh)srcM.push(o);});
    const dstM=[]; _arModel.traverse(o=>{if(o.isMesh)dstM.push(o);});
    srcM.forEach((sm,i)=>{if(dstM[i])dstM[i].material=sm.material;});
  }
  const resolved=resolveMatName(matName);
  const srcMat=matMap[resolved]||matMap[matName];
  if(!srcMat||!root) return;
  let cu=container.toUpperCase();if(cu.startsWith('MAT_')) cu=cu.slice(4);
  const target='MAT_'+cu;
  function slotMatches(n){const u=n.toUpperCase();return u===target||u.startsWith(target+'.')||u===cu||u.startsWith(cu+'.');}
  if(!cloneCache[container]) cloneCache[container]={};
  if(!cloneCache[container][matName]){
    const clone=srcMat.clone();
    clone.name=srcMat.name+'__wce_'+container+'_'+matName;
    const pbr=(CFG.mat_colors||{})[matName]||(CFG.mat_colors||{})[resolved];
    if(pbr){
      if(pbr.color) clone.color.setRGB(pbr.color[0],pbr.color[1],pbr.color[2]);
      if(pbr.metallic!=null) clone.metalness=pbr.metallic;
      if(pbr.roughness!=null) clone.roughness=pbr.roughness;
      if(pbr.emissive) clone.emissive.setRGB(pbr.emissive[0],pbr.emissive[1],pbr.emissive[2]);
      if(pbr.emissiveIntensity!=null) clone.emissiveIntensity=pbr.emissiveIntensity;
      clone.needsUpdate=true;
    }
    // Snapshot the intended target so transitions always lerp toward the true
    // destination (not a value left over from an interrupted tween).
    clone.userData.wceTarget={
      color:clone.color.clone(),
      metalness:clone.metalness,
      roughness:clone.roughness,
      emissive:(clone.emissive?clone.emissive.clone():new THREE.Color(0,0,0)),
    };
    cloneCache[container][matName]=clone;
  }
  const m=cloneCache[container][matName];
  // Smooth transition: tween colour/metallic/roughness/emissive from the
  // currently shown material to the target. Snaps if the maps differ (can't
  // lerp across different textures) or if disabled.
  const smooth=!!_TRANS.material;
  let fromMat=null;
  if(smooth){
    root.traverse(o=>{
      if(fromMat||!o.isMesh) return;
      const orig=o.userData.origMatNames||[];
      for(let i=0;i<orig.length;i++){ if(slotMatches(orig[i])){ fromMat=Array.isArray(o.material)?o.material[i]:o.material; break; } }
    });
  }
  root.traverse(o=>{
    if(!o.isMesh) return;
    const orig=o.userData.origMatNames||[];
    const wasArr=Array.isArray(o.material);
    const slots=wasArr?[...o.material]:[o.material];
    let changed=false;
    const hasAO=o.geometry&&o.geometry.hasAttribute('color');
    for(let i=0;i<orig.length;i++){
      if(slotMatches(orig[i])){slots[i]=m;if(hasAO&&!m.vertexColors){m.vertexColors=true;m.needsUpdate=true;}changed=true;}
    }
    if(changed) o.material=wasArr?slots:slots[0];
  });
  if(smooth && fromMat && fromMat!==m && (fromMat.map||null)===(m.map||null)){
    // Same (or no) albedo map → safe to lerp scalar/colour values. Tween from
    // the previously-shown material to this clone's stored target.
    const to=m.userData.wceTarget||{color:m.color.clone(),metalness:m.metalness,roughness:m.roughness,emissive:(m.emissive?m.emissive.clone():new THREE.Color(0,0,0))};
    const from={color:fromMat.color.clone(),metalness:fromMat.metalness,roughness:fromMat.roughness,emissive:(fromMat.emissive?fromMat.emissive.clone():new THREE.Color(0,0,0))};
    // Start at the previous look, then ramp to the target.
    m.color.copy(from.color);
    m.metalness=from.metalness; m.roughness=from.roughness;
    if(m.emissive) m.emissive.copy(from.emissive);
    for(let i=_matTweens.length-1;i>=0;i--) if(_matTweens[i].mat===m) _matTweens.splice(i,1);
    _matTweens.push({mat:m,from,to,t:0,dur:(_TRANS.mat_ms||300)});
    _bumpAnim((_TRANS.mat_ms||300)+150);
  }
}

</script>
<script>
/* Same-tab live reload — active only on the local preview server, never on a
   deployed (GitHub Pages) site. Polls the build token ~1×/s and hard-reloads
   this tab when a new export bumps it. */
(function(){
  var host=location.hostname;
  if(host!=='localhost'&&host!=='127.0.0.1') return;
  var tok=null;
  function poll(){
    fetch('/__wce_reload__',{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){
      if(tok===null) tok=t; else if(t!==tok) location.reload();
    }).catch(function(){});
  }
  setInterval(poll,1000); poll();
})();
</script>
