<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Car Configurator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600&family=Inconsolata:wght@300;400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{--bg:#0a0a0b;--panel:#101013;--border:#1c1c22;--accent:#c8a96e;--a2:#4a8cff;--ok:#4caf7d;--hot:#ff6b35;--cam:#9b59b6;--text:#e2ddd6;--muted:#52526a;--pw:300px}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif}
canvas{display:block}
#panel{position:fixed;top:0;right:0;width:var(--pw);height:100%;background:var(--panel-bg,var(--panel));border-left:1px solid var(--border);display:flex;flex-direction:column;z-index:10;transition:transform 0.3s cubic-bezier(0.2,0.8,0.2,1)}
#panel.closed{transform:translateX(100%)}
#ptab{position:absolute;top:50%;left:-28px;width:28px;height:60px;transform:translateY(-50%);background:var(--panel);border:1px solid var(--border);border-right:none;border-radius:6px 0 0 6px;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;z-index:11;transition:color 0.15s}
#ptab:hover{color:var(--accent)}
@media (max-width:768px){:root{--pw:85%}}
#ph{padding:22px 18px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
#ph h1{font-size:17px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
#ph p{font-size:10px;color:var(--muted);letter-spacing:.14em;margin-top:3px;font-family:'Inconsolata',monospace}
#tabnav{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.tnb{flex:1;padding:8px 4px;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:'Rajdhani',sans-serif;font-size:10px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:all .18s}
.tnb:hover{color:var(--text)}
.tnb.active{border-bottom-color:var(--accent);color:var(--accent)}
.tabpane{display:none}.tabpane.active{display:block}
body.wce-panel-combined #tabnav{display:none}
body.wce-panel-combined .tabpane{display:block !important}
body.wce-panel-combined .tabpane:not(:first-child){border-top:1px solid var(--border);margin-top:14px;padding-top:14px}
#pb{flex:1;overflow-y:auto;padding:14px 14px 24px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.sec{margin-bottom:18px}
.st{font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.st::after{content:'';flex:1;height:1px;background:var(--border)}
.vg{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.vc{padding:9px 10px;background:var(--bg);border:1px solid var(--border);border-radius:4px;cursor:pointer;transition:background .08s,color .08s,border-color .08s,opacity .08s;font-size:12px;letter-spacing:.07em;text-align:center;color:var(--muted)}
.vc:hover{border-color:var(--accent);color:var(--text)}.vc.active{border-color:var(--accent);color:var(--accent);background:#161208}
.gl{font-size:9px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin:10px 0 5px}
.tr{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:4px}
.tb{padding:5px 11px;background:var(--bg);border:1px solid var(--border);border-radius:3px;cursor:pointer;transition:all .15s;font-family:'Rajdhani',sans-serif;font-size:12px;letter-spacing:.05em;color:var(--muted)}
.tb:hover{border-color:var(--a2);color:var(--text)}.tb.active{border-color:var(--a2);color:var(--a2);background:#080f1e}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:5px}
.pb2{padding:7px 9px;background:var(--bg);border:1px solid var(--border);border-radius:3px;cursor:pointer;transition:all .15s;font-family:'Rajdhani',sans-serif;font-size:11px;letter-spacing:.07em;color:var(--muted);text-align:center}
.pb2:hover{border-color:var(--ok);color:var(--text)}.pb2.active{border-color:var(--ok);color:var(--ok);background:#071410}
.gb{width:100%;margin-bottom:5px;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:3px;cursor:pointer;transition:all .15s;font-family:'Rajdhani',sans-serif;font-size:12px;letter-spacing:.08em;color:var(--muted);text-align:left;display:flex;align-items:center;gap:8px}
.gb::before{content:'◈';font-size:10px;color:var(--accent)}
.gb:hover{border-color:var(--accent);color:var(--text)}.gb.active{border-color:var(--accent);color:var(--accent);background:#161208}
.at{width:100%;padding:7px;background:transparent;border:1px solid var(--border);border-radius:3px;color:var(--muted);font-family:'Rajdhani',sans-serif;font-size:10px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;margin-top:14px;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:7px}
.at:hover{border-color:var(--muted);color:var(--text)}
#as{display:none;margin-top:14px}#as.open{display:block}
.sr{margin-bottom:7px}.sr label{display:block;font-size:9px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-bottom:3px}
.sr select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:5px 9px;border-radius:3px;font-family:'Rajdhani',sans-serif;font-size:13px;outline:none;cursor:pointer;appearance:none}
.sr select:focus{border-color:var(--a2)}
#ld{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity .5s}
#ld.hidden{opacity:0;pointer-events:none}
#lbw{position:relative;width:180px;height:1px;background:var(--border);margin-top:18px}
#lb{height:100%;width:0%;background:var(--accent);transition:width .25s}
#lt{font-size:10px;letter-spacing:.3em;color:var(--muted);margin-top:10px;font-family:'Inconsolata',monospace}
#st{position:fixed;bottom:14px;left:18px;font-size:9px;letter-spacing:.2em;color:var(--muted);font-family:'Inconsolata',monospace;z-index:10}
#ld{background-color:#000000}


#lt{color:#ffffff !important}
#lb{background:#ffffff !important;opacity:1.0 !important}
#lt{font-size:11px !important;font-weight:400 !important}
.nested-grp{margin-left:10px;padding-left:8px;border-left:1px solid var(--border);margin-top:6px;display:none}
.nested-grp.open{display:block}
.anim-btn{width:100%;margin-bottom:5px;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:3px;cursor:pointer;transition:background .08s,color .08s,border-color .08s,opacity .08s;font-family:'Rajdhani',sans-serif;font-size:12px;letter-spacing:.08em;color:var(--muted);text-align:left;display:flex;align-items:center;gap:8px}
.anim-btn:hover{border-color:var(--accent);color:var(--text)}
.anim-btn.playing{border-color:var(--accent);color:var(--accent);background:#161208}
.anim-btn .anim-play-icon{margin-left:auto;font-size:10px;color:var(--accent);opacity:0;transition:opacity .15s}
.anim-btn.playing .anim-play-icon{opacity:1}
.cam-btn{width:100%;margin-bottom:5px;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:3px;cursor:pointer;transition:background .08s,color .08s,border-color .08s,opacity .08s;font-family:'Rajdhani',sans-serif;font-size:12px;letter-spacing:.08em;color:var(--muted);text-align:left;display:flex;align-items:center;gap:8px}
.cam-btn::before{content:'◎';font-size:10px;color:var(--cam)}
.cam-btn:hover{border-color:var(--cam);color:var(--text)}
.cam-btn.active{border-color:var(--cam);color:var(--cam);background:#100a18}
.tt-btn{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:3px;cursor:pointer;transition:background .08s,color .08s,border-color .08s,opacity .08s;font-family:'Rajdhani',sans-serif;font-size:12px;letter-spacing:.08em;color:var(--muted);text-align:left;display:flex;align-items:center;gap:8px;margin-bottom:5px}
.tt-btn::before{content:'↻';font-size:13px;color:var(--cam)}
.tt-btn:hover{border-color:var(--cam);color:var(--text)}
.tt-btn.active{border-color:var(--cam);color:var(--cam);background:#100a18}
.cin-btn{width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--hot);border-radius:3px;cursor:pointer;transition:background .08s,color .08s,border-color .08s,opacity .08s;font-family:'Rajdhani',sans-serif;font-size:12px;letter-spacing:.1em;color:var(--hot);text-align:left;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cin-btn::before{content:'▶';font-size:10px}
.cin-btn:hover{background:#1a0d08;color:var(--text)}
.cin-btn.playing{background:#1a0d08;color:var(--text)}
#sfx-toggle{position:fixed;left:14px;bottom:14px;z-index:8;padding:7px 11px;background:var(--panel);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:10px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:7px;transition:all .15s;opacity:.85}
#sfx-toggle:hover{border-color:var(--accent);color:var(--text);opacity:1}
#sfx-toggle .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok);transition:all .15s}
#sfx-toggle.off{color:var(--muted)}
#sfx-toggle.off .dot{background:var(--muted);box-shadow:none}
#ar-btn{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:9;padding:9px 16px;background:var(--accent);border:1px solid var(--accent);border-radius:4px;color:#0b0b0b;font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .15s;box-shadow:0 2px 14px rgba(0,0,0,.35)}
#ar-btn:hover{filter:brightness(1.1)}
#ar-btn:active{transform:translateX(-50%) scale(.97)}
#ar-exit{position:fixed;top:14px;right:14px;z-index:10000;padding:8px 14px;background:rgba(0,0,0,.6);border:1px solid #fff;border-radius:4px;color:#fff;font-family:'Rajdhani',sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;display:none}
#ar-hint{position:fixed;left:50%;transform:translateX(-50%);bottom:64px;z-index:10000;padding:8px 14px;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;font-family:'Rajdhani',sans-serif;font-size:11px;letter-spacing:.08em;display:none;text-align:center}
.cin-btn.playing::before{content:'■'}
#hotspot-layer{position:fixed;inset:0;pointer-events:none;z-index:5}
.hs-sprite{position:absolute;pointer-events:none;transform:translate(-50%,-50%);display:none}
.hs-ring{width:44px;height:44px;border-radius:50%;border:2px solid var(--hot);opacity:.85;animation:hs-pulse 1.8s ease-in-out infinite}
.hs-dot{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:9px;height:9px;border-radius:50%;background:var(--hot)}
@keyframes hs-pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.4);opacity:.35}}
.hs-sprite.clickable{pointer-events:auto;cursor:pointer}
.annot-marker{position:absolute;pointer-events:auto;cursor:pointer;transform:translate(-50%,-50%);display:none;border-radius:50%;border:2px solid #000;box-sizing:border-box;transition:box-shadow .2s ease,transform .2s ease}
body.wce-cascade-open .annot-marker,
body.wce-cascade-open .hs-sprite,
body.wce-cascade-open #hotspot-layer > img{display:none !important}
.annot-marker:hover{transform:translate(-50%,-50%) scale(1.15)}
.annot-popup{position:fixed;z-index:10001;max-width:320px;background:rgba(10,10,12,.92);border:1px solid var(--accent,#c8a96e);border-radius:6px;padding:14px 16px;color:#fff;font-family:'Rajdhani',sans-serif;font-size:14px;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.annot-popup video{width:100%;border-radius:4px;display:block}
.annot-popup-close{position:absolute;top:6px;right:8px;cursor:pointer;font-size:16px;opacity:.7;line-height:1}
.annot-popup-close:hover{opacity:1}
.wce-overlay-thumb{position:fixed;z-index:6;cursor:pointer;background-size:cover;background-position:center;border:2px solid rgba(255,255,255,.85);box-shadow:0 2px 12px rgba(0,0,0,.45);transition:transform .15s ease,border-color .15s ease}
body:not(.wce-editing-mode) .wce-overlay-thumb:not(.wce-overlay-image):hover{transform:scale(1.08);border-color:var(--accent)}
.wce-overlay-thumb.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 2px 12px rgba(0,0,0,.45)}
.wce-overlay-text{position:fixed;z-index:6;pointer-events:none;font-family:'Rajdhani',sans-serif;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.6);white-space:nowrap}
.wce-overlay-linked{cursor:pointer !important;pointer-events:auto !important;transition:transform .15s ease,filter .15s ease}
body:not(.wce-editing-mode) .wce-overlay-linked:hover{transform:scale(1.08);filter:brightness(1.15)}
.wce-overlay-group{position:fixed;z-index:5;background:rgba(16,16,19,.85);border:1px solid rgba(255,255,255,.15);border-radius:8px;overflow:hidden;transition:width .25s ease}
.wce-group-header{display:flex;align-items:center;gap:6px;padding:6px 10px;cursor:pointer;font-family:'Rajdhani',sans-serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text);background:rgba(255,255,255,.06)}
body:not(.wce-editing-mode) .wce-group-header{transition:transform .25s ease,height .25s ease,width .25s ease}
.wce-group-arrow{font-size:9px;color:var(--accent);flex-shrink:0}
.wce-group-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.wce-group-body{position:relative;overflow:hidden}
body:not(.wce-editing-mode) .wce-group-body{transition:height .25s ease,width .25s ease}
.wce-group-body .wce-overlay-thumb,.wce-group-body .wce-overlay-text{position:absolute}
</style>

.sr select{font-family:'Rajdhani',sans-serif;font-size:75%;letter-spacing:0.11em;font-weight:500;font-style:normal;text-transform:none;}

.sr select{font-family:'Rajdhani',sans-serif;font-size:75%;letter-spacing:0.11em;font-weight:500;font-style:normal;text-transform:none;}

<script type="module">
import * as THREE         from 'three';
import { computeBoundsTree, disposeBoundsTree, acceleratedRaycast } from 'three-mesh-bvh';
import {OrbitControls}   from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader}      from 'three/addons/loaders/GLTFLoader.js';

// Override default Three.js raycaster with BVH
THREE.BufferGeometry.prototype.computeBoundsTree = computeBoundsTree;
THREE.BufferGeometry.prototype.disposeBoundsTree = disposeBoundsTree;
THREE.Mesh.prototype.raycast = acceleratedRaycast;
import {RGBELoader}      from 'three/addons/loaders/RGBELoader.js';
import {EXRLoader}       from 'three/addons/loaders/EXRLoader.js';
import {GroundedSkybox}  from 'three/addons/objects/GroundedSkybox.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
import {RectAreaLightUniformsLib} from 'three/addons/lights/RectAreaLightUniformsLib.js';
import {EffectComposer}  from 'three/addons/postprocessing/EffectComposer.js';

// entirely, and the model is still fully downloadable via the Network tab
// regardless. This only raises the bar against the most casual case: a
// visitor right-clicking to view source, or reflexively hitting F12.
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
  const k = e.key;
  const blocked =
    k === 'F12' ||
    (e.ctrlKey && e.shiftKey && (k === 'I' || k === 'i' || k === 'J' || k === 'j' || k === 'C' || k === 'c')) ||
    (e.metaKey && e.altKey && (k === 'I' || k === 'i' || k === 'J' || k === 'j')) ||   // macOS Cmd+Opt+I/J
    (e.ctrlKey && (k === 'U' || k === 'u'));   // view-source
  if(blocked) e.preventDefault();
});

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
// AgX matches Blender 4.x EEVEE's default view transform far better than ACES.
renderer.toneMapping=(CFG.grade && CFG.grade.tone_mapping==='AgX' && THREE.AgXToneMapping!==undefined)
  ? THREE.AgXToneMapping : THREE.ACESFilmicToneMapping;
renderer.outputColorSpace=THREE.SRGBColorSpace;
// Exposure in stops (EV), mirroring Blender Color Management › Exposure.
renderer.toneMappingExposure=Math.pow(2,_initHdri?(_initHdri.grade_exposure||0):((CFG.grade && CFG.grade.exposure)||0));

// ── Performance Stats ────────────────────────────────────────────────────
// FPS/frame-time are measured directly and are fully accurate. CPU/GPU here
// are NOT what a system monitor shows — CPU is the fraction of each frame's
// time budget actually spent doing work on the main thread; GPU is the
// measured render-command execution time reported by the browser's own
// WebGL timer query extension, where supported. Real signals, real
// measurements — just not the same thing an OS-level monitor reports.
const _wceStats = {
  enabled: false,
  frameTimes: [],
  maxSamples: 120,
  lastFrameStart: null,
  fps: 0,
  frameTimeMs: 0,
  cpuPct: 0,
  gpuMs: null,
  gpuSupported: false,
  gpuExt: null,
  gpuQueryPool: [],
  gpuPending: [],
};
(function _wceStatsInitGpu(){
  const gl = renderer.getContext();
  const ext2 = gl.getExtension('EXT_disjoint_timer_query_webgl2');
  if(ext2){ _wceStats.gpuExt = ext2; _wceStats.gpuIsWebGL2 = true; _wceStats.gpuSupported = true; return; }
  const ext1 = gl.getExtension('EXT_disjoint_timer_query');
  if(ext1){ _wceStats.gpuExt = ext1; _wceStats.gpuIsWebGL2 = false; _wceStats.gpuSupported = true; }
})();
function _wceStatsBeginGpuQuery(){
  if(!_wceStats.enabled || !_wceStats.gpuSupported) return null;
  const gl = renderer.getContext();
  const ext = _wceStats.gpuExt;
  let query = _wceStats.gpuQueryPool.pop();
  if(!query) query = _wceStats.gpuIsWebGL2 ? gl.createQuery() : ext.createQueryEXT();
  if(_wceStats.gpuIsWebGL2) gl.beginQuery(ext.TIME_ELAPSED_EXT, query);
  else ext.beginQueryEXT(ext.TIME_ELAPSED_EXT, query);
  return query;
}
function _wceStatsEndGpuQuery(query){
  if(!query) return;
  const gl = renderer.getContext();
  const ext = _wceStats.gpuExt;
  if(_wceStats.gpuIsWebGL2) gl.endQuery(ext.TIME_ELAPSED_EXT);
  else ext.endQueryEXT(ext.TIME_ELAPSED_EXT);
  _wceStats.gpuPending.push(query);
}
function _wceStatsPollGpuQueries(){
  if(!_wceStats.gpuSupported) return;
  const gl = renderer.getContext();
  const ext = _wceStats.gpuExt;
  const stillPending = [];
  for(const query of _wceStats.gpuPending){
    const available = _wceStats.gpuIsWebGL2
      ? gl.getQueryParameter(query, gl.QUERY_RESULT_AVAILABLE)
      : ext.getQueryObjectEXT(query, ext.QUERY_RESULT_AVAILABLE_EXT);
    const disjoint = gl.getParameter(ext.GPU_DISJOINT_EXT);
    if(available && !disjoint){
      const ns = _wceStats.gpuIsWebGL2
        ? gl.getQueryParameter(query, gl.QUERY_RESULT)
        : ext.getQueryObjectEXT(query, ext.QUERY_RESULT_EXT);
      _wceStats.gpuMs = ns/1e6;
      _wceStats.gpuQueryPool.push(query);
    } else if(available && disjoint){
      _wceStats.gpuQueryPool.push(query);
    } else {
      stillPending.push(query);
    }
  }
  _wceStats.gpuPending = stillPending;
}


const scene=new THREE.Scene();

// Persistent Ambient Light used two ways:
//  1. The old scene-wide CFG.grade.ambient_intensity (kept for back-compat).
//  2. Per-panel Ambient Light fallback (see _applyAmbientFallback) — updates
//     this same light's color/intensity when a panel has no effective HDRI.
const ambInt = (CFG.grade && CFG.grade.ambient_intensity) || 0.0;
const _ambientLight = new THREE.AmbientLight(0xffffff, ambInt);
scene.add(_ambientLight);

const cam=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,500);
cam.position.set(0,2,((CFG.camera&&CFG.camera.zoom_max)||15.0)*0.65);

// Whichever static camera's focal length is currently active (null when
// none — i.e. the main/default scene camera is in use). _updateCamFov()
// used to unconditionally fall back to CFG.camera (the main camera's own
// focal length) even while a DIFFERENT, specific static camera was active
// and its FOV had already been correctly set — a resize event (or anything
// else calling _updateCamFov()) would silently overwrite the correct,
// camera-specific FOV with the main camera's, with no relation to whichever
// camera the visitor actually had active at the time.
let _activeCamFocal=null,_activeCamSensor=null;

// Vertical FOV derived from the Scene's camera focal length + sensor width
// (physically correct horizontal→vertical conversion at the CURRENT aspect,
// so resizing the window keeps the same "lens feel" as Blender) — falls
// back to the default 45° if no active perspective camera was found.
function _computeVFov(focal, sensorW){
  if(!focal || !sensorW) return null;
  const hFov=2*Math.atan(sensorW/(2*focal));
  const vFov=2*Math.atan(Math.tan(hFov/2)/cam.aspect);
  return vFov*180/Math.PI;
}
function _updateCamFov(){
  const c=CFG.camera||{};
  const focal=_activeCamFocal!=null?_activeCamFocal:c.focal_length_mm;
  const sensorW=_activeCamSensor!=null?_activeCamSensor:c.sensor_width_mm;
  const vFovDeg=_computeVFov(focal, sensorW);
  if(vFovDeg!=null) cam.fov=vFovDeg;
}
_updateCamFov();
cam.updateProjectionMatrix();

// ── HDRI environment transform + ground flattening ──────────────────────────
let _equirectTex=null;     // raw HDR equirect (kept for the grounded skybox)
let _groundSky=null;
// Calibration: Blender's equirect azimuth (Z rotation) maps to three's Y with a
// constant offset under Y-up export. 0 covers the common case; if reflections
// read mirrored/offset on a curved body, this is the single knob to tweak.
const _ENV_AZIMUTH_OFFSET_DEG=0;
function _envEuler(){
  const r=(CFG.grade && CFG.grade.env_rotation)||[0,0,0];
  const d2r=Math.PI/180;
  // Blender mapping rotation is XYZ in its own space; the dominant control is
  // Z (azimuth) → three Y. three's azimuth runs opposite to Blender's, so the
  // Y term is NEGATED to keep +30° in Blender = +30° in the web.
  const x=(r[0]||0)*d2r;
  const y=-((r[2]||0)+_ENV_AZIMUTH_OFFSET_DEG)*d2r;
  const z=(r[1]||0)*d2r;
  return new THREE.Euler(x,y,z,'XYZ');
}
function _buildGroundedSkybox(){
  const h=CFG.hdri||{};
  if(!h.flatten_ground || !h.background || !_equirectTex) return;
  if(_groundSky){ scene.remove(_groundSky); _groundSky.geometry?.dispose?.(); _groundSky=null; }
  
  const floorZ = (h.ground_height != null) ? h.ground_height : 0.0;
  let groundRadius = (h.ground_radius != null) ? h.ground_radius : 25.0;
  // Ground mesh rotation/scale/offset are manual, web-only controls — fully
  // independent of the Scene's HDRI light rotation/scale (CFG.grade.env_*),
  // which only drive scene.environment/background above.
  const scaleMultiplier = Math.max(0.001, Math.abs(h.ground_scale != null ? h.ground_scale : 1));
  
  const shaderHeight = -floorZ * scaleMultiplier;
  let shaderRadius = groundRadius * scaleMultiplier;
  shaderRadius = Math.max(shaderRadius, 0.01);
  
  try{
    _groundSky = new GroundedSkybox(_equirectTex, shaderHeight, shaderRadius); 
    
    // Single Z-axis (azimuth) rotation — same Blender→three negation
    // convention as _envEuler(), but reading the decoupled ground value.
    const rotZ=(h.ground_rotation_z||0)*Math.PI/180;
    _groundSky.rotation.set(0,-rotZ,0);
    
    const offX=(h.ground_offset&&h.ground_offset[0])||0;
    const offY=(h.ground_offset&&h.ground_offset[1])||0;
    // Vertical Offset — a plain rigid shift of the whole dome, added last so
    // it never touches the shape math above (shaderHeight/shaderRadius).
    // Blender Z and three.js Y are the same up-axis here.
    const zOffset = h.ground_z_offset||0;
    // Blender's ground plane (X,Y) → three.js (X,Z); three's Y stays vertical.
    _groundSky.position.set(offX, floorZ * (1 - scaleMultiplier) + zOffset, offY);
    
    scene.add(_groundSky);
    if(typeof requestRender==='function') requestRender(500);
  }catch(e){console.warn('[WCE] grounded skybox unavailable:',e);}
}

// ── Multi-HDRI loader + switcher — each item carries its own strength/
//    background/rotation/scale. Loaded textures are cached so re-switching
//    back to a previously-seen HDRI is instant. ──────────────────────────────
const _hdriCache={};       // file URL -> {tex, envRT}
let _hdriActiveFile=null;

function _envEulerZ(rotZdeg){
  // Single Z-axis (yaw) rotation per HDRI item — same Blender→three azimuth
  // negation convention as _envEuler(), just driven by the item's own value
  // instead of the legacy scene-wide CFG.grade.env_rotation.
  const d2r=Math.PI/180;
  const y=-((rotZdeg||0)+_ENV_AZIMUTH_OFFSET_DEG)*d2r;
  return new THREE.Euler(0,y,0,'XYZ');
}

function _applyEnvironmentAndLight(item){
  // Show/hide ENVIRONMENTS_<Name> / LIGHTS_<Name> nodes for this panel's
  // choices, additively alongside the always-on common layers
  // (ENVIRONMENT_common, LIGHTS) — unless a choice is null (meaning that
  // dropdown was set to None), which opts this panel out of its common
  // layer too. Mirrors applyGeoToggle's node-visibility approach, reusing
  // the same findNode mechanism since these are exported the same way
  // GEOMETRIES_ collections already are.
  const envSets=CFG.environment_sets||[];
  const lightSets=CFG.light_sets||[];
  const envChoice=(item&&item.environment)?item.environment.replace(/ /g,'_'):null;
  const lightChoice=(item&&item.light)?item.light.replace(/ /g,'_'):null;

  envSets.forEach(name=>{
    const n=findNode(name);
    if(n) n.visible=(name.replace(/ /g,'_')===envChoice);
  });
  if(CFG.environment_common_exists){
    const cn=findNode('ENVIRONMENTS_COMMON');
    if(cn) cn.visible=(envChoice!=null);
  }
  lightSets.forEach(name=>{
    const n=findNode(name);
    if(n) n.visible=(name.replace(/ /g,'_')===lightChoice);
  });
  if(CFG.light_common_exists){
    const ln=findNode('LIGHTS');
    if(ln) ln.visible=(lightChoice!=null);
  }

  // Area lights (RectAreaLight) aren't part of the glTF node hierarchy at
  // all — KHR_lights_punctual doesn't cover area lights — so they can't
  // ride along with the node-visibility switching above. They're added
  // directly to the Three.js scene instead (see the GLTFLoader callback),
  // each tagged with which rig it came from at export time. Toggle them
  // here too, using the exact same on/off rule as the mesh-based lights,
  // so an environment that doesn't include a given rig no longer keeps
  // that rig's area lights lit forever.
  _areaLights.forEach(light=>{
    const rawRig=light.userData.wceRig;
    if(!rawRig){ light.visible=true; return; }   // pre-fix export, no rig tag — always on
    const rig=rawRig.replace(/ /g,'_');
    light.visible=(rig==='LIGHTS')?(lightChoice!=null):(rig===lightChoice);
  });
}

function _applyAmbientFallback(item){
  // Flat fallback lighting for a panel with no effective HDRI (no file of
  // its own and no usable Common HDRI). Mirrors the Blender-side Ambient
  // Light branch in _wce_push_hdri_to_world: clear any environment/
  // background texture and light the scene with a plain AmbientLight
  // instead, defaulting to solid black rather than leaving whatever was
  // previously rendered (or an undefined/transparent canvas).
  scene.environment=null;
  if(scene.background && scene.background.isTexture) scene.background=null;
  scene.background=new THREE.Color(0,0,0);
  if(_groundSky){ scene.remove(_groundSky); _groundSky.geometry?.dispose?.(); _groundSky=null; }
  const c=(item&&item.ambient_color)||[1,1,1];
  _ambientLight.color.setRGB(c[0]??1,c[1]??1,c[2]??1);
  _ambientLight.intensity=(item&&item.ambient_strength!=null)?item.ambient_strength:0.3;
  // Fallback look/post-process — same fields _snapHDRI applies for a real
  // HDRI, sourced here from this panel's own (or scene-default) values so a
  // no-HDRI panel still gets a deliberate grade instead of inheriting
  // whatever the previously-active HDRI left behind.
  if(typeof renderer!=='undefined' && renderer)
    renderer.toneMappingExposure=Math.pow(2,(item&&item.grade_exposure)||0);
  if(typeof gradePass!=='undefined' && gradePass && gradePass.material){
    const u=gradePass.material.uniforms;
    u.brightness.value=(item&&item.grade_brightness!=null)?item.grade_brightness:1.0;
    u.contrast.value=(item&&item.grade_contrast!=null)?item.grade_contrast:1.0;
    u.saturation.value=(item&&item.grade_saturation!=null)?item.grade_saturation:1.0;
  }
  if(typeof bloomPass!=='undefined' && bloomPass){
    bloomPass.strength=(item&&item.grade_bloom!=null)?item.grade_bloom:0.25;
    bloomPass.threshold=(item&&item.grade_bloom_threshold!=null)?item.grade_bloom_threshold:0.88;
  }
  scene.environmentIntensity=(item&&item.strength!=null)?item.strength:1.0;
  _hdriActiveFile=null;
  if(typeof requestRender==='function') requestRender(400);
}

function _snapHDRI(item,tex,envRT){
  // Instant application — called directly on first load and at the midpoint
  // of the cross-fade (when intensity is already 0) when transitioning.
  _equirectTex=tex;
  scene.environment=envRT.texture;
  // A real HDRI is driving lighting now — the per-panel Ambient Light
  // fallback doesn't apply, so switch it fully off. (Previously this fell
  // back to the shared scene-wide CFG.grade.ambient_intensity, which is the
  // same value every no-HDRI environment's Ambient toggle writes to — so an
  // ambient light left on by one no-HDRI environment would keep bleeding
  // into any HDRI environment switched to afterwards. This panel's own
  // ambient_strength is guaranteed 0 whenever it has an image, so 0 here is
  // always correct.)
  _ambientLight.intensity=0;
  const targetStrength=(item.strength!=null)?item.strength:1.0;
  scene.environmentIntensity=targetStrength;
  const _eul=_envEulerZ(item.rotation_z);
  if(scene.environmentRotation) scene.environmentRotation.copy(_eul);
  CFG.hdri=CFG.hdri||{};
  CFG.hdri.file=item.file;
  CFG.hdri.background=!!item.background;
  CFG.hdri.flatten_ground=!!item.flatten_ground;
  CFG.hdri.ground_height=item.ground_height;
  CFG.hdri.ground_radius=item.ground_radius;
  CFG.hdri.ground_rotation_z=item.ground_rotation_z;
  CFG.hdri.ground_scale=item.ground_scale;
  CFG.hdri.ground_offset=item.ground_offset;
  CFG.hdri.ground_z_offset=item.ground_z_offset;
  if(item.background){
    scene.background=envRT.texture;
    scene.backgroundIntensity=targetStrength;
    if(scene.backgroundRotation) scene.backgroundRotation.copy(_eul);
    _buildGroundedSkybox();
  }else{
    if(_groundSky){ scene.remove(_groundSky); _groundSky.geometry?.dispose?.(); _groundSky=null; }
    if(scene.background && scene.background.isTexture) scene.background=null;
  }
  if(typeof renderer!=='undefined' && renderer)
    renderer.toneMappingExposure=Math.pow(2,item.grade_exposure||0);
  if(typeof gradePass!=='undefined' && gradePass && gradePass.material){
    const u=gradePass.material.uniforms;
    u.brightness.value=(item.grade_brightness!=null)?item.grade_brightness:1.0;
    u.contrast.value=(item.grade_contrast!=null)?item.grade_contrast:1.0;
    u.saturation.value=(item.grade_saturation!=null)?item.grade_saturation:1.0;
  }
  if(typeof bloomPass!=='undefined' && bloomPass){
    bloomPass.strength=(item.grade_bloom!=null)?item.grade_bloom:0.25;
    bloomPass.threshold=(item.grade_bloom_threshold!=null)?item.grade_bloom_threshold:0.88;
  }
  _hdriActiveFile=item.file;
}

function _applyHDRITexture(item,tex,envRT){
  _snapHDRI(item,tex,envRT);
  if(typeof requestRender==='function') requestRender(800);
}

function _loadHDRIItem(item){
  // Environment/Light switching and the Ambient Light fallback both work
  // independently of whether this panel has an HDRI file — run first,
  // unconditionally, even when there is no panel at all (item is null,
  // e.g. zero Environment entries created) so the scene always ends up in a
  // deliberate state (solid black + flat ambient) rather than whatever
  // Three.js's own defaults happen to leave it in.
  _applyEnvironmentAndLight(item);
  if(!item || !item.file){ _applyAmbientFallback(item); return; }
  const cached=_hdriCache[item.file];
  if(cached){ _applyHDRITexture(item,cached.tex,cached.envRT); return; }
  // Format-aware: an HDRI exported as .exr is real OpenEXR data now (see
  // _wce_hdri_ext on the Python side) — RGBELoader can only parse Radiance/
  // HDR, so using it unconditionally on every file silently failed for any
  // real EXR source. Both loaders share the same load()/callback shape, so
  // nothing below this line needs to know which one actually ran.
  const _hdriLoader = /\.exr$/i.test(item.file) ? new EXRLoader() : new RGBELoader();
  _hdriLoader.load(item.file,(t)=>{
    t.mapping=THREE.EquirectangularReflectionMapping;
    // PMREM prefiltering gives EEVEE-like roughness/reflection response
    // instead of a raw equirect lookup.
    const _pmrem=new THREE.PMREMGenerator(renderer);
    _pmrem.compileEquirectangularShader();
    const _envRT=_pmrem.fromEquirectangular(t);
    _pmrem.dispose();   // dispose the generator only — t/_envRT stay live & cached
    _hdriCache[item.file]={tex:t, envRT:_envRT};
    _applyHDRITexture(item,t,_envRT);
  },undefined,(e)=>{console.warn('[WCE] HDRI load failed:',item.file,e);});
}

// buildHDRISwitcher -> ui.js
// ── Smooth transitions (materials + geometry) ───────────────────────────────
const _TRANS=CFG.transitions||{};
window._TRANS=_TRANS;
const _matTweens=[];   // {mat, from:{...}, to:{...}, t, dur}
const _geoTweens=[];   // {meshes:[{mesh, origMats, clones}], dir, t, dur, hideAtEnd:[nodes]}
let _lastTransT=performance.now();
function _bumpAnim(ms){ if(typeof _animActiveUntil!=='undefined') _animActiveUntil=Math.max(_animActiveUntil,performance.now()+(ms||400)); }

function _tickTransitions(dt){
  // Material colour / metallic / roughness / emissive lerps.
  for(let i=_matTweens.length-1;i>=0;i--){
    const w=_matTweens[i]; w.t+=dt*1000;
    const k=Math.min(1,w.t/w.dur);
    w.mat.color.lerpColors(w.from.color,w.to.color,k);
    w.mat.metalness=w.from.metalness+(w.to.metalness-w.from.metalness)*k;
    w.mat.roughness=w.from.roughness+(w.to.roughness-w.from.roughness)*k;
    if(w.mat.emissive) w.mat.emissive.lerpColors(w.from.emissive,w.to.emissive,k);
    w.mat.needsUpdate=true;
    if(k>=1) _matTweens.splice(i,1);
  }
  // Geometry dither-dissolve (alpha-hash opacity ramps on temporary clones).
  for(let i=_geoTweens.length-1;i>=0;i--){
    const w=_geoTweens[i]; w.t+=dt*1000;
    const k=Math.min(1,w.t/w.dur);
    const op=(w.dir>0)?k:(1-k);
    w.meshes.forEach(rec=>{
      rec.clones.forEach(c=>{ c.opacity=op; c.needsUpdate=true; });
    });
    if(k>=1){
      // Restore original materials; control visibility at the NODE level only
      // (never leave a child mesh individually hidden, or it goes missing when
      // the node is shown again).
      w.meshes.forEach(rec=>{ rec.mesh.material=rec.wasArr?rec.origMats:rec.origMats[0]; });
      if(w.node && w.dir<0) w.node.visible=false;
      _geoTweens.splice(i,1);
    }
  }
}

function _meshesUnder(node){
  const out=[]; if(node) node.traverse(o=>{ if(o.isMesh) out.push(o); }); return out;
}
// Begin a dissolve for a node: dir>0 fades in (node becomes visible), dir<0
// fades out (node hidden at the end). Visibility is ALWAYS controlled on the
// node, never on individual child meshes.
function _geoDissolveNode(node,dir){
  if(!node) return;
  const meshes=_meshesUnder(node);
  if(!meshes.length){ node.visible=(dir>0); return; }
  // Finalise any in-flight dissolve touching these meshes: restore originals and
  // settle node visibility, so we never strand a mesh on a clone or hidden state.
  const meshSet=new Set(meshes);
  for(let i=_geoTweens.length-1;i>=0;i--){
    const tw=_geoTweens[i];
    if(tw.meshes.some(r=>meshSet.has(r.mesh))){
      tw.meshes.forEach(r=>{ r.mesh.material=r.wasArr?r.origMats:r.origMats[0]; });
      if(tw.node) tw.node.visible=(tw.dir>0);
      _geoTweens.splice(i,1);
    }
  }
  node.visible=true;                  // visible for the whole transition
  const recs=meshes.map(mesh=>{
    const wasArr=Array.isArray(mesh.material);
    const origMats=wasArr?[...mesh.material]:[mesh.material];
    const clones=origMats.map(m=>{
      const c=m.clone();
      c.alphaHash=true;          // order-independent dithered transparency
      c.transparent=false; c.depthWrite=true;
      c.opacity=(dir>0)?0:1;
      c.needsUpdate=true;        // force shader recompile so alphaHash takes effect
      return c;
    });
    mesh.material=wasArr?clones:clones[0];
    return {mesh,wasArr,origMats,clones};
  });
  _geoTweens.push({meshes:recs,node,dir,t:0,dur:(_TRANS.geo_ms||180)});
  _bumpAnim((_TRANS.geo_ms||180)+200);
}

// ── Geometry Opacity: On/Off Switch + Flicker ───────────────────────────────
// Both reuse _geoDissolveNode above — a plain client-side material fade, with
// zero dependency on glTF animation channels or KHR_animation_pointer.
function _triggerGeoToggle(def){
  const nodes=(def.geo_nodes||[]).map(_findGeoTarget).filter(Boolean);
  if(!nodes.length) return;
  const prev=animState[def.name]??0;
  const next=prev>0?0:1;
  animState[def.name]=next;
  nodes.forEach(node=>{
    if(_TRANS.geometry) _geoDissolveNode(node, next>0?1:-1);
    else node.visible=(next>0);
  });
  const btn=document.querySelector(`.anim-btn[data-anim="${def.name}"]`);
  if(btn) btn.classList.toggle('playing', next>0);
  if(typeof requestRender==='function') requestRender(300);
}

const _geoFlickerTimers={};
function _triggerGeoFlicker(def){
  const nodes=(def.geo_nodes||[]).map(_findGeoTarget).filter(Boolean);
  if(!nodes.length) return;
  // Re-triggering restarts cleanly rather than stacking two competing loops.
  if(_geoFlickerTimers[def.name]) _geoFlickerTimers[def.name].forEach(t=>clearTimeout(t));
  const count=Math.max(1, def.flicker_count||5);
